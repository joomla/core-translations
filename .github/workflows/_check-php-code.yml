name: Check PHP Code

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - l10n_crowdin_package_v5
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  check-php-code:
    if: (github.repository == 'joomla/core-translations') || (github.repository != 'joomla/core-translations' && github.event_name != 'schedule')
    runs-on: ubuntu-latest
    permissions: read-all

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Check PHP syntax errors
        uses: StephaneBour/actions-php-lint@e81e93ef8d421a09e434b715766a89679dd974dc # 8.4
        with:
          dir: '.'
