JLIB_RULES_SETTING_NOTES="Ako promenite podešavanje, ono će se primeniti na ovu i sve podređene grupe, komponente i sadržaj. Imajte na umu da <em><strong>Odbijeno</strong></em> poništava svako nasleđeno podešavanje i podešavanje u bilo kojoj podređenoj grupi, komponenti ili sadržaju. U slučaju sukoba podešavanja, <em><strong>Odbij</strong></em> ima prednost. <em><strong>Nije postavljeno</strong></em> je ekvivalentno stanju <em><strong>Odbijeno</strong></em>, ali se može promeniti u podređenim grupama, komponentama i sadržaju."
JLIB_RULES_SETTING_NOTES_ITEM="Ako promenite podešavanje, ono će se primeniti na ovu stavku. Imajte na umu da:<br><em><strong>Nasleđeno</strong></em> znači da će se koristiti dozvole iz globalne konfiguracije, nadređene grupe i kategorije.<br><em><strong>Odbijeno</strong></em> znači da grupa koja se uređuje ne može da preduzme ovu radnju na ovoj stavci, bez obzira na globalnu konfiguraciju, nadređenu grupu ili podešavanja kategorije.<br><em><strong>Dozvoljeno</strong></em> znači da će grupa koja se uređuje moći da preduzme ovu radnju za ovu stavku (ali ako je to u sukobu sa globalnom konfiguracijom, nadređenom grupom ili kategorijom, neće imati efekta; sukob će biti označen kao <em><strong>Nije dozvoljeno (Nasleđeno)</strong></em> u Izračunatim podešavanjima)."
