MOD_RELATED_ITEMS="Članci - Srodni"
MOD_RELATED_ITEMS_LAYOUT_DEFAULT="Podrazumevano"
MOD_RELATED_XML_DESCRIPTION="Ovaj modul prikazuje druge članke koji su povezani sa onim koji se trenutno pregleda. Ovi odnosi se uspostavljaju preko ključnih reči.<br>Sve ključne reči trenutnog članka pretražuju se prema svim ključnim rečima svih ostalih objavljenih članaka. Na primer, možda imate članak o &quot;Uzgoju papagaja&quot; i drugi o &quot;Ručnom odgajanju crnih kakadua&quot;. Ako u oba članka uključite ključnu reč &quot;papagaj&quot;, modul srodnih stavki će prikazati članak &quot;Uzgoj papagaja&quot; kada gledate &quot;Ručno odgajanje crnih kakadua&quot; i obrnuto."

