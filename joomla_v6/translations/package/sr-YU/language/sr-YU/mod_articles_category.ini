MOD_ARTICLES_CATEGORY_FIELD_MODE_DESC="Izaberite način rada koji želite da koristite. Ako je izabran normalni način rada, konfigurišite modul i on će prikazati statičku listu članaka u stavkama menija kojima ste dodelili modul. Ako je izabran dinamički način rada, i dalje možete normalno konfigurisati modul, ali se opcija kategorije više neće koristiti. Umesto toga, modul će dinamički otkriti da li ste u prikazu kategorije i prikazaće listu članaka iz te kategorije. Kada je izabran dinamički način rada, najbolje je ostaviti modul podešen da se prikazuje na svim stranicama, jer će on dinamički odlučiti da li da išta prikaže."
