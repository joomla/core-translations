COM_JOOMLAUPDATE_CONFIG_AUTOMATED_UPDATES_DESC="Automatska ažuriranja su dostupna samo za sajtove koji su javno dostupni na internetu. Ako je vaš sajt iza firewall-a ili nije javno dostupan, na primer lokalno test okruženje, moraćete da vršite ažuriranja ručno.<br><br><strong>Napomena:</strong> uključivanjem automatskih ažuriranja vaš sajt će biti registrovan kod odgovarajućeg servisa koji obezbeđuje Joomla! projekat.<br>Registracija omogućava Joomla projektu pristup informacijama o vašem sajtu i serverskom okruženju, konkretno URL sajta, verziji PHP-a, tipu i verziji baze podataka, verziji CMS-a i tipu i verziji serverskog operativnog sistema.<br>Ove informacije se koriste isključivo za unapređenje servisa."
