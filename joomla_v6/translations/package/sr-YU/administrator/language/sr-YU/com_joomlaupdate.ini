COM_JOOMLAUPDATE_UPDATE_FAILED_MAIL_BODY="Ovu email poruku NE šalje projekat Joomla!. Automatski je šalje vaš sopstveni sajt,\n{SITENAME} - {URL} \n\n================================================================================\nINFORMACIJE O AŽURIRANJU\n================================================================================\nVaš sajt nije mogao biti ažuriran sa verzije {OLDVERSION} na verziju {NEWVERSION}.\nZa više informacija o otklanjanju grešaka proverite datoteku dnevnika '/administrator/logs/joomla_update.php'.\nOvu poruku vam šalje vaš sajt.\nProjekat Joomla! vas nikada neće direktno kontaktirati.\n================================================================================\nZAŠTO DOBIJAM OVU PORUKU?\n================================================================================\nOvu poruku je automatski poslala Joomla!, softver na kojem radi vaš sajt.\nUključili ste automatska ažuriranja na svom sajtu, a pokušaj instalacije takvog ažuriranja pokreće ovu poruku.\nAko ne razumete šta je Joomla! i šta treba da uradite, molimo vas da ne kontaktirate projekat Joomla!.\nOni vam NE šalju ovu poruku i ne mogu da vam pomognu. Umesto toga, obratite se osobi koja je napravila vaš sajt ili njime upravlja.\n================================================================================\nKO MI JE POSLAO OVU PORUKU?\n================================================================================\nOvu poruku vam šalje vaš sopstveni sajt, {SITENAME}"
