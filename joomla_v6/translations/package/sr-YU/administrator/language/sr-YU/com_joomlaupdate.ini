COM_JOOMLAUPDATE_ERRORMODAL_BODY_FORBIDDEN="<p>Joomla ne može da komunicira sa datotekom <code>administrator/components/com_joomlaupdate/extract.php</code> koja izvodi ažuriranje. To se obično dešava iz jednog od sledećih razloga:</p><ul><li>Konfiguraciona datoteka servera u korenu vašeg sajta, kao što je <code>.htaccess</code> ili <code>web.config</code>, sprečava pristup ovoj datoteci.</li><li>Konfiguracija vašeg servera sprečava pristup ovoj datoteci.</li><li>Vlasništvo i dozvole ove datoteke ne dozvoljavaju vašem serveru pristup ovoj datoteci.</li><li>Vaš sajt je iza balansera opterećenja ili CDN-a, ali njegova konfiguracija ne dozvoljava pristup ovoj datoteci ili blokira slanje naredbi ka njoj.</li><li>Iako se datoteci može pristupiti, slanje naredbi ka njoj blokira zaštita vašeg servera, kao što je mod_security2.</li></ul><p>Ako niste sigurni, obratite se svom hosting provajderu.</p>"
COM_JOOMLAUPDATE_ERRORMODAL_BODY_INVALIDLOGIN="<p>Joomla ažuriranje ne može ispravno da komunicira sa datotekom <code>administrator/components/com_joomlaupdate/extract.php</code> koja izvodi ažuriranje. To se obično dešava iz jednog od sledećih razloga:</p><ul><li>Datoteka <code>administrator/components/com_joomlaupdate/update.php</code>, koja sadrži uputstva za primenu ažuriranja, nije mogla biti kreirana, na primer zbog problema sa dozvolama.</li><li>Gore pomenutu datoteku ne može da pročita skripta <code>extract.php</code> zbog problema sa dozvolama.</li><li>Vaš brauzer, mrežna oprema ili server kvari lozinku koju iz bezbednosnih razloga šaljemo sa svakim zahtevom ka <code>extract.php</code></li></ul><p>Pokušajte da koristite drugi brauzer, bez instaliranih ekstenzija, po mogućstvu na drugom računaru povezanom na internet preko drugog provajdera. Ako greška ostane, možda biste želeli da kontaktirate svog hosting provajdera.</p>"
COM_JOOMLAUPDATE_ERRORMODAL_BODY_SERVERERROR="<p>Joomla Update je naišao na serversku grešku prilikom primene ažuriranja na vašem sajtu.</p><p>Vaš sajt možda nije u potpunosti nadograđen na novu verziju Joomle.</p>"
