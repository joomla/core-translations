COM_GUIDEDTOURS_TOUR_WHATSNEW_6_1_DESCRIPTION="<h1 class=\"fw-medium\">Dobrodošli u Joomla 6.1!</h1><p>Joomla 6.1 donosi ključna poboljšanja zbog kojih je izrada sajtova lakša, bezbednija i fleksibilnija. Ova tura vam ukratko daje najvažnije.</p><div class=\"row align-items-center mb-4 pt-4 border-top border-1\"><div class=\"col-md-6 col-lg-7\"><h2 class=\"mb-3\">Zaštita od spama se vraća uz CAPTCHA zasnovanu na dokazu rada</h2><p>Bez naloga i API-ja, prilagođena privatnosti i pristupačna, ova CAPTCHA tiho rešava matematičke zagonetke u pozadini, nevidljiva za posetioce.</p><p>Da biste je omogućili, idite na <em>Ekstenzije</em> -&gt; <em>Dodaci</em>, potražite <strong>captcha</strong>, omogućite je i postavite kao podrazumevanu u Globalnoj konfiguraciji.</p></div><div class=\"col-md-6 col-lg-5 text-center text-md-start mb-3\"><img class=\"img-fluid\" src=\"media/com_guidedtours/images/6_1/captcha.jpg\" alt=\"CAPTCHA prikazuje stanja verifikacije u toku i verifikovano\" width=\"600\" height=\"250\"></div></div><div class=\"row align-items-center border-top border-1 pt-4\"><div class=\"col-md-6 col-lg-5 text-center text-md-start mb-3\"><img class=\"img-fluid\" src=\"media/com_guidedtours/images/6_1/workflows.jpg\" alt=\"Grafički prikaz osnovnog toka rada\" width=\"600\" height=\"350\"></div><div class=\"col-md-6 col-lg-7 mb-3\"><h2 class=\"mb-3\">Tok sadržaja na prvi pogled uz vizuelni editor toka rada</h2><p>Lakše upravljajte tokom rada sa sadržajem pomoću novog interaktivnog dijagrama toka rada koji vam omogućava da vidite ceo proces objavljivanja.</p><p>Omogućite Tokove rada u <em>Članci</em> -&gt; <em>Tokovi rada</em> i potražite dugme grafa.</p></div></div><div class=\"row align-items-center border-top border-1 pt-4\"><div class=\"col-md-6 col-lg-7 mb-3\"><h2 class=\"mb-3\">Tri nove opcije medijskih prilagođenih polja: audio, video &amp; dokumenti</h2><p>Kada kreirate prilagođena polja za svoj sadržaj, sada možete da omogućite autorima sadržaja da uključe bilo koju vrstu medija, ne samo slike.</p><p>Mediji se prikazuju kao HTML5 &lt;audio&gt;, &lt;video&gt; ili veze ka dokumentima (PDF, tabele...).</p></div><div class=\"col-md-6 col-lg-5 text-center text-md-start mb-3\"><img class=\"img-fluid\" src=\"media/com_guidedtours/images/6_1/media.jpg\" alt=\"Tri opcije medijskog polja: audio, video i dokument\" width=\"600\" height=\"350\"></div></div><div class=\"row align-items-center border-top border-1 pt-4\"><div class=\"col-12 mb-3\"><h2 class=\"mb-3\">Pametniji moduli sa verzijama i višejezičkim asocijacijama</h2><p>Joomla već dugo ima istoriju verzija za članke. Ista mogućnost sada je proširena i na module.<br>Ako vodite višejezični sajt, sada možete da asocirate instance modula na različitim jezicima, na isti način na koji asocirate članke na različitim jezicima.</p><h2>Ostala vredna pomena poboljšanja</h2><ul class=\"mb-3\"><li>Podrška za skraćenice <strong>&lt;abbr&gt;</strong> u TinyMCE editoru obogaćenog teksta, semantički ispravna i poboljšava pristupačnost (potražite novo dugme Skraćenica u TinyMCE traci sa alatkama prilikom uređivanja sadržaja).</li><li>Status jezičkih nadjačavanja &amp; poboljšanja korisničkog iskustva za brzo kreiranje nedostajućih nadjačavanja (pokazatelj statusa, lako uređivanje nadjačavanja).</li></ul></div></div>"
COM_GUIDEDTOURS_TOUR_WHATSNEW_6_1_TITLE="Šta je novo u Joomla 6.1!"

