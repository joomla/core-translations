PLG_CAPTCHA_POWCAPTCHA="CAPTCHA - Dokaz rada"
PLG_CAPTCHA_POWCAPTCHA_XML_DESCRIPTION="Ovaj CAPTCHA dodatak prikazuje matematički zadatak u korisnikovom brauzeru koji brauzer može automatski da reši. Namena mu nije da dokaže da je korisnik čovek, već da dokaže da je korisnik spreman da uloži potrebno vreme za rešavanje zadatka. Trenutno je zasnovan na biblioteci Altcha (altcha.org)."

