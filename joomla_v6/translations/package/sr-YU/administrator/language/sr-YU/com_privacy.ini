COM_PRIVACY_CORE_CAPABILITY_COMMUNICATION_WITH_JOOMLA_ORG="Kada je mrežna veza dostupna, Joomla instalacija će pokušati da komunicira sa serverima joomla.org radi različitih mogućnosti, uključujući:<ul><li>Proveru ažuriranja za Joomla aplikaciju</li><li>Ekrane pomoći za osnovne Joomla ekstenzije</li><li>Uslugu instalacije sa weba (uz pristanak)</li><li>Server za prikupljanje statistike (uz pristanak)</li></ul>Kao i kod svih HTTP zahteva, IP adresa vašeg servera biće prenesena kao deo zahteva. Za informacije o tome kako Joomla obrađuje podatke na svojim serverima, pogledajte našu <a href=\"https://www.joomla.org/privacy-policy.html\" target=\"_blank\" rel=\"noopener noreferrer\">politiku privatnosti</a>."
COM_PRIVACY_CORE_CAPABILITY_LOGGING_IP_ADDRESS="Joomla sistem za vođenje dnevnika beleži IP adresu posetioca, što dovodi do upisa poruke u datoteke dnevnika. U ove datoteke se beleže razne aktivnosti na Joomla sajtu, uključujući informacije povezane sa ažuriranjima jezgra, neuspele pokušaje prijave, neobrađene greške i razvojne informacije poput upotrebe zastarelih API-ja. Format datoteka dnevnika može da prilagodi svaka ekstenzija koja konfiguriše logger, zbog čega vas podstičemo da preuzmete i pregledate datoteke dnevnika svog sajta koje se nalaze na lokaciji `%s`."
COM_PRIVACY_CORE_CAPABILITY_SESSION_IP_ADDRESS_AND_COOKIE="Svi zahtevi ka Joomla sajtu pokreću sesiju koja skladišti IP adresu u podacima sesije i kreira kolačić sesije u brauzeru korisnika. IP adresa se koristi kao bezbednosna mera za zaštitu od potencijalnih napada otmicom sesije, a ova informacija se briše kada sesija istekne i njeni podaci budu uklonjeni. Naziv kolačića sesije zasnovan je na nasumično generisanom hešu i zato nema stalan identifikator. Kolačić sesije se uništava kada sesija istekne ili kada korisnik zatvori brauzer."
