COM_PRIVACY_POSTINSTALL_BODY="<p>Uvođenjem GDPR-a za građane EU i sličnih propisa u drugim delovima sveta, možda ćete morati da zatražite saglasnost pre čuvanja bilo kakvih <strong>ličnih podataka</strong> korisnika.</p><p>Joomla 3.9 uvodi nove mogućnosti koje vam pomažu da kreirate politike privatnosti sajta i prikupljate saglasnost korisnika. Uz to je dostupan tok rada koji vam pomaže da upravljate zahtevima korisnika za informacije, kao što su zahtevi za uklanjanje njihovih ličnih podataka sa vašeg sajta.</p><p>Dodatne informacije o ovoj novoj funkciji pročitajte u <a href='https://guide.joomla.org/user-manual/privacy' target='_blank' rel='noopener noreferrer'>dokumentaciji o privatnosti</a>.</p>"
