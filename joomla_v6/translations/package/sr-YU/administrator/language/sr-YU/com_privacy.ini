COM_PRIVACY_MSG_CAPABILITIES_INTRODUCTION="Informacije na ovom ekranu prikupljaju se iz ekstenzija koje ovom sistemu prijavljuju svoje mogućnosti u vezi sa privatnošću. Namenjene su tome da vlasnicima sajtova pomognu da budu svesni mogućnosti instaliranih ekstenzija i da im pruže informacije za izradu lokalnih politika sajta, kao što je politika privatnosti. Pošto ovaj ekran zahteva da ekstenzije podržavaju njegov sistem izveštavanja i prikazuje informacije samo iz omogućenih ekstenzija, ovo ne treba smatrati potpunom listom i preporučujemo da za više informacija pogledate dokumentaciju svake ekstenzije."
