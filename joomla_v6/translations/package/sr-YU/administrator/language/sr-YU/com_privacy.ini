COM_PRIVACY_EMAIL_ADMIN_REQUEST_BODY_EXPORT_REQUEST="Administrator sajta {URL} je kreirao zahtev za izvoz ličnih podataka povezanih sa ovom email adresom. Kao bezbednosnu meru morate potvrditi da je ovo važeći zahtev za vaše lične podatke sa ovog sajta.\n\nAko je ovo bila greška, zanemarite ovu email poruku i ništa se neće dogoditi.\n\nDa biste potvrdili ovaj zahtev, možete uraditi jedno od sledećeg:\n\n1. Posetite sledeću adresu: {TOKENURL}\n\n2. Kopirajte svoj token iz ove email poruke, posetite navedenu adresu i nalepite token u formu.\nURL: {FORMURL}\nToken: {TOKEN}\n\nImajte u vidu da je ovaj token važeći samo 24 sata od trenutka slanja ove email poruke."
COM_PRIVACY_EMAIL_ADMIN_REQUEST_BODY_REMOVE_REQUEST="Administrator sajta {URL} je kreirao zahtev za uklanjanje svih ličnih podataka povezanih sa ovom email adresom. Kao bezbednosnu meru morate potvrditi da je ovo važeći zahtev za uklanjanje vaših ličnih podataka sa ovog sajta.\n\nAko je ovo bila greška, zanemarite ovu email poruku i ništa se neće dogoditi.\n\nDa biste potvrdili ovaj zahtev, možete uraditi jedno od sledećeg:\n\n1. Posetite sledeću adresu: {TOKENURL}\n\n2. Kopirajte svoj token iz ove email poruke, posetite navedenu adresu i nalepite token u formu.\nURL: {FORMURL}\nToken: {TOKEN}\n\nImajte u vidu da je ovaj token važeći samo 24 sata od trenutka slanja ove email poruke."
