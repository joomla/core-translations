COM_ADMIN_POSTINSTALL_MSG_BEHIND_LOAD_BALANCER_ACTION="Omogući Behind Load Balancer podešavanja"
COM_ADMIN_POSTINSTALL_MSG_BEHIND_LOAD_BALANCER_DESCRIPTION="<p>Za Joomla sajtove hostovane iza balansera opterećenja (Load Balancers) i reverznih proksija (Reverse Proxies) u Joomla 3.9.26 uvedeno je novo podešavanje globalne konfiguracije.</p><p>Kada je ovo podešavanje omogućeno, vaš balanser opterećenja/reverzni proksi može da prosledi pravu IP adresu vaših posetilaca. Ta IP adresa će se zatim koristiti u vašim dnevnicima radnji i za praćenje glasanja o člancima (ako su ove funkcije omogućene).</p><p><strong>Ovu funkciju treba da omoguće samo sajtovi iza balansera opterećenja/reverznog proksija.</strong></p>"
COM_ADMIN_POSTINSTALL_MSG_BEHIND_LOAD_BALANCER_TITLE="Novo serversko podešavanje \"Iza balansera opterećenja\""
COM_ADMIN_POSTINSTALL_MSG_HTACCESS_AUTOINDEX_DESCRIPTION="<p>Pre verzije 3.9.22 podrazumevana datoteka htaccess.txt sadržala je pogrešan kod namenjen onemogućavanju listanja direktorijuma. Bezbednosni tim preporučuje da ručno primenite neophodne izmene na svakoj postojećoj .htaccess datoteci, jer se ona ne može automatski ažurirati.</p><p>Stari kod:</p><pre>&lt;IfModule autoindex&gt;\n  IndexIgnore *\n&lt;/IfModule&gt;</pre><p>Novi kod:</p><pre>&lt;IfModule mod_autoindex.c&gt;\n  IndexIgnore *\n&lt;/IfModule&gt;</pre>"
COM_ADMIN_POSTINSTALL_MSG_HTACCESS_AUTOINDEX_TITLE=".htaccess ažuriranje u vezi sa listanjem direktorijuma"
COM_ADMIN_POSTINSTALL_MSG_HTACCESS_BROTLI_DESCRIPTION="<p>Pre 5.1.0 podrazumevana datoteka htaccess.txt nije podržavala Brotli kompresiju. Ovo je moglo da dovede do grešaka dvostruke kompresije kada je Joomla instalirana na serveru koji koristi Brotli kompresiju. Trebalo bi ručno da primenite neophodne izmene na svakoj postojećoj .htaccess datoteci, pošto se ova datoteka ne može automatski ažurirati.</p><p>Stari kod:</p><pre>RewriteRule \"\.css\.gz$\" \"-\" [T=text/css,E=no-gzip:1]<br>RewriteRule \"\.js\.gz$\" \"-\" [T=text/javascript,E=no-gzip:1]</pre><p>Novi kod:</p><pre>RewriteRule \"\.css\.gz$\" \"-\" [T=text/css,E=no-gzip:1,E=no-brotli:1]<br>RewriteRule \"\.js\.gz$\" \"-\" [T=text/javascript,E=no-gzip:1,E=no-brotli:1]</pre>"
COM_ADMIN_POSTINSTALL_MSG_HTACCESS_BROTLI_TITLE=".htaccess ažuriranje kodova za Brotli kompresiju"
COM_ADMIN_POSTINSTALL_MSG_HTACCESS_SETCE_DESCRIPTION="<p>Pre verzije 4.2.9 podrazumevana datoteka htaccess.txt sadržala je pogrešan kod za dodavanje HTTP zaglavlja \"Content-Encoding\". To je moglo da dovede do grešaka dvostrukog kodiranja kada je Joomla instalirana u poddirektorijumu, a i taj direktorijum i njegov nadređeni direktorijum sadrže .htaccess datoteku sa ovim kodom. Potrebne izmene morate ručno primeniti na svaku postojeću .htaccess datoteku, jer se ona ne može ažurirati automatski.</p><p>Stari kod:</p><pre>Header append Content-Encoding gzip</pre><p>Novi kod:</p><pre>Header set Content-Encoding gzip</pre>"
COM_ADMIN_POSTINSTALL_MSG_HTACCESS_SETCE_TITLE="Ažuriranje datoteke .htaccess u vezi sa postavljanjem zaglavlja Content-Encoding"
