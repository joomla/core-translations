PLG_SYSTEM_JOOA11Y_XML_DESCRIPTION="Joomla provera pristupačnosti vizuelno ističe uobičajene probleme sa pristupačnošću i upotrebljivošću. Dodatak je namenjen autorima sadržaja: prepoznaje greške i upozorenja i daje uputstva kako da se isprave. Imajte na umu da ovaj dodatak ne nudi iscrpnu analizu vašeg sajta niti automatski obezbeđuje njegovu pristupačnost. Važno je izabrati šablon koji je sam po sebi pristupačan kako bi vaš sajt ispunio standarde pristupačnosti."

