JLIB_RULES_SETTING_NOTES_COM_CONFIG="Ako promenite podešavanje, ono će se primeniti na ovu i sve podređene grupe, komponente i sadržaj. Imajte na umu sledeće:<br><em><strong>Nasleđeno</strong></em> znači da će se koristiti dozvole iz nadređene grupe.<br><em><strong>Odbijeno</strong></em> znači da grupa koja se uređuje ne može da preduzme ovu radnju, bez obzira na podešavanja nadređene grupe.<br><em><strong>Dozvoljeno</strong></em> znači da će grupa koja se uređuje moći da preduzme ovu radnju (ali ako je to u sukobu sa nadređenom grupom, neće imati efekta; sukob će biti označen kao <em><strong>Nije dozvoljeno (Zaključano)</strong></em> u Izračunatim podešavanjima).<br><em><strong>Nije postavljeno</strong></em> koristi se samo za javnu grupu u globalnoj konfiguraciji. Javna grupa je nadređena svim ostalim grupama. Ako dozvola nije postavljena, tretira se kao odbijena, ali se može promeniti za podređene grupe, komponente, kategorije i stavke." ; Alternate language strings for the rules form field

