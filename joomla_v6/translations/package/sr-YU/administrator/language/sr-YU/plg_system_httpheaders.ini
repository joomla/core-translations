PLG_SYSTEM_HTTPHEADERS_CONTENTSECURITYPOLICY="<a href='https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP' target='_blank' rel='noopener noreferrer'>Politika bezbednosti sadržaja (CSP)</a>" ; Do not translate
PLG_SYSTEM_HTTPHEADERS_CONTENTSECURITYPOLICY_CLIENT="Klijent"
PLG_SYSTEM_HTTPHEADERS_CONTENTSECURITYPOLICY_FRAME_ANCESTORS_SELF_ENABLED="frame-ancestors 'self'" ; Do not translate
PLG_SYSTEM_HTTPHEADERS_CONTENTSECURITYPOLICY_FRAME_ANCESTORS_SELF_ENABLED_DESC="Omogućite CSP zaštitu od clickjackinga frame-ancestors i dozvolite samo poreklo 'self'. Koristite obrazac ispod da biste dozvolili i poreklo koje nije 'self'."
PLG_SYSTEM_HTTPHEADERS_CONTENTSECURITYPOLICY_NONCE_ENABLED="<a href='https://developer.mozilla.org/en-US/docs/Web/HTML/Global_attributes/nonce' target='_blank' rel='noopener noreferrer'>Nonce</a>" ; Please only change the URL
PLG_SYSTEM_HTTPHEADERS_CONTENTSECURITYPOLICY_NONCE_ENABLED_DESC="Omogućite listu dozvoljenih za određene umetnute skripte koristeći kriptografski nonce (broj korišćen jednom) za sve skripte i stilove koji koriste Joomla API. Navođenjem nonce-a moderan brauzer ignoriše 'unsafe-inline', koji i dalje treba da bude postavljen za starije brauzere bez podrške za nonce."
PLG_SYSTEM_HTTPHEADERS_CONTENTSECURITYPOLICY_REPORT_ONLY_DESC="Koristite zaglavlje 'Content-Security-Policy-Report-Only' umesto 'Content-Security-Policy'." ; Do not translate 'Content-Security-Policy' & 'Content-Security-Policy-Report-Only'
PLG_SYSTEM_HTTPHEADERS_CONTENTSECURITYPOLICY_REPORT_ONLY="Samo-izveštaj" ; Do not translate
PLG_SYSTEM_HTTPHEADERS_CONTENTSECURITYPOLICY_STRICT_DYNAMIC_ENABLED="strict-dynamic" ; Do not translate
PLG_SYSTEM_HTTPHEADERS_CONTENTSECURITYPOLICY_STRICT_DYNAMIC_ENABLED_DESC="Izvorni izraz strict-dynamic određuje da se poverenje koje je eksplicitno dato skripti u oznaci, tako što je prati nonce ili heš, prenosi na sve skripte koje učitava ta korenska skripta. Istovremeno će svi dozvoljeni ili izvorni izrazi, kao što su 'self' ili 'unsafe-inline', biti ignorisani." ; Do not translate 'strict-dynamic', 'self' and 'unsafe-inline'
PLG_SYSTEM_HTTPHEADERS_CONTENTSECURITYPOLICY_SCRIPT_HASHES_ENABLED="<a href='https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Content-Security-Policy/script-src' target='_blank' rel='noopener noreferrer'>Heš vrednosti skripti</a>" ; Please only change the URL
PLG_SYSTEM_HTTPHEADERS_CONTENTSECURITYPOLICY_SCRIPT_HASHES_ENABLED_DESC="Omogućite opcionu listu dozvoljenih umetnutih skripti zasnovanu na heševima, koristeći kriptografski heš za sve skripte koje koriste Joomla API. Navođenjem heševa moderan brauzer ignoriše 'unsafe-inline', koji i dalje treba da bude postavljen za starije brauzere bez podrške za heševe."
PLG_SYSTEM_HTTPHEADERS_CONTENTSECURITYPOLICY_STYLE_HASHES_ENABLED="<a href='https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Content-Security-Policy/style-src' target='_blank' rel='noopener noreferrer'>Heš vrednosti stilova</a>" ; Please only change the URL
PLG_SYSTEM_HTTPHEADERS_CONTENTSECURITYPOLICY_STYLE_HASHES_ENABLED_DESC="Omogućite opcionu listu dozvoljenih umetnutih stilova zasnovanu na heševima, koristeći kriptografski heš za sve stilove koje koristi Joomla API. Navođenjem heševa moderan brauzer ignoriše 'unsafe-inline', koji i dalje treba da bude postavljen za starije brauzere bez podrške za heševe."
PLG_SYSTEM_HTTPHEADERS_CONTENTSECURITYPOLICY_VALUES="Dodaj direktivu"
PLG_SYSTEM_HTTPHEADERS_CONTENTSECURITYPOLICY_VALUES_DIRECTIVE="Direktiva politike"
PLG_SYSTEM_HTTPHEADERS_CONTENTSECURITYPOLICY_VALUES_VALUE="Vrednost"
PLG_SYSTEM_HTTPHEADERS_COOP="Cross-Origin-Opener-Policy" ; Do not translate
PLG_SYSTEM_HTTPHEADERS_HEADER_CLIENT="Klijent"
PLG_SYSTEM_HTTPHEADERS_HEADER_CLIENT_BOTH="Oba"
PLG_SYSTEM_HTTPHEADERS_HSTS="<a href='https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Strict-Transport-Security' target='_blank' rel='noopener noreferrer'>HTTP Strict Transport Security (HSTS)</a>" ; Please only change the URL
PLG_SYSTEM_HTTPHEADERS_HSTS_MAXAGE="max-age" ; Do not translate
PLG_SYSTEM_HTTPHEADERS_HSTS_MAXAGE_DESC="Ova opcija postavlja vreme za 'max-age' u sekundama. Podrazumevana vrednost je 31536000, što odgovara jednoj godini" ; Please do not translate 'max-age'
PLG_SYSTEM_HTTPHEADERS_HSTS_PRELOAD="<a href='https://hstspreload.org' target='_blank' rel='noopener noreferrer'>Preload</a>" ; Do not translate
PLG_SYSTEM_HTTPHEADERS_HSTS_PRELOAD_DESC="Ova opcija aktivira opt-in za uključivanje u takozvane liste prethodnog učitavanja u brauzerima."
PLG_SYSTEM_HTTPHEADERS_HSTS_PRELOAD_NOTE="Važno"
PLG_SYSTEM_HTTPHEADERS_HSTS_PRELOAD_NOTE_DESC="HSTS znači da se vaš domen više ne može pozivati bez HTTPS-a. Kada se jednom doda na listu za predučitavanje, to nije lako poništiti. Domeni se mogu ukloniti, ali je potrebno nekoliko meseci da korisnici to primene ažuriranjem brauzera.<br><strong>Ova opcija je veoma važna za sprečavanje 'man-in-the-middle napada', zato treba da bude aktivirana u svakom slučaju, ali samo ako ste sigurni da je HTTPS dugoročno podržan za domen i sve poddomene! Vrednost za 'max-age' mora biti postavljena na 63072000 (2 godine) radi upisa.</strong>" ; Please do not translate 'max-age'
PLG_SYSTEM_HTTPHEADERS_HSTS_SUBDOMAINS="Takođe za poddomene"
PLG_SYSTEM_HTTPHEADERS_HSTS_SUBDOMAINS_DESC="HSTS treba omogućiti i <strong>za poddomene</strong>. Obično se poddomen 'www' uzima u obzir pri izradi SSL sertifikata. Ako se koriste dodatni poddomeni, imajte na umu da se i za njih obezbeđuje važeći SSL sertifikat."
PLG_SYSTEM_HTTPHEADERS_POSTINSTALL_INTRODUCTION_ACTION="Omogući podrazumevana bezbednosna zaglavlja"
PLG_SYSTEM_HTTPHEADERS_POSTINSTALL_INTRODUCTION_BODY="<p>Joomla! dolazi sa ugrađenim skupom alata koji vam pomažu u rukovanju http bezbednosnim zaglavljima. Ova zaglavlja pomažu vašem brauzeru, na primer, da zaštiti vaš sajt od <a href='https://en.wikipedia.org/wiki/Cross-site_scripting' target='_blank' rel='noopener noreferrer'>XSS</a> i <a href='https://en.wikipedia.org/wiki/Clickjacking' target='_blank' rel='noopener noreferrer'>Clickjacking</a> napada.</p><p>Više detalja možete pronaći u <a href='https://guide.joomla.org/user-manual/security/security-http-headers' target='_blank' rel='noopener noreferrer'>HTTP vodiču za upravljanje zaglavljima u Joomla! dokumentaciji.</a></p>"
PLG_SYSTEM_HTTPHEADERS_POSTINSTALL_INTRODUCTION_TITLE="HTTP bezbednosna zaglavlja"
PLG_SYSTEM_HTTPHEADERS_REFERRERPOLICY="<a href='https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Referrer-Policy' target='_blank' rel='noopener noreferrer'>Referrer-Policy</a>" ; Do not translate
PLG_SYSTEM_HTTPHEADERS_XFRAMEOPTIONS="<a href='https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/X-Frame-Options' target='_blank' rel='noopener noreferrer'>X-Frame-Options</a>" ; Do not translate
