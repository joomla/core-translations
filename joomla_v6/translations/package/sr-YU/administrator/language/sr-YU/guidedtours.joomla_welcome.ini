COM_GUIDEDTOURS_TOUR_WELCOMETOJOOMLA_DESCRIPTION="<p>Ova tura će vam ukratko pokazati kako da počnete sa Joomla! sistemom.</p><p>Nalazite se u administratorskom delu Joomle, poznatom i kao '<strong>Backend</strong>'.<br>Ovde podešavate i upravljate celim svojim Joomla sajtom.</p><p><strong>Želite da saznate više?</strong></p><p>Hajde da započnemo turu i izgradimo vaš sajt uz moć Joomle!</p>"

