COM_GUIDEDTOURS_TOUR_GUIDEDTOURS_STEP_NEW_TITLE="Izaberite dugme 'Novo'"
COM_GUIDEDTOURS_TOUR_GUIDEDTOURS_STEP_NEW_DESCRIPTION="Izaberite 'Novo' da kreirate novu turu."

COM_GUIDEDTOURS_TOUR_GUIDEDTOURS_STEP_TITLE_TITLE="Dodajte naslov vaše ture"
COM_GUIDEDTOURS_TOUR_GUIDEDTOURS_STEP_TITLE_DESCRIPTION="Unesite obavezan naslov za turu."

COM_GUIDEDTOURS_TOUR_GUIDEDTOURS_STEP_CONTENT_TITLE="Dodajte sadržaj"
COM_GUIDEDTOURS_TOUR_GUIDEDTOURS_STEP_CONTENT_DESCRIPTION="Dodajte sadržaj koji opisuje turu."

COM_GUIDEDTOURS_TOUR_GUIDEDTOURS_STEP_COMPONENT_TITLE="Izaberite komponentu"
COM_GUIDEDTOURS_TOUR_GUIDEDTOURS_STEP_COMPONENT_DESCRIPTION="Izaberite ekstenziju (ekstenzije) za koju želite da se vaša tura prikazuje prioritetno u spisku mogućih tura za pokretanje. Na primer, ako pravite turu za ekstenziju 'Korisnici', izaberite 'Korisnici'. Izaberite 'Sve' da bi se tura prikazivala na svim stranicama."

COM_GUIDEDTOURS_TOUR_GUIDEDTOURS_STEP_URL_TITLE="Dodajte URL"
COM_GUIDEDTOURS_TOUR_GUIDEDTOURS_STEP_URL_DESCRIPTION="Dodajte relativnu URL adresu stranice na kojoj tura mora da počne. Na primer, unesite <em>administrator/index.php?option=com_users&view=users</em> da biste započeli turu na stranici Korisnici."

COM_GUIDEDTOURS_TOUR_GUIDEDTOURS_STEP_AUTOSTART_TITLE="Uključi ili isključi 'Auto Start'"
COM_GUIDEDTOURS_TOUR_GUIDEDTOURS_STEP_AUTOSTART_DESCRIPTION="<p>Podešavanje 'Auto Start' na 'Da' automatski pokreće turu čim su ispunjeni odgovarajući uslovi.</p><p>Ako je više tura podešeno na automatsko pokretanje pod istim uslovima, pokrenuće se samo prva tura u listi, sve dok se ne otkaže, završi ili preskoči.</p>"

COM_GUIDEDTOURS_TOUR_GUIDEDTOURS_STEP_SAVECLOSE_TITLE="Izaberite 'Sačuvaj i zatvori'"
COM_GUIDEDTOURS_TOUR_GUIDEDTOURS_STEP_SAVECLOSE_DESCRIPTION="Sačuvaj i zatvori turu."

COM_GUIDEDTOURS_TOUR_GUIDEDTOURS_STEP_CONGRATULATIONS_TITLE="Čestitamo!"
COM_GUIDEDTOURS_TOUR_GUIDEDTOURS_STEP_CONGRATULATIONS_DESCRIPTION="Napravili ste vođenu turu. Sada treba da napravite korake za turu."

