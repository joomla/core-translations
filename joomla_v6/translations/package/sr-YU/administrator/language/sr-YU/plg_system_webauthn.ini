PLG_SYSTEM_WEBAUTHN="Sistem - Passkey (bez lozinke) prijava"
PLG_SYSTEM_WEBAUTHN_CANNOT_ADD_FOR_A_USER="Ne možete dodavati ni uklanjati passkey u ime korisnika. Korisnici moraju da se prijave i sami podese svoje uređaje."
PLG_SYSTEM_WEBAUTHN_DESCRIPTION="Omogućava prijavljivanje bez lozinke pomoću passkey ključeva. Imajte na umu da se kartica passkey ključeva u editoru korisničkog profila i dugmad za prijavu pomoću passkey ključeva prikazuju samo ako korisnik pristupa sajtu preko HTTPS-a. Registracija passkey ključeva i prijava na sajt pomoću njih radiće samo ako sajt koristi važeći sertifikat koji je potpisalo sertifikaciono telo kome brauzer korisnika veruje."
PLG_SYSTEM_WEBAUTHN_ERR_AJAX_INVALIDACTION="Neispravna AJAX akcija"
PLG_SYSTEM_WEBAUTHN_ERR_CANNOT_FIND_USERNAME="Nije moguće pronaći polje korisničkog imena u modulu za prijavu. Nažalost, autentifikacija bez lozinke neće raditi na ovom sajtu osim ako ne koristite drugi modul za prijavu."
PLG_SYSTEM_WEBAUTHN_ERR_CANT_STORE_FOR_GUEST="Nije moguće sačuvati akreditive za korisnika gosta!"
PLG_SYSTEM_WEBAUTHN_ERR_CORRUPT_STORED_CREDENTIAL="Sačuvani akreditivi za vaš korisnički nalog su oštećeni. Prijavite se drugim načinom, pa uklonite i ponovo dodajte svoj passkey."
PLG_SYSTEM_WEBAUTHN_ERR_CREATE_INVALID_LOGIN_REQUEST="Nevažeći zahtev za prijavu bez lozinke. Nešto je pokvareno ili je ovo pokušaj hakovanja sajta."
PLG_SYSTEM_WEBAUTHN_ERR_CREATE_INVALID_PK="Registracija passkey ključa je bila neuspešna. Odgovor brauzera se ne poklapa sa javnim ključem na serveru. Ovo znači da je neko pokušao da vas hakuje ili je došlo do greške."
PLG_SYSTEM_WEBAUTHN_ERR_CREATE_INVALID_USER="Iz bezbednosnih razloga nije vam dozvoljeno da registrujete passkey ključ u ime drugog korisnika."
PLG_SYSTEM_WEBAUTHN_ERR_CREATE_NO_ATTESTED_DATA="Nešto nije u redu, ali trenutno nema dodatnih informacija o grešci. Pokušajte ponovo da registrujete svoj passkey ključ."
PLG_SYSTEM_WEBAUTHN_ERR_CREATE_NO_PK="Server nije izdao javni ključ za registraciju passkey ključa, ali je nekako primio zahtev za registraciju passkey ključa od brauzera. Ovo znači da je neko pokušao da vas hakuje ili je došlo do greške."
PLG_SYSTEM_WEBAUTHN_ERR_CREDENTIAL_ID_ALREADY_IN_USE="Nije moguće sačuvati akreditive. Ove akreditive već koristi drugi korisnik."
PLG_SYSTEM_WEBAUTHN_ERR_EMPTY_USERNAME="Morate uneti vaše korisničko ime (ne vašu lozinku) pre klika na passkey dugme za prijavu."
PLG_SYSTEM_WEBAUTHN_ERR_INVALID_USERNAME="Navedeno korisničko ime ne odgovara korisničkom nalogu koji je omogućio prijavu bez lozinke na ovom sajtu."
PLG_SYSTEM_WEBAUTHN_ERR_LABEL_NOT_SAVED="Čuvanje nove oznake nije uspelo"
PLG_SYSTEM_WEBAUTHN_ERR_NOT_DELETED="Nismo mogli da uklonimo passkey ključ"
PLG_SYSTEM_WEBAUTHN_ERR_NOUSER="Nije pronađen nijedan korisnički nalog"
PLG_SYSTEM_WEBAUTHN_ERR_NO_BROWSER_SUPPORT="Nažalost, vaš brauzer ne podržava passkey standard za prijavu bez lozinke ili se vaš sajt ne isporučuje preko HTTPS-a sa važećim sertifikatom koji je potpisao sertifikacioni autoritet kome vaš brauzer veruje. Morate se prijaviti na ovaj sajt korisničkim imenom i lozinkom."
PLG_SYSTEM_WEBAUTHN_ERR_NO_STORED_CREDENTIAL="Nema sačuvanih podataka za vaš passkey."
PLG_SYSTEM_WEBAUTHN_ERR_USER_REMOVED="Izgleda da korisnik za ovaj passkey ključ više ne postoji na ovom sajtu."
PLG_SYSTEM_WEBAUTHN_ERR_XHR_INITCREATE="Nije moguće preuzeti podatke o registraciji passkey ključa sa vašeg sajta."
PLG_SYSTEM_WEBAUTHN_FIELD_ATTESTATION_SUPPORT_DESC="Dozvoljava samo korišćenje pristupnih ključeva sa proverljivim kriptografskim potpisima za prijavu pomoću pristupnog ključa. Toplo se preporučuje za okruženja sa visokim nivoom bezbednosti. Zahteva da PHP može da upisuje u sistemski privremeni direktorijum i prisustvo OpenSSL ekstenzije. Može da spreči da neki jeftiniji, nesertifikovani pristupni ključevi uopšte rade. Isključivanje ove opcije takođe sprečava Joomlu da prepozna proizvođača i model pristupnog ključa koji koristite (pored imena pristupnog ključa neće biti prikazana ikona)."
PLG_SYSTEM_WEBAUTHN_FIELD_ATTESTATION_SUPPORT_LABEL="Podrška za atestaciju"
PLG_SYSTEM_WEBAUTHN_FIELD_DESC="Omogućava vam da upravljate metodama prijave bez lozinke pomoću pristupnih ključeva. Potrebni su vam podržani brauzer i pristupni ključ (npr. Google Chrome ili Firefox sa FIDO2 sertifikovanim bezbednosnim ključem).<br><br><strong>MacOS/iOS/watchOS:</strong> Touch/Face ID.<br><strong>Windows:</strong> Hello (otisak prsta / prepoznavanje lica / PIN).<br><strong>Android:</strong> biometrijsko zaključavanje ekrana.<br><br>Više detalja možete pronaći u <a href=\"https://guide.joomla.org/user-manual/users/users-webauthn-passwordless-login\" target=\"_blank\" rel=\"noopener noreferrer\">dokumentaciji o prijavi bez lozinke pomoću pristupnog ključa</a>."
