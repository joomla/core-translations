COM_GUIDEDTOURS_TOUR_WHATSNEW_6_0_STEP_0_DESCRIPTION="<div class=\"row align-items-center pt-3\"><div class=\"col-12\"><h2 class=\"mb-3\">Još ažuriranja</h2><p>Istaknuti članci sada dele prikaz sa upravljačem člancima.</p></div></div><div class=\"row align-items-center pt-4\"><div class=\"col-12\"><h3>Ako ste propustili</h3><p>Joomla! 6 podržava automatska ažuriranja pomoću The Update Framework (TUF) radi veće bezbednosti i boljih performansi.<br>Podešavanja automatskih ažuriranja pronaći ćete u odeljku za konfiguraciju <em>Joomla! ažuriranje</em>.</p></div></div><div class=\"row align-items-center pt-4\"><div class=\"col-12\"><h3>Ostala poboljšanja i ispravke</h3><ul class=\"mb-3\"><li>Email obaveštenje o odobravanju administratorske registracije <a href=\"https://github.com/joomla/joomla-cms/pull/45802\" target=\"_blank\" rel=\"noopener noreferrer\">PR#45802</a></li><li>Dodavanje prilagođenih klasa u padajući spisak klasa u dijalogu za slike u TinyMCE uređivaču <a href=\"https://github.com/joomla/joomla-cms/pull/45676\" target=\"_blank\" rel=\"noopener noreferrer\">PR#45676</a></li><li>Mogućnost grupnog uklanjanja oznake <a href=\"https://github.com/joomla/joomla-cms/pull/40613\" target=\"_blank\" rel=\"noopener noreferrer\">PR#40613</a></li><li>I mnogo, mnogo poboljšanja ispod haube...</li></ul></div></div>"
COM_GUIDEDTOURS_TOUR_WHATSNEW_6_0_STEP_0_TITLE="Ostale funkcije"
COM_GUIDEDTOURS_TOUR_WHATSNEW_6_0_STEP_1_DESCRIPTION="<h3>Informacije o izdanju Joomla 6.0</h3><p><a title=\"Informacije o izdanju\" href=\"https://6.joomla.org/\" target=\"_blank\" rel=\"noopener noreferrer\">Pogledajte informacije o izdanju na 6.joomla.org</a></p><hr><h3>Pomoć i informacije</h3><p>Ovde možete pronaći mnoge resurse koji vam mogu pomoći, zajedno sa dodatnim vezama ka drugim resursima, dokumentaciji, podršci i načinima da se uključite u Joomlu.</p>"
COM_GUIDEDTOURS_TOUR_WHATSNEW_6_0_STEP_1_TITLE="Više informacija i pomoć"

