COM_GUIDEDTOURS_TOUR_WHATSNEW_6_2_DESCRIPTION="<h1 class=\"fw-medium\">Dobrodošli u Joomla 6.2!</h1><div class=\"row align-items-center pt-4\"><h2 class=\"mb-3\">Ažuriranja jezgra</h2><div class=\"col-12 mb-3\"><h3>Poboljšanja uređivanja sadržaja</h3><ul><li><strong>Integracije Menadžera medija i dugmeta Pročitaj više</strong>: Dodavanje slika i medija postalo je lakše uz ažurirani birač koji sada otvara Joomla Menadžer medija, a novo dugme Pročitaj više omogućava brže umetanje preloma članka.</li><li><strong>Odvojene klase za sliku i figuru</strong>: Slike uvoda i punog teksta članka sada imaju nezavisna polja za CSS klase slike i okolnog elementa figure.</li></ul></div></div><div class=\"row align-items-center pt-1\"><div class=\"col-md-6 col-lg-7 mb-4\"><img class=\"img-fluid d-block mx-auto\" src=\"media/com_guidedtours/images/6_2/sublevel_menu.jpg\" alt=\"Meniji sa podnivoima\" width=\"383\" height=\"280\"></div><div class=\"col-md-6 col-lg-5\"><h3>Šablon sajta (Cassiopeia)</h3><ul><li><strong>Višenivoski padajući meniji</strong>: Cassiopeia meniji sada podržavaju više od jednog podnivoa u padajućim i skupljivim izgledima.</li></ul></div></div><div class=\"row align-items-center pt-1\"><div class=\"col-md-6 col-lg-7 my-3\"><h3>Moduli i konfiguracija sajta</h3><ul class=\"mb-3\"><li><strong>Prekidači linkova u mod_login</strong>: Nove opcije omogućavaju administratorima da sakriju linkove “Zaboravili ste lozinku?” i “Zaboravili ste korisničko ime?” bez nadjačavanja šablona. Podrazumevano je prikaz, pa nema uticaja na postojeće sajtove.</li><li><strong>Oznaka bezbednosti za ažuriranja ekstenzija</strong>: Programeri mogu da označe izdanje kao bezbednosno ažuriranje (ozbiljnost od Ništa do Kritično); označena ažuriranja su istaknuta u Sistem -&gt; Ažuriranje -&gt; Ekstenzije i na brzoj ikoni kontrolne table.</li></ul></div><div class=\"col-md-6 col-lg-5\"><img class=\"img-fluid d-block mx-auto\" src=\"media/com_guidedtours/images/6_2/security_warning.jpg\" alt=\"Bezbednosne oznake na ekstenzijama\" width=\"488\" height=\"144\"></div></div>"
COM_GUIDEDTOURS_TOUR_WHATSNEW_6_2_TITLE="Šta je novo u Joomla 6.2!"

