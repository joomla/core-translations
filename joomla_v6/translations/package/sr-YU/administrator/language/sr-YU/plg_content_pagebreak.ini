PLG_CONTENT_PAGEBREAK_XML_DESCRIPTION="<p>Omogućava kreiranje članka sa više stranica i opcionom tabelom sadržaja.</p><p>Prelome stranice umećete dugmetom za prelom stranice koje se obično nalazi na traci alatki WYSIWYG editora. Mesto preloma stranice u članku prikazuje se u editoru kao jednostavna horizontalna linija.</p><p>Prikazani tekst zavisi od izabranih opcija i može biti naslov, alternativni tekst (ako je naveden) ili brojevi stranica.</p><p>HTML upotreba je:<br>&lt;hr class=&quot;system-pagebreak&quot; /&gt;<br>&lt;hr class=&quot;system-pagebreak&quot; title=&quot;Naslov stranice&quot; /&gt; ili <br>&lt;hr class=&quot;system-pagebreak&quot; alt=&quot;Prva stranica&quot; /&gt; ili <br>&lt;hr class=&quot;system-pagebreak&quot; title=&quot;Naslov stranice&quot; alt=&quot;Prva stranica&quot; /&gt; ili <br>&lt;hr class=&quot;system-pagebreak&quot; alt=&quot;Prva stranica&quot; title=&quot;Naslov stranice&quot; /&gt;</p>"

