PLG_MULTIFACTORAUTH_WEBAUTHN="Višefaktorska autentifikacija - Passkeys"
PLG_MULTIFACTORAUTH_WEBAUTHN_ERR_CREATE_INVALID_LOGIN_REQUEST="Nevažeći zahtev za autentifikaciju."
PLG_MULTIFACTORAUTH_WEBAUTHN_ERR_CREATE_INVALID_PK="Registracija passkey ključa je bila neuspešna. Odgovor brauzera se ne poklapa sa javnim ključem na serveru. Ovo znači da je neko pokušao da vas hakuje ili je došlo do greške."
PLG_MULTIFACTORAUTH_WEBAUTHN_ERR_CREATE_INVALID_USER="Iz bezbednosnih razloga nije vam dozvoljeno da registrujete passkey ključ u ime drugog korisnika."
PLG_MULTIFACTORAUTH_WEBAUTHN_ERR_CREATE_NO_ATTESTED_DATA="Nešto nije u redu, ali trenutno nema dodatnih informacija o grešci. Pokušajte ponovo da registrujete svoj passkey ključ."
PLG_MULTIFACTORAUTH_WEBAUTHN_ERR_CREATE_NO_PK="Server nije izdao javni ključ za registraciju passkey ključa, ali je nekako primio zahtev za registraciju passkey ključa od brauzera. Ovo znači da je neko pokušao da vas hakuje ili je došlo do greške."
PLG_MULTIFACTORAUTH_WEBAUTHN_ERR_NOTAVAILABLE_BODY="Vaš brauzer ne podržava standard passkey. Još uvek nisu svi brauzeri kompatibilni sa passkey ključevima na svim uređajima."
