PLG_SYSTEM_JOOA11Y_FIELD_CHECK_ROOT="Oblast za proveru"
PLG_SYSTEM_JOOA11Y_FIELD_CHECK_ROOT_DESC="Unesite jedan selektor da biste ciljali određeni region vašeg sajta. Podrazumevano je orijentir <strong>main</strong>. Alternative orijentirima su klase, elementi ili ARIA uloge (npr. #main-content, .main, [role='main']). Unesite <strong>body</strong> da proverite celu stranicu."
PLG_SYSTEM_JOOA11Y_FIELD_CHECKS="Isključi provere"
PLG_SYSTEM_JOOA11Y_FIELD_CHECKS_DESC="Isključite određene provere prema nazivu ključa. Saznajte kako da <a href=\"https://sa11y.netlify.app/plugins/joomla/#turn-off-checks\" target=\"_blank\" rel=\"noopener noreferrer\">isključite provere</a>."
PLG_SYSTEM_JOOA11Y_FIELD_CONTAINER_IGNORE="Zanemarite regione"
PLG_SYSTEM_JOOA11Y_FIELD_CONTAINER_IGNORE_DESC="Zanemarite određene regione unutar kontejnera sadržaja. Za odvajanje klasa ili elemenata koristite zareze (npr. #ignore, .ignore)."
PLG_SYSTEM_JOOA11Y_FIELD_EXTRA_PROPS="Dodatna svojstva"
PLG_SYSTEM_JOOA11Y_FIELD_READABILITY_ROOT="Oblast za proveru čitljivosti"
PLG_SYSTEM_JOOA11Y_FIELD_READABILITY_ROOT_DESC="Orijentir na stranici koji će biti proveren na čitljivost. Podrazumevano je orijentir <strong>main</strong>."
