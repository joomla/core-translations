JGLOBAL_FILTER_TYPE_DESC="<p>1. Lista zabranjenih dozvoljava sve oznake i atribute osim navedenih.<br><strong>--</strong> Oznake podrazumevane liste zabranjenih uključuju: 'applet', 'body', 'bgsound', 'base', 'basefont', 'canvas', 'embed', 'frame', 'frameset', 'head', 'html', 'id', 'iframe', 'ilayer', 'layer', 'link', 'meta', 'name', 'object', 'script', 'style', 'title', 'xml'<br><strong>--</strong> Atributi podrazumevane liste zabranjenih uključuju: 'action', 'background', 'codebase', 'dynsrc', 'lowsrc', 'formaction'<br><strong>--</strong> Možete zabraniti dodatne oznake i atribute dodavanjem u polja Oznake filtera i Atributi filtera, razdvajajući nazive oznaka ili atributa zarezom.<br><strong>--</strong> Prilagođena lista zabranjenih omogućava vam da zaobiđete podrazumevanu listu zabranjenih. Dodajte oznake i atribute koji će biti zabranjeni u poljima Oznake filtera i Atributi filtera.</p><p>Lista dozvoljenih dozvoljava samo oznake navedene u poljima Oznake filtera i Atributi filtera.</p><p>Bez HTML-a uklanja sve HTML oznake iz sadržaja kada se sačuva.</p><p>Imajte na umu da ova podešavanja rade bez obzira na editor koji koristite. <br>Čak i ako koristite WYSIWYG editor, podešavanja filtriranja mogu ukloniti dodatne oznake i atribute pre čuvanja informacija u bazi podataka.</p>"
