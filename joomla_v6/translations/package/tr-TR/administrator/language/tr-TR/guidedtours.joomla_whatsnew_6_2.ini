COM_GUIDEDTOURS_TOUR_WHATSNEW_6_2_DESCRIPTION="<h1 class=\"fw-medium\">Joomla 6.2'ye Hoş Geldiniz!</h1><div class=\"row align-items-center pt-4\"><h2 class=\"mb-3\">Çekirdek Güncellemeleri</h2><div class=\"col-12 mb-3\"><h3>İçerik Düzenleme İyileştirmeleri</h3><ul><li><strong>Ortam Yöneticisi/Devamını Oku entegrasyonları</strong>: Güncellenen seçici artık Joomla Ortam Yöneticisini açtığından görsel ve ortam dosyaları eklemek daha kolay hale geldi. Yeni Devamını Oku düğmesi ise makale sonlarını eklemek için daha hızlı bir yol sunuyor.</li><li><strong>Ayrı görsel ve şekil sınıfları</strong>: Makale giriş/tam metin görsellerinde artık görsel ve onu çevreleyen şekil öğesi için birbirinden bağımsız CSS sınıfı alanları bulunuyor.</li></ul></div></div><div class=\"row align-items-center pt-1\"><div class=\"col-md-6 col-lg-7 mb-4\"><img class=\"img-fluid d-block mx-auto\" src=\"media/com_guidedtours/images/6_2/sublevel_menu.jpg\" alt=\"Alt düzey menüler\" width=\"383\" height=\"280\"></div><div class=\"col-md-6 col-lg-5\"><h3>Ön Uç Şablonu (Cassiopeia)</h3><ul><li><strong>Çok düzeyli açılır menüler</strong>: Cassiopeia menüleri artık açılır/daraltılabilir düzenlerde birden fazla alt düzeyi destekliyor.</li></ul></div></div><div class=\"row align-items-center pt-1\"><div class=\"col-md-6 col-lg-7 my-3\"><h3>Modüller &amp; Site Yapılandırması</h3><ul class=\"mb-3\"><li><strong>mod_login bağlantı seçenekleri</strong>: Yeni seçenekler, yöneticilerin şablon geçersiz kılması kullanmadan “Parolanızı mı unuttunuz?” ve “Kullanıcı adınızı mı unuttunuz?” bağlantılarını gizlemesine olanak tanır. Varsayılan olarak Göster seçeneği kullanıldığından mevcut siteler etkilenmez.</li><li><strong>Eklenti güncellemeleri için güvenlik işareti</strong>: Geliştiriciler bir sürümü güvenlik güncellemesi olarak işaretleyebilir (önem derecesi Yok ile Kritik arasında); işaretlenen güncellemeler Sistem -&gt; Güncelleme -&gt; Eklentiler bölümünde ve denetim masasındaki hızlı simgede vurgulanır.</li></ul></div><div class=\"col-md-6 col-lg-5\"><img class=\"img-fluid d-block mx-auto\" src=\"media/com_guidedtours/images/6_2/security_warning.jpg\" alt=\"Eklentilerdeki güvenlik etiketleri\" width=\"488\" height=\"144\"></div></div>"
COM_GUIDEDTOURS_TOUR_WHATSNEW_6_2_TITLE="Joomla 6.2’de Neler Yeni!"

