COM_GUIDEDTOURS_TOUR_WHATSNEW_6_2_DESCRIPTION="<h1 class=\"fw-medium\">مرحباً بك في جوملا 6.2!</h1><div class=\"row align-items-center pt-4\"><h2 class=\"mb-3\">تحديثات النظام الأساسي</h2><div class=\"col-12 mb-3\"><h3>تطويرات تحرير المحتوى</h3><ul><li><strong>تكامل إدارة الوسائط وقراءة المزيد</strong>: أصبح إدراج الصور والوسائط أكثر سهولة بفضل أداة الاختيار المحدثة التي تفتح مدير وسائط جوملا مباشرة، كما يتيح زر اقرأ المزيد الجديد طريقة أسرع لإدراج فواصل المقالات.</li><li><strong>فئات مستقلة للصورة وإطارها</strong>: تدعم صور المقالات التمهيدية والكاملة الآن حقولاً منفصلة لفئات CSS لكل من الصورة وعنصر figure المحيط بها.</li></ul></div></div><div class=\"row align-items-center pt-1\"><div class=\"col-md-6 col-lg-7 mb-4\"><img class=\"img-fluid d-block mx-auto\" src=\"media/com_guidedtours/images/6_2/sublevel_menu.jpg\" alt=\"القوائم الفرعية\" width=\"383\" height=\"280\"></div><div class=\"col-md-6 col-lg-5\"><h3>قالب الواجهة الأمامية (Cassiopeia)</h3><ul><li><strong>قوائم منسدلة متعددة المستويات</strong>: تدعم قوائم قالب Cassiopeia الآن أكثر من مستوى فرعي في التخطيطات المنسدلة والقابلة للطي.</li></ul></div></div><div class=\"row align-items-center pt-1\"><div class=\"col-md-6 col-lg-7 my-3\"><h3>الوحدات النمطية &amp; إعدادات الموقع</h3><ul class=\"mb-3\"><li><strong>التحكم في روابط تسجيل الدخول</strong>: خيارات جديدة تتيح للمشرف إخفاء روابط “نسيت كلمة المرور؟” و“نسيت اسم المستخدم؟” دون الحاجة لتخصيص ملفات القالب، مع ضبطها افتراضياً على خيار الإظهار لتفادي أي تأثير على المواقع الحالية.</li><li><strong>شارة أمان لتحديثات الإضافات</strong>: يمكن للمطورين الآن تمييز الإصدارات كتحديث أمني (بدرجات خطورة تبدأ من None إلى Critical)؛ وتظهر هذه التحديثات المميزة بشكل بارز في مسار النظام -&gt; التحديث -&gt; الإضافات وعلى الأيقونة السريعة في لوحة التحكم.</li></ul></div><div class=\"col-md-6 col-lg-5\"><img class=\"img-fluid d-block mx-auto\" src=\"media/com_guidedtours/images/6_2/security_warning.jpg\" alt=\"شارات الأمان في الإضافات\" width=\"488\" height=\"144\"></div></div>"
COM_GUIDEDTOURS_TOUR_WHATSNEW_6_2_TITLE="ما الجديد في جوملا 6.2!"

