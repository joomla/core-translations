COM_GUIDEDTOURS_TOUR_WHATSNEW_6_2_DESCRIPTION="<h1 class=\"fw-medium\">مرحباً بك في جوملا 6.2!</h1><div class=\"row align-items-center pt-4\"><h2 class=\"mb-3\">تحديثات النواة</h2><div class=\"col-12 mb-3\"><h3>ترقيات تحرير المحتوى</h3><ul><li><strong>تكاملات مدير الوسائط/اقرأ المزيد</strong>: أصبح إدراج الصور والوسائط أسهل بفضل أداة الاختيار المحدثة التي تفتح الآن مدير وسائط جوملا، كما يوفر زر "_QQ_"اقرأ المزيد"_QQ_" الجديد طريقة أسرع لإدراج فواصل المقالات.</li><li><strong>فئات CSS منفصلة للصورة وعنصر figure</strong>: أصبحت لصور المقدمة والنص الكامل في المقالات حقول مستقلة لفئات CSS خاصة بالصورة وعنصر figure المحيط بها.</li></ul></div></div><div class=\"row align-items-center pt-1\"><div class=\"col-md-6 col-lg-7 mb-4\"><img class=\"img-fluid d-block mx-auto\" src=\"media/com_guidedtours/images/6_2/sublevel_menu.jpg\" alt=\"قوائم المستويات الفرعية\" width=\"383\" height=\"280\"></div><div class=\"col-md-6 col-lg-5\"><h3>قالب الواجهة الأمامية (Cassiopeia)</h3><ul><li><strong>قوائم منسدلة متعددة المستويات</strong>: تدعم قوائم قالب Cassiopeia الآن أكثر من مستوى فرعي واحد في التنسيقات المنسدلة والقابلة للطي.</li></ul></div></div><div class=\"row align-items-center pt-1\"><div class=\"col-md-6 col-lg-7 my-3\"><h3>الموديولات &amp; تهيئة الموقع</h3><ul class=\"mb-3\"><li><strong>مفاتيح تبديل روابط mod_login</strong>: تتيح خيارات جديدة للمشرفين إخفاء رابطي «هل نسيت كلمة المرور؟» و«هل نسيت اسم المستخدم؟» دون الحاجة إلى تجاوز القالب. الخيار الافتراضي هو "_QQ_"إظهار"_QQ_"، لذا لن تتأثر المواقع الحالية.</li><li><strong>شارة الأمان لتحديثات الإضافات</strong>: يمكن للمطورين وسم أي إصدار بأنه تحديث أمني (بدرجة خطورة من لا شيء إلى حرجة)؛ ويتم تمييز التحديثات الموسومة في النظام -&gt; التحديث -&gt; الإضافات وعلى أيقونة الوصول السريع في لوحة التحكم.</li></ul></div><div class=\"col-md-6 col-lg-5\"><img class=\"img-fluid d-block mx-auto\" src=\"media/com_guidedtours/images/6_2/security_warning.jpg\" alt=\"وسوم الأمان على الإضافات\" width=\"488\" height=\"144\"></div></div>"
COM_GUIDEDTOURS_TOUR_WHATSNEW_6_2_TITLE="ما الجديد في جوملا 6.2!"

