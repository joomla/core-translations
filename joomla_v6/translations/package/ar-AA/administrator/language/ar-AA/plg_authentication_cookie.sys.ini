PLG_AUTHENTICATION_COOKIE_XML_DESCRIPTION="<p>تُدير هذه الإضافة عملية التحقق من هوية المستخدم وتسجيل دخوله عبر ملفات تعريف الارتباط في جوملا.</p><p><strong>تحذير! يجب الإبقاء على إضافة مصادقة أخرى واحدة على الأقل قيد التفعيل.</strong><br>كما ستحتاج إلى تفعيل إضافة مساعدة مثل النظام - تذكرني لكي تعمل ميزة الدخول التلقائي عبر ملفات تعريف الارتباط.</p>"

