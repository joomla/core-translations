PLG_LDAP_XML_DESCRIPTION="<p>تتولى هذه الإضافة مصادقة المستخدمين عبر خادم LDAP.</p><p><strong>تحذير! يجب تفعيل إضافة مصادقة واحدة على الأقل، وإلا ستفقد القدرة على الوصول إلى موقعك بالكامل.</strong></p>"

