PLG_LDAP_FIELD_PASSWORD_DESC="أدخل هنا كلمة المرور الخاصة بالحساب الإداري الذي سيستخدمه الموقع للاتصال بالخادم والبحث في الدليل."
PLG_LDAP_FIELD_PASSWORD_LABEL="كلمة مرور الاتصال"
PLG_LDAP_FIELD_PORT_LABEL="المنفذ"
PLG_LDAP_FIELD_REFERRALS_DESC="هذا الخيار يضبط قيمة عَلم LDAP_OPT_REFERRALS. يجب أن يتم الضبط على (لا) لسيرفرات ويندوز 2003."
PLG_LDAP_FIELD_REFERRALS_LABEL="تتبّع الإحالات التلقائية بين الخوادم"
PLG_LDAP_FIELD_SEARCHSTRING_DESC="نص البحث الذي يعتمد عليه النظام للعثور على حساب المستخدم داخل الدليل. عند تسجيل الدخول، يستبدل النظام الرمز [search] تلقائياً باسم المستخدم الذي أدخله الشخص (مثال: uid=[search]). يمكنك كتابة أكثر من نص بحث والفصل بينها بفاصلة منقوطة (;)، ويُستخدم هذا الإعداد بعد إتمام الاتصال الأولي بالخادم في جميع طرق المصادقة."
PLG_LDAP_FIELD_SEARCHSTRING_LABEL="نص البحث المستخدم للعثور على حساب المستخدم في الدليل"
PLG_LDAP_FIELD_UID_DESC="اسم الحقل أو السمة داخل الدليل التي يُخزَّن فيها معرف تسجيل الدخول الخاص بالمستخدم ليتم ربطه بحسابه في الموقع. في حال كنت تستخدم نظام الدليل النشط، اكتب القيمة sAMAccountName."
PLG_LDAP_FIELD_UID_LABEL="ربط حقل معرف المستخدم مع بيانات الدليل"
PLG_LDAP_FIELD_USERNAME_DESC="تُستخدم بيانات اسم المستخدم وكلمة المرور للاتصال لتحديد كيفية تواصل الموقع مع الخادم أثناء مرحلة البحث عن مسار المستخدم المميز في الدليل. لديك خياران: إما البحث المجهول بترك الحقلين فارغين، أو الاتصال الإداري بإدخال اسم مستخدم لحساب يمتلك صلاحيات إدارة (مثل حساب المسؤول). يُستخدم هذا الإعداد فقط عند اختيار طريقة الربط والبحث."
PLG_LDAP_FIELD_USERNAME_LABEL="اسم مستخدم الإتصال"
PLG_LDAP_FIELD_USERSDN_DESC="عند تسجيل الدخول، يستبدل النظام الرمز [username] تلقائياً باسم المستخدم الذي أدخله الشخص (مثال: uid=[username], dc=my-domain, dc=com). يمكنك كتابة أكثر من مسار والفصل بينها بفاصلة منقوطة (;)، ويُستخدم هذا الإعداد فقط عند اختيار طريقة الربط والتحقق المباشر باستخدام حساب المستخدم نفسه."
PLG_LDAP_FIELD_USERSDN_LABEL="المسار المميز لتحديد حساب المستخدم في الدليل (DN)"
PLG_LDAP_FIELD_V3_DESC="الافتراضي هو LDAP2، ولكن أحدث النسخ من OpenLdap يتطلب من العملاء استخدام LDAPv3"
PLG_LDAP_FIELD_V3_LABEL="LDAP الإصدار 3"
