PLG_LDAP_FIELD_CACERT_DESC="المسار الكامل إلى المِلَفّ أو الدليل حيث يمكن لجوملا العثور على شهادة خادم LDAP (سلطة التحصيلات). إذا كان هذا فارغاً، يتم استخدام خيارات عميل TLS_CACERT و TLS_CACERTDIR LDAP."
