PLG_MULTIFACTORAUTH_EMAIL="المصادقة متعددة العوامل - إرسال رمز التحقق عبر البريد الإلكتروني"
PLG_MULTIFACTORAUTH_EMAIL_CONFIG_FORCE_ENABLE_DESC="هل ترغب في تفعيل خيار إرسال رمز التحقق عبر البريد الإلكتروني تلقائياً لـ <em>جميع</em> المستخدمين؟ هذه الميزة مفيدة كحل احتياطي لمن يفقدون الوصول إلى وسيلة المصادقة الأساسية ولم يحفظوا رموز الاسترداد، لكنها تقلل قليلاً من الأمان والتحكم؛ لأن البريد الإلكتروني أقل أماناً من تطبيقات المصادقة ويُفرض كبديل دون اختيار المستخدم."
