PLG_MULTIFACTORAUTH_EMAIL_CONFIG_TIMESTEP_DESC="يتم توليد رمز تحقق جديد بعد انقضاء عدد الدقائق الذي تحدده هنا. انتبه إلى أن الرمز يبقى صالحاً للاستخدام لهذه المدة على الأقل وقد يمتد لضعفها كحد أقصى. كلما كانت المدة أطول أصبحت فرصة تخمين الرمز من قِبل المخترقين أكبر، مما يضعف أمان موقعك. اختيار دقيقتين يمنحك توازناً ممتازاً بين راحة المستخدم وحماية الموقع."
