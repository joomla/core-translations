COM_PRIVACY_CORE_CAPABILITY_COMMUNICATION_WITH_JOOMLA_ORG="عند توفر اتصال بالشبكة، ستحاول نسخة جوملا المثبتة الاتصال بخوادم joomla.org لأداء وظائف متعددة، تشمل:<ul><li>التحقق من وجود تحديثات لتطبيق جوملا</li><li>صفحات المساعدة لإضافات جوملا الأساسية</li><li>خدمة التثبيت من الويب (اختياري)</li><li>خادم جمع الإحصاءات (اختياري)</li></ul>وكما هو الحال مع كافة طلبات HTTP، يُرسل عنوان IP الخاص بخادمك كجزء من الطلب. للحصول على معلومات حول كيفية معالجة جوملا للبيانات على خوادمها، يرجى مراجعة <a href=\"https://www.joomla.org/privacy-policy.html\" target=\"_blank\" rel=\"noopener noreferrer\">سياسة الخصوصية</a> الخاصة بنا."
COM_PRIVACY_CORE_CAPABILITY_LOGGING_IP_ADDRESS="يُدوّن نظام السجلات في جوملا عنوان IP للزائر الذي يؤدي إجراؤه إلى تسجيل رسالة في ملفات السجل. وتُستخدم هذه الملفات لرصد مختلف الأنشطة على موقع جوملا، ومنها المعلومات الخاصة بتحديثات النظام الأساسي، ومحاولات تسجيل الدخول الفاشلة، والأخطاء غير المعالجة، وبيانات التطوير كاستخدام واجهات برمجة التطبيقات APIs المهملة. وقد يُعدَّل تنسيق ملفات السجل هذه بواسطة أي إضافة تضبط مسجلاً للأحداث، لذا يُنصح بتنزيل ومراجعة ملفات السجل لموقعك والمتوفرة في المسار `%s`."
COM_PRIVACY_CORE_CAPABILITY_SESSION_IP_ADDRESS_AND_COOKIE="تبدأ جميع الطلبات الواردة إلى موقع جوملا جلسةً تخزن عنوان IP في بيانات الجلسة وتُنشئ ملف تعريف ارتباط للجلسة في متصفح المستخدم. ويُستخدم عنوان IP كإجراء أمني للمساعدة في الحماية من هجمات اختطاف الجلسات المحتملة، وتُحذف هذه المعلومات بمجرد انتهاء صلاحية الجلسة وتفريغ بياناتها. ويعتمد اسم ملف تعريف ارتباط الجلسة على تجزئة مُولّدة عشوائياً، وبالتالي لا يحتوي على معرّف ثابت. ويُتلف ملف تعريف ارتباط الجلسة بمجرد انتهاء الجلسة أو إغلاق المستخدم لمتصفحه."
