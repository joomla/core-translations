COM_PRIVACY_POSTINSTALL_BODY="<p>مع تطبيق اللائحة العامة لحماية البيانات GDPR لمواطني الاتحاد الأوروبي واللوائح المماثلة في مناطق أخرى حول العالم، قد يكون من الضروري أن تطلب الموافقة المسبقة قبل تخزين أي <strong>معلومات شخصية</strong> تخص المستخدم.</p><p>يقدم Joomla 3.9 إمكانات جديدة لمساعدتك في إنشاء سياسات خصوصية الموقع وجمع موافقة المستخدمين. بالإضافة إلى ذلك، يتوفر سير عمل مخصص لمساعدتك في إدارة طلبات معلومات المستخدمين، مثل طلبات إزالة بياناتهم الشخصية من موقعك.</p><p>للحصول على مزيد من المعلومات حول هذه الميزة الجديدة، يرجى الاطلاع على <a href='https://guide.joomla.org/user-manual/privacy' target='_blank' rel='noopener noreferrer'>وثائق الخصوصية</a>.</p>"
