PLG_SEF_DOMAIN_DESCRIPTION="إذا كان موقعك متاحاً عبر أكثر من نطاق دومين، فأدخل النطاق المفضل هنا لاعتماده كنطاق أساسي مرجعي (Canonical). <br><strong>ملاحظة:</strong> تعتبر محركات البحث الرابط بدون www مثل https://example.com والرابط مع www مثل https://www.example.com موقعين مختلفين تماماً."
PLG_SEF_DOMAIN_LABEL="اسم نطاق الموقع"
PLG_SEF_ENFORCESUFFIX_DESCRIPTION="عند تفعيل هذا الخيار بالتزامن مع تفعيل خيار \"إضافة لاحقة html في نهاية الروابط\" في الإعدادات العامة، سيقوم النظام تلقائياً بتحويل أي رابط يُكتب بدون لاحقة html إلى الرابط الصحيح الذي ينتهي بها. ملاحظة: بدءاً من إصدار جوملا 6.0، سيعمل هذا التحويل تلقائياً بشكل دائم ولن يكون هناك حاجة لهذا الخيار."
PLG_SEF_ENFORCESUFFIX_LABEL="إجبار الروابط على الانتهاء بلاحقة html"
PLG_SEF_INDEXPHP_DESCRIPTION="يعمل هذا الخيار على تنظيف الروابط بشكل صارم من كلمة 'index.php' بشرط تفعيل خيار 'استخدام إعادة كتابة الروابط' في الإعدادات العامة. سيقوم النظام تلقائياً بحذف 'index.php' إذا بقيت في أي رابط، وتحويل أي زائر يدخل عبر رابط قديم يحتوي على 'index.php' إلى الرابط الصحيح الخالي من 'index.php'."
PLG_SEF_INDEXPHP_LABEL="فرض إزالة أو إضافة index.php في الروابط بشكل صارم"
PLG_SEF_STRICTROUTING_DESCRIPTION="يمنع هذا الخيار فتح نفس الصفحة بأكثر من رابط مكرر أو غير قياسي، ويقوم تلقائياً بتحويل الزوار ومحركات البحث إلى الرابط الأصلي الصحيح للصفحة باستخدام إعادة توجيه دائمة 301."
PLG_SEF_STRICTROUTING_LABEL="منع الروابط المكررة وغير القياسية للصفحات - التوجيه الصارم"
PLG_SEF_TRAILINGSLASH_DESCRIPTION="يجبر هذا الخيار نظام جوملا على توحيد شكل روابط الموقع إما بإضافة شرطة مائلة في نهايتها أو إزالتها تماماً. عند تفعيله، سيقوم النظام بتحويل أي رابط مخالف إلى الشكل الصحيح تلقائياً، ويعمل هذا الخيار فقط في حال إيقاف خيار إضافة لاحقة html في نهاية الروابط في الإعدادات العامة."
PLG_SEF_TRAILINGSLASH_LABEL="إضافة أو إزالة الشرطة المائلة / في نهاية روابط الموقع"
PLG_SEF_TRAILINGSLASH_OPTION_NONE="بدون تغيير ترك الروابط كما هي"
PLG_SEF_TRAILINGSLASH_OPTION_NO_SLASH="إجبار الروابط على الانتهاء بدون شرطة مائلة"
PLG_SEF_TRAILINGSLASH_OPTION_SLASH="إجبار الروابط على الانتهاء بشرطة مائلة"
PLG_SEF_XML_DESCRIPTION="يقوم هذا التطبيق المساعد بتحويل الروابط داخل صفحات ومقالات موقعك تلقائياً لتصبح واضحة ومهيأة لمحركات البحث SEF، حيث يعمل مباشرة في الخلفية على كود الصفحة HTML دون الحاجة لإضافة أي أكواد أو وسوم يدوية."
PLG_SYSTEM_SEF="النظام - تحسين الروابط لمحركات البحث SEF"

