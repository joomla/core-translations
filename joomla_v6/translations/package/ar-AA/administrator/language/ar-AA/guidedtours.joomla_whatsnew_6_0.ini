COM_GUIDEDTOURS_TOUR_WHATSNEW_6_0_DESCRIPTION="<h1 class=\"fw-medium\">مرحباً بك في جوملا 6!</h1><div class=\"row align-items-center border-top border-1 pt-4\"><div class=\"col-md-6 col-lg-6 text-center text-md-start mb-3\"><img class=\"img-fluid shadow\" src=\"media/com_guidedtours/images/6_0/cassiopeiacolors.jpg\" alt=\"عرض أداة تخصيص نمط القالب التابع\" width=\"640\" height=\"380\"></div><div class=\"col-md-6 col-lg-6 mb-3\"><h2 class=\"mb-3\">كاسيوبيا الموسع</h2><p>استكشف القوالب التابعة بنمط جديد يستعرض ميزات التخصيص المتقدمة مثل تعديل الخطوط والألوان.</p></div></div><div class=\"row align-items-center border-top border-1 pt-4\"><div class=\"col-md-12 mb-3\"><h2 class=\"mb-3\">إدارة الإصدارات الموسعة</h2><p>تم تحسين نظام إدارة الإصدارات في جوملا ليشمل الحقول المخصصة والوسوم والفئات، مما يتيح تتبع كافة تغييرات المحتوى ومقارنتها واستعادتها.</p></div></div>"
COM_GUIDEDTOURS_TOUR_WHATSNEW_6_0_TITLE="ما الجديد في جوملا! 6!"

