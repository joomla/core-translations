COM_GUIDEDTOURS_TOUR_WELCOMETOJOOMLA_STEP_MENUS_TITLE="القائمة"
COM_GUIDEDTOURS_TOUR_WELCOMETOJOOMLA_STEP_MENUS_DESCRIPTION="<p>تتيح القائمة الوصول إلى صفحات إدارة لوحة التحكم. يضم كل قسم مجموعة من الصفحات لإدارة جانب معين من جوملا، مثل المحتوى والقوائم والمستخدمين.</p><p>تُحيلك أيقونات اللوحات الجانبية إلى لوحة تحكم مستقلة لكل قسم. كما تقودك قائمة النظام مباشرةً إلى لوحة تحكم خاصة بها.</p>"

COM_GUIDEDTOURS_TOUR_WELCOMETOJOOMLA_STEP_QUICKACCESS_TITLE="لوحة التحكم الرئيسية"
COM_GUIDEDTOURS_TOUR_WELCOMETOJOOMLA_STEP_QUICKACCESS_DESCRIPTION="<p>توفر لوحات المعلومات وصولاً سريعًا إلى الصفحات المستخدمة بشكل متكرر من خلال أيقوناتها.</p><p>تُعد كل لوحة معلومات وحدة إدارية يمكن تخصيصها من خلال أيقونة الإعدادات الخاصة بها <span class=\"icon-cogs\" aria-hidden=\"true\"></span>.<br>يسمح لك هذا بتكوين لوحات معلومات موقعك لتناسب أغراضك الخاصة.</p>"

COM_GUIDEDTOURS_TOUR_WELCOMETOJOOMLA_STEP_NOTIFICATIONS_TITLE="لوحة الإشعارات"
COM_GUIDEDTOURS_TOUR_WELCOMETOJOOMLA_STEP_NOTIFICATIONS_DESCRIPTION="<p>تُظهر لك لوحة الإشعارات تنبيهات فورية عند توفر تحديثات جديدة لجوملا أو للإضافات المثبتة في موقعك. كما ستجد هنا طلبات الخصوصية المعلقة التي تنتظر مراجعتك.</p>"

COM_GUIDEDTOURS_TOUR_WELCOMETOJOOMLA_STEP_TOPBAR_TITLE="الشريط العلوي"
COM_GUIDEDTOURS_TOUR_WELCOMETOJOOMLA_STEP_TOPBAR_DESCRIPTION="<p>يُظهر الشريط العلوي عنوان الصفحة التي تتصفحها حالياً حتى تعرف دائماً أين تتواجد. بقية الأزرار والعناصر الموجودة في هذا الشريط هي موديولات إضافية يمكن التحكم بها.</p><p>غالباً ما ستجد هنا رقم إصدار جوملا المثبت لديك، بالإضافة إلى زر للوصول إلى جولات تعريفية أخرى.</p><p>أما في نهاية الشريط، فستجد عادةً رابطاً للانتقال السريع إلى واجهة موقعك، وقائمة حسابك الشخصي لتعديل بياناتك أو تسجيل الخروج.</p>"

COM_GUIDEDTOURS_TOUR_WELCOMETOJOOMLA_STEP_FINALWORDS_TITLE="المساعدة والمعلومات"
COM_GUIDEDTOURS_TOUR_WELCOMETOJOOMLA_STEP_FINALWORDS_DESCRIPTION="<p>تجمع لك هذه الصفحة العديد من المصادر المفيدة لمساعدتك في إدارة موقعك، بالإضافة إلى روابط مباشرة للوثائق التعليمية والدعم الفني وكيفية المشاركة والمساهمة في جوملا.</p>"

