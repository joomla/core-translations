PLG_CONTENT_JOOMLA="المحتوى - جوملا"
PLG_CONTENT_JOOMLA_XML_DESCRIPTION="تعمل هذه الإضافة في الخلفية على إدارة ومعالجة التصنيفات للمكونات الأساسية في جوملا، وتقوم تلقائياً بإرسال رسالة بريد إلكتروني لتنبيه الإدارة عند قيام أحد المستخدمين بإضافة مقال جديد من واجهة الموقع، أو عند نقل المقال من مرحلة إلى أخرى ضمن سير العمل."

