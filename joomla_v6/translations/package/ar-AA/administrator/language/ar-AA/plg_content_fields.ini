PLG_CONTENT_FIELDS="المحتوى - الحقول الإضافية"
PLG_CONTENT_FIELDS_XML_DESCRIPTION="<p>تتيح لك هذه الإضافة إظهار الحقول المخصصة في أي مكان داخل المقال، سواء قمت بإدراجها عبر إضافة «زر - الحقول» أو بكتابة الصيغة {field #} مباشرة داخل محرر النصوص.</p><p><strong>أمثلة على الصيغ التي يمكنك كتابتها:</strong></p><ul><li><code>{field 1}</code> يعرض الحقل المخصص الذي رقمه التعريفي 1.</li><li><code>{field 1,foo}</code> يعرض الحقل رقم 1 ولكن بشكل وتصميم بديل اسمه 'foo'.</li><li><code>{fieldgroup 2}</code> يعرض جميع الحقول الموجودة داخل مجموعة الحقول التي رقمها التعريفي 2 دفعة واحدة.</li></ul>"

