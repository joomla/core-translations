COM_CONFIG_FIELD_DEFAULT_CAPTCHA_DESC="يستطيع نظام جوملا والإضافات الخارجية استخدام أداة التحقق <a href=\"https://en.wikipedia.org/wiki/CAPTCHA\" target=\"_blank\" rel=\"noopener noreferrer\">CAPTCHA</a> لحماية النماذج العامة في موقعك من الرسائل العشوائية (السبام). ويمكن لكل إضافة اختيار أداة تحقق مختلفة إذا كان لديك أكثر من أداة، أما إذا لم تختر شيئاً فسيتم استخدام هذه الأداة تلقائياً. لتفعيل أدوات تحقق إضافية، انتقل إلى: النظام، الإدارة، الإضافات البرمجية."
