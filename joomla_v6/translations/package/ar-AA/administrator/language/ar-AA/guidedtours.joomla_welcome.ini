COM_GUIDEDTOURS_TOUR_WELCOMETOJOOMLA_TITLE="مرحباً بك في جوملا"
COM_GUIDEDTOURS_TOUR_WELCOMETOJOOMLA_DESCRIPTION="<p>ستمنحك هذه الجولة نظرة عامة سريعة حول كيفية بدء استخدام جوملا!</p><p>أنت في منطقة إدارة جوملا، والمعروفة أيضاً باسم '<strong>الواجهة الخلفية</strong>'.<br>هنا يمكنك إعداد وإدارة موقع جوملا الخاص بك بالكامل.</p><p><strong>هل ترغب في معرفة المزيد؟</strong></p><p>لنبدأ الجولة وابنِ موقعك بقوة جوملا!</p>"

