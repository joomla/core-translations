PLG_CAPTCHA_POWCAPTCHA_XML_DESCRIPTION="تقدم إضافة الكابتشا هذه مسألة رياضية إلى متصفح المستخدم يمكن للمتصفح حلها تلقائياً. ليس الغرض منها إثبات أن المستخدم بشري، بل إثبات استعداده لبذل الوقت اللازم لحل المسألة. تعتمد حالياً على مكتبة Altcha (altcha.org)."

