PLG_CONTENT_PAGEBREAK_XML_DESCRIPTION="<p>تمكّنك هذه الإضافة من تقسيم المقالات الطويلة إلى عدة صفحات متتالية مع عرض فهرس (جدول محتويات) اختياري لتسهيل تنقّل القارئ بينها.</p><p>لتقسيم المقال، اضغط على زر «فاصل الصفحة» الموجود في شريط أدوات محرر النصوص؛ وسيظهر لك مكان التقسيم داخل المحرر على شكل خط أفقي بسيط.</p><p>تظهر عناوين الصفحات للقارئ بناءً على الإعدادات التي تحددها، سواء بعرض عنوان كل صفحة، أو نص بديل تكتبه بنفسك، أو الاكتفاء بأرقام الصفحات.</p><p>ويمكنك أيضاً إدراج الفاصل يدوياً في الكود باستخدام إحدى الصيغ التالية:<br>&lt;hr class=&quot;system-pagebreak&quot; /&gt;<br>&lt;hr class=&quot;system-pagebreak&quot; title=&quot;عنوان الصفحة&quot; /&gt; أو <br>&lt;hr class=&quot;system-pagebreak&quot; alt=&quot;الصفحة الأولى&quot; /&gt; أو <br>&lt;hr class=&quot;system-pagebreak&quot; title=&quot;عنوان الصفحة&quot; alt=&quot;الصفحة الأولى&quot; /&gt; أو <br>&lt;hr class=&quot;system-pagebreak&quot; alt=&quot;الصفحة الأولى&quot; title=&quot;عنوان الصفحة&quot; /&gt;</p>"

