PLG_AUTHENTICATION_COOKIE_PRIVACY_CAPABILITY_COOKIE="بالتكامل مع إضافة تدعم ميزة \"تذكرني\"، مثل إضافة \"النظام - تذكرني\"، تُنشئ هذه الإضافة ملف تعريف ارتباط في متصفح المستخدم في حال تحديد مربع الاختيار \"تذكرني\" عند تسجيل الدخول إلى الموقع. ويمكن التعرف على ملف تعريف الارتباط هذا من خلال البادئة `joomla_remember_me`، ويُستخدم لتسجيل دخول المستخدمين تلقائياً إلى الموقع عند زيارته إذا لم يكونوا قد سجلوا دخولهم بالفعل."
PLG_AUTHENTICATION_COOKIE_XML_DESCRIPTION="<p> يعالج مصادقة مستخدم ملف تعريف الارتباط الخاص بجوملا. </p> <p> <strong> تحذير! يجب أن يكون لديك تطبيق إضافي للمصادقة واحد على الأقل ممكّن. </strong><br>ستحتاج أيضًا إلى تطبيق إضافي مثل النظام - تذكرني المكوّن الإضافي لتنفيذ تسجيل الدخول إلى ملف تعريف الارتباط. </p>"

