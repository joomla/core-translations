PLG_TASK_UPDATENOTIFICATION="مهام - Joomla! إشعارات التحديث"
PLG_TASK_UPDATENOTIFICATION_END="اكتمل فحص التحديثات وإرسال الإشعارات"
PLG_TASK_UPDATENOTIFICATION_EMAIL_DESC="قائمة عناوين البريد الإلكتروني التي سوف تتلقى رسائل البريد الإلكتروني إعلاما بالتحديث الفصل بينها بفاصلة. العناوين في القائمة يجب أن تنتمي إلى المستخدمين الحاليين لموقع الويب الخاص بك الذين لديهم عضوية الادارة. إذا كان أي من البريد الإلكتروني المدرج ينتمي إلى اعضاء الادارة، أو إذا تبقى فارغا، فإن جميع الاعضاء المديرين لهذا الموقع سوف يحصلون على البريد الإلكتروني إشعارا بالتحديث."
PLG_TASK_UPDATENOTIFICATION_EMAIL_LBL="البريد الالكتروني للمدير العام"
PLG_TASK_UPDATENOTIFICATION_SEND_TITLE="Joomla! - إشعارات التحديث"
PLG_TASK_UPDATENOTIFICATION_SEND_DESC="تقوم هذه المهمة بالتحقق دورياً من توفر إصدارات جديدة من Joomla!. وعند العثور على إصدار جديد، ستُرسل إليك بريداً إلكترونياً لتذكيرك بالتحديث. يمكنك تخصيص البريد الإلكتروني عبر <a href=\"index.php?option=com_mails&view=templates&filter[extension]=plg_task_updatenotification\">النظام &rarr; قوالب البريد الإلكتروني.</a>"
PLG_TASK_UPDATENOTIFICATION_LANGUAGE_OVERRIDE_DESC="إذا اخترت تلقائي (افتراضي)، فالبريد الإلكتروني إعلاما بالتحديث إلى المدير يكون بلغة الموقع وفي حين تم تشغيل البرنامج المساعد وتم اختيار اللغة فإن رسائل البريد الإلكتروني إعلاما بالتحديث يتم إرسالها في هذه اللغة المحددة."
PLG_TASK_UPDATENOTIFICATION_LANGUAGE_OVERRIDE_LBL="لغة البريد الالكتروني"
PLG_TASK_UPDATENOTIFICATION_LANGUAGE_OVERRIDE_NONE="تلقائي"
PLG_TASK_UPDATENOTIFICATION_EMAIL_BODY="تنبيه: هذه الرسالة لم يرسلها فريق جوملا!، وإنما أرسلها موقعك الإلكتروني تلقائياً:\n{SITENAME} - {URL} \n\n================================================================================\nمعلومات التحديث\n================================================================================\n\nاكتشف موقعك وجود إصدار جديد متاح لنظام جوملا!.\n\nالإصدار المثبت حالياً في موقعك: {CURVERSION}\nالإصدار الجديد المتاح للتثبيت: {NEWVERSION}\n\nأرسل موقعك هذه الرسالة لتذكيرك بضرورة التحديث.\nفريق مشروع جوملا! لا يتواصل معك أبداً بشكل مباشر لإبلاغك بتحديثات موقعك.\n\n================================================================================\nخطوات التحديث\n================================================================================\n\nلتثبيت التحديث على موقع {SITENAME}، اضغط على الرابط التالي. (أو انسخه والصقه في شريط العنوان بمتصفحك إذا لم يعمل بالنقر).\n\nرابط التحديث: {LINK}\n\nلمعرفة تفاصيل ومزايا هذا الإصدار، يمكنك زيارة الرابط التالي: {RELEASENEWS}\n\n================================================================================\nلماذا وصلتني هذه الرسالة؟\n================================================================================\n\nتُرسل هذه الرسالة تلقائياً عبر إضافة برمجية مدمجة في نظام جوملا! الذي يعتمد عليه موقعك.\nتعمل هذه الإضافة على البحث عن أي تحديثات جديدة للنظام وإبلاغ مدراء الموقع بها عبر البريد الإلكتروني.\nستستمر هذه الرسائل في الوصول إليك حتى تقوم بتحديث الموقع أو إيقاف هذه التنبيهات.\n\nلإيقاف هذه الرسائل، انتقل إلى مدير الإضافات البرمجية في لوحة تحكم موقعك وقم بإلغاء نشر الإضافة المسماة 'مهمة - إشعار تحديث جوملا!'.\n\nإذا لم تكن تعرف ما هو نظام جوملا! ولا تعلم ماذا تفعل، فلا تتواصل مع مشروع جوملا!.\nإنهم لم يرسلوا هذه الرسالة ولن يتمكنوا من مساعدتك؛ بل تواصل مباشرة مع المطور أو الشخص المسؤول عن إدارة موقعك.\n\nوإذا كنت أنت المسؤول عن إنشاء الموقع أو إدارته، فتذكر أن هذه الإضافة قد تكون تم تفعيلها تلقائياً عند تثبيت جوملا! أو تحديثه.\n\n================================================================================\nمن هو مُرسل هذه الرسالة؟\n================================================================================\n\nمُرسل هذه الرسالة هو موقعك الإلكتروني نفسه، {SITENAME}"
; You can use the following merge codes:
; {NEWVERSION}		New Joomla! version, e.g. 1.2.3
; {CURVERSION}		Currently installed Joomla! version, e.g. 1.2.0
; {SITENAME}		Site name, as set in Global Configuration.
; {URL}			URL of the site's frontend page.
; {LINK}		Update URL (link to com_joomlaupdate, will request login if the Super User isn't already logged in).
; {RELEASENEWS}		URL to the release news on joomla.org
; \n			Newline character. Use it to start a new line in the email.
PLG_TASK_UPDATENOTIFICATION_EMAIL_SUBJECT="يتوفر الآن تحديث جديد لنظام جوملا! في موقع {SITENAME} – {URL}"
PLG_TASK_UPDATENOTIFICATION_MAIL_MAIL_DESC="إشعار يصل تلقائياً إلى مدراء الموقع عندما تكتشف المهمة المجدولة &quot;إشعار تحديث جوملا!&quot; وجود إصدار جديد متاح للنظام."
PLG_TASK_UPDATENOTIFICATION_MAIL_MAIL_TITLE="جوملا: إشعار بوجود تحديث جديد للنظام"
PLG_TASK_UPDATENOTIFICATION_XML_DESCRIPTION="تتحقق هذه المهمة دورياً من توفر إصدارات جديدة من جوملا. وعند العثور على إصدار جديد، ستُرسل إليك رسالة بريد إلكتروني لتذكيرك بالتحديث. يمكنك تخصيص البريد الإلكتروني من خلال <a href=\"index.php?option=com_mails&view=templates&filter[extension]=plg_task_updatenotification\">النظام &rarr; قوالب البريد الإلكتروني.</a>"

