COM_GUIDEDTOURS_TOUR_WHATSNEW_6_1_DESCRIPTION="<h1 class=\"fw-medium\">مرحباً بك في جوملا 6.1!</h1><p>يقدّم جوملا 6.1 تحسينات جوهرية تجعل بناء المواقع أسهل وأكثر أماناً ومرونة. تمنحك هذه الجولة أهم الميزات الأساسية في لمحة سريعة.</p><div class=\"row align-items-center mb-4 pt-4 border-top border-1\"><div class=\"col-md-6 col-lg-7\"><h2 class=\"mb-3\">الحماية من البريد المزعج تعود مجدداً مع كابتشا إثبات العمل</h2><p>دون الحاجة إلى حساب أو واجهة برمجة API، وبمراعاة تامة للخصوصية وسهولة الوصول، تحل هذه الكابتشا ألغازاً رياضية في الخلفية بصمت ودون أن يلاحظها الزوار.</p><p>لتفعيلها، انتقل إلى <em>الامتدادات</em> -&gt; <em>الملحقات</em>، ثم ابحث عن <strong>captcha</strong>، وقم بتفعيلها وضبطها كخيار افتراضي في الإعدادات العامة.</p></div><div class=\"col-md-6 col-lg-5 text-center text-md-start mb-3\"><img class=\"img-fluid\" src=\"media/com_guidedtours/images/6_1/captcha.jpg\" alt=\"توضح الكابتشا حالتي التحقق وتَمّ التحقق\" width=\"600\" height=\"250\"></div></div><div class=\"row align-items-center border-top border-1 pt-4\"><div class=\"col-md-6 col-lg-5 text-center text-md-start mb-3\"><img class=\"img-fluid\" src=\"media/com_guidedtours/images/6_1/workflows.jpg\" alt=\"تمثيل رسومي لمسار العمل الأساسي\" width=\"600\" height=\"350\"></div><div class=\"col-md-6 col-lg-7 mb-3\"><h2 class=\"mb-3\">مسار تدفق المحتوى في لمحة سريعة مع محرّر مسار العمل المرئي</h2><p>أدِر مسار عمل المحتوى بسهولة أكبر مع مخطط مسار العمل التفاعلي الجديد الذي يتيح لك رؤية عملية النشر بأكملها.</p><p>قم بتفعيل مسارات العمل من <em>إدارة المقالات</em> -&gt; <em>مسارات العمل</em> وابحث عن زر المخطط.</p></div></div><div class=\"row align-items-center border-top border-1 pt-4\"><div class=\"col-md-6 col-lg-7 mb-3\"><h2 class=\"mb-3\">ثلاثة خيارات جديدة لحقل الوسائط المخصص: الصوت، الفيديو &amp; المستندات</h2><p>عند إنشاء حقول مخصصة للمحتوى، يمكنك الآن السماح لمنشئي المحتوى بتضمين أي نوع من الوسائط، وليس فقط الصور.</p><p>يتم عرض الوسائط كعناصر HTML5 &lt;audio&gt; أو &lt;video&gt;، أو كروابط مستندات (PDF وجداول البيانات...).</p></div><div class=\"col-md-6 col-lg-5 text-center text-md-start mb-3\"><img class=\"img-fluid\" src=\"media/com_guidedtours/images/6_1/media.jpg\" alt=\"خيارات حقل الوسائط الثلاثة الصوت والفيديو والمستند\" width=\"600\" height=\"350\"></div></div><div class=\"row align-items-center border-top border-1 pt-4\"><div class=\"col-12 mb-3\"><h2 class=\"mb-3\">وحدات أذكى مع ميزة تعقب الإصدارات والربط متعدد اللغات</h2><p>لطالما توفر في جوملا سجل تاريخ الإصدارات للمقالات. وتمتد هذه الإمكانية الآن لتشمل الوحدات.<br>إذا كنت تدير موقعاً متعدد اللغات، يمكنك الآن ربط نُسخ الوحدات عبر مختلف اللغات، تماماً كما يمكنك ربط المقالات عبر اللغات.</p><h2>تحسينات أخرى جديرة بالملاحظة</h2><ul class=\"mb-3\"><li>دعم وسم الاختصار <strong>&lt;abbr&gt;</strong> في محرر النصوص TinyMCE، بصياغة دلالية سليمة مع تحسين إمكانية الوصول (ابحث عن زر الاختصار الجديد في شريط أدوات TinyMCE عند تحرير المحتوى).</li><li>تحسينات في تجربة المستخدم لحالة تجاوزات اللغة &amp; الإنشاء السريع للتجاوزات المفقودة (مؤشر الحالة، وتعديل التجاوزات بسهولة).</li></ul></div></div> "
COM_GUIDEDTOURS_TOUR_WHATSNEW_6_1_TITLE="ما الجديد في جوملا 6.1!"

