PLG_BEHAVIOUR_COMPAT6="السلوك - دعم التوافق مع الإضافات القديمة في الإصدار 6"
PLG_COMPAT6_FIELD_CLASSES_ALIASES_DESCRIPTION="توفير أسماء بديلة للفئات البرمجية التي تغيّرت أسماؤها أو مواقعها البرمجية، لضمان استمرار عمل الإضافات القديمة دون أخطاء."
PLG_COMPAT6_FIELD_CLASSES_ALIASES_LABEL="الأسماء المستعارة للكلاسات"
PLG_COMPAT6_FIELD_LEGACY_CLASSES_DESCRIPTION="فعّل هذا الخيار إذا كانت لديك إضافة قديمة لا تزال تحتاج إلى فئات برمجية لم تعد مستخدمة وتم حذفها من الإصدار الحالي لجوملا. تتوفر هذه الفئات المحذوفة داخل المجلد /plugins/behavior/compat6/classes/ لضمان عمل إضافتك دون توقف."
PLG_COMPAT6_FIELD_LEGACY_CLASSES_LABEL="تضمين أكواد Php القديمة للتوافقية"
PLG_COMPAT6_FIELD_REMOVED_ASSETS_DESCRIPTION="قم بتفعيل هذا الخيار إذا كان الملحق الخاص بك يتطلب إزالة الأصول التي أدت إلى استثناء. الأصول المقدمة فارغة لكنها تمنع الاستثناء."
PLG_COMPAT6_FIELD_REMOVED_ASSETS_LABEL="الأصول المحذوفة"
PLG_COMPAT6_XML_DESCRIPTION="إذا كنت تستخدم ملحقات لا تتبع معايير جوملا البرمجية الحالية، فإن هذا الملحق، عند تفعيله، سيوفر التوافق مع الإصدار الرئيسي السابق، Joomla 5."

