COM_GUIDEDTOURS_TOUR_WHATSNEW_6_0_STEP_0_DESCRIPTION="<div class=\"row align-items-center pt-3\"><div class=\"col-12\"><h2 class=\"mb-3\">تحديثات إضافية</h2><p>تتشارك المقالات المميزة حالياً شاشة العرض مع مدير المقالات.</p></div></div><div class=\"row align-items-center pt-4\"><div class=\"col-12\"><h3>إذا فاتك الجديد</h3><p>يدعم Joomla! 6 التحديثات الآلية عبر إطار التحديث (TUF) لتعزيز الأمان وتحسين الأداء.<br>ستجد إعدادات التحديث الآلي ضمن قسم تهيئة <em>تحديث Joomla!</em>.</p></div></div><div class=\"row align-items-center pt-4\"><div class=\"col-12\"><h3>تحسينات وإصلاحات أخرى</h3><ul class=\"mb-3\"><li>إشعار بريدي عند اعتماد تسجيل المستخدم من قِبل المدير <a href=\"https://github.com/joomla/joomla-cms/pull/45802\" target=\"_blank\" rel=\"noopener noreferrer\">PR#45802</a></li><li>إمكانية إدراج أصناف CSS مخصصة في القائمة المنسدلة لنافذة الصور في TinyMCE <a href=\"https://github.com/joomla/joomla-cms/pull/45676\" target=\"_blank\" rel=\"noopener noreferrer\">PR#45676</a></li><li>إمكانية حذف الوسوم عبر المعالجة المجمعة <a href=\"https://github.com/joomla/joomla-cms/pull/40613\" target=\"_blank\" rel=\"noopener noreferrer\">PR#40613</a></li><li>والكثير الكثير من التحسينات البرمجية خلف الكواليس...</li></ul></div></div>"
COM_GUIDEDTOURS_TOUR_WHATSNEW_6_0_STEP_0_TITLE="ميزات أخرى"
COM_GUIDEDTOURS_TOUR_WHATSNEW_6_0_STEP_1_DESCRIPTION="<h3>معلومات إصدار Joomla 6.0</h3><p><a title=\"معلومات الإصدار\" href=\"https://6.joomla.org/\" target=\"_blank\" rel=\"noopener noreferrer\">عرض معلومات الإصدار على 6.joomla.org</a></p><hr><h3>المساعدة والمعلومات</h3><p>يمكنك العثور هنا على العديد من الموارد لمساعدتك، بالإضافة إلى روابط إضافية لمزيد من المصادر والتوثيق والدعم الفني وكيفية المساهمة في مجتمع Joomla.</p>"
COM_GUIDEDTOURS_TOUR_WHATSNEW_6_0_STEP_1_TITLE="المزيد من المعلومات والمساعدة"

