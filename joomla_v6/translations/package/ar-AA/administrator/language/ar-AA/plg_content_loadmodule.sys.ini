PLG_CONTENT_LOADMODULE="المحتوى - تضمين الوحدات في المقالات"
PLG_LOADMODULE_XML_DESCRIPTION="تمكّنك هذه الإضافة من عرض أي وحدة برمجية داخل المقالات والمحتوى بعدة طرق: باستخدام رقمها التعريفي عبر كتابة {loadmoduleid 1}، أو باستخدام اسم موضعها عبر {loadposition user1}، أو باستخدام اسمها البرمجي عبر {loadmodule mod_login}. كما يمكنك اختيارياً تحديد شكل عرض الوحدة، أو تحديد وحدة معينة بعنوانها باستخدام الصيغة: {loadmodule mod_login,module title,style}."

