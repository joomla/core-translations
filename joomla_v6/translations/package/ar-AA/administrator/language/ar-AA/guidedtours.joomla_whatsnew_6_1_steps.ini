COM_GUIDEDTOURS_TOUR_WHATSNEW_6_1_STEP_0_DESCRIPTION="<h3>ملاحظات الإصدار الكاملة لـ Joomla 6.1</h3><p><a title=\"ملاحظات الإصدار الكاملة\" href=\"https://www.joomla.org/announcements.html\" target=\"_blank\" rel=\"noopener noreferrer\">عرض ملاحظات الإصدار الكاملة على joomla.org</a></p><hr><h3>المساعدة والمعلومات</h3><p>يمكن العثور على العديد من الموارد لمساعدتك هنا، بالإضافة إلى روابط إضافية لمزيد من الموارد، والوثائق، والدعم، وكيفية المساهمة في Joomla.</p>"
