COM_GUIDEDTOURS_TOUR_WHATSNEW_6_2_DESCRIPTION="<h1 class=\"fw-medium\">Benvinguts a Joomla 6.2!</h1><div class=\"row align-items-center pt-4\"><h2 class=\"mb-3\">Actualitzacions del nucli</h2><div class=\"col-12 mb-3\"><h3>Millores en l'edició de contingut</h3><ul><li><strong>Integració del Gestor de mitjans i l'opció «Llegir més»</strong>: Afegir imatges i fitxers multimèdia és ara més senzill gràcies a un selector actualitzat que obre el Gestor de mitjans de Joomla; a més, el nou botó «Llegir més» permet inserir salts en els articles d'una manera més ràpida.</li><li><strong>Classes CSS separades per a imatges i elements «figure»</strong>: Les imatges que apareixen a la introducció o al text complet d'un article disposen ara de camps de classe CSS independents: un per a la imatge i un altre per a l'element «figure» que l'envolta.</li></ul></div></div><div class=\"row align-items-center pt-1\"><div class=\"col-md-6 col-lg-7 mb-4\"><img class=\"img-fluid d-block mx-auto\" src=\"media/com_guidedtours/images/6_2/sublevel_menu.jpg\" alt=\"Menús amb subnivells\" width=\"383\" height=\"280\"></div><div class=\"col-md-6 col-lg-5\"><h3>Plantilla del lloc (Cassiopeia)</h3><ul><li><strong>Menús desplegables multinivell</strong>: Els menús de la plantilla Cassiopeia ara admeten més d'un subnivell en els dissenys desplegables o plegables.</li></ul></div></div><div class=\"row align-items-center pt-1\"><div class=\"col-md-6 col-lg-7 my-3\"><h3>Mòduls i configuració del lloc</h3><ul class=\"mb-3\"><li><strong>Opcions per mostrar o ocultar enllaços al mòdul d'inici de sessió (mod_login)</strong>: Els administradors ara poden ocultar els enllaços «Has oblidat la contrasenya?» i «Has oblidat el nom d'usuari?» sense necessitat de fer una modificació (override) a la plantilla. Per defecte es mostren, de manera que no hi ha cap canvi en els llocs web existents.</li><li><strong>Etiqueta de seguretat per a actualitzacions d'extensions</strong>: Els desenvolupadors poden marcar una versió com a actualització de seguretat (amb un nivell de gravetat que va des de «Cap» fins a «Crític»); aquestes actualitzacions apareixen destacades a Sistema -&gt; Actualització -&gt; Extensions i icona ràpida al tauler de control.</li></ul></div><div class=\"col-md-6 col-lg-5\"><img class=\"img-fluid d-block mx-auto\" src=\"media/com_guidedtours/images/6_2/security_warning.jpg\" alt=\"Etiquetes de seguretat a les extensions\" width=\"488\" height=\"144\"></div></div>"
COM_GUIDEDTOURS_TOUR_WHATSNEW_6_2_TITLE="Novetats a Joomla 6.2!"

