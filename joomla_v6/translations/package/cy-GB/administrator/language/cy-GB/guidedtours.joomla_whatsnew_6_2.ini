COM_GUIDEDTOURS_TOUR_WHATSNEW_6_2_DESCRIPTION="<h1 class=\"fw-medium\">Croeso i Joomla 6.2!</h1><div class=\"row align-items-center pt-4\"><h2 class=\"mb-3\">Diweddariadau Craidd</h2><div class=\"col-12 mb-3\"><h3>Gwelliannau Golygu Cynnwys</h3><ul><li><strong>Gwelliannau Rheolwr Cyfryngau a Darllen Mwy</strong>: Mae ychwanegu delweddau a cyfryngau wedi dod yn haws gyda dewisydd newydd sy'n agor Rheolwr Cyfryngau Joomla a mae'r botwm Darllen Mwy newydd yn darparu dull cyflymach o roi toriadau mewn erthygl.</li><li><strong>Dosbarthiadau gwahanol ar gyfer delweddau a ffigyrau</strong>: Mae gan ddelweddau cyflwyniad/testun llawn rŵan feysydd dosbarth CSS annibynnol ar gyfer y ddelwedd a'r elfen ffigwr sy'n ei amgylchynu.</li></ul></div></div><div class=\"row align-items-center pt-1\"><div class=\"col-md-6 col-lg-7 mb-4\"><img class=\"img-fluid d-block mx-auto\" src=\"media/com_guidedtours/images/6_2/sublevel_menu.jpg\" alt=\"Sublevel menus\" width=\"383\" height=\"280\"></div><div class=\"col-md-6 col-lg-5\"><h3>Templed Gwefan Flaen (Cassiopeia)</h3><ul><li><strong>Cwymplenni aml-lefel</strong>: Mae dewislenni Cassiopeia rwan yn galluogi mwy nag un is-lefel mewn cynlluniau cwymplen/plygadwy</li></ul></div></div><div class=\"row align-items-center pt-1\"><div class=\"col-md-6 col-lg-7 my-3\"><h3>Ffurfweddiad Modiwlau a Gwefan</h3><ul class=\"mb-3\"><li><strong>Toglau dolennau mod_login</strong>: Mae opsiynau newydd yn caniatáu i weinyddwyr guddio y dolenni \"Wedi anghofio eich cyfrinair?\" a \"Wedi anghofio eich enw defnyddiwr?\" heb amnewidiad templed. Dangos yw'r dewis diofyn felly nid yw'n effeithio ar wefannau sy'n bodoli'n barod.</li><li><strong>Fflag diogelwch ar gyfer diweddariadau estyniadau</strong>: Gall datblygwyr nodi fersiwn newydd fel diweddariad diogelwch (difrifoldeb Dim i Argyfyngus); mae diweddariadau sydd wedi eu fflagio yn cael eu hamlygu yn System -&gt; Diweddariadau -&gt; Estyniadau ac ar eicon cyflym y dangosfwrdd.</li></ul></div><div class=\"col-md-6 col-lg-5\"><img class=\"img-fluid d-block mx-auto\" src=\"media/com_guidedtours/images/6_2/security_warning.jpg\" alt=\"Security tags on extensions\" width=\"488\" height=\"144\"></div></div>"
COM_GUIDEDTOURS_TOUR_WHATSNEW_6_2_TITLE="Be sy'n newydd yn Joomla 6.2!"

