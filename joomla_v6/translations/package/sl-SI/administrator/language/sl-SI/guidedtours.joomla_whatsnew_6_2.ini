COM_GUIDEDTOURS_TOUR_WHATSNEW_6_2_DESCRIPTION="<h1 class=\"fw-medium\">Dobrodošli v Joomli 6.2!</h1><div class=\"row align-items-center pt-4\"><h2 class=\"mb-3\">Ključne posodobitve</h2><div class=\"col-12 mb-3\"><h3>Nadgradnje urejanja vsebine</h3><ul><li><strong>Upravitelj medijev/Preberite več integracij</strong>: Dodajanje slik in predstavnostnih vsebin je postalo lažje s posodobljenim izbirnikom, ki zdaj odpira Joomla Upravitelj medijev, nov gumb Preberite več pa omogoča hitrejše vstavljanje prelomov v prispevke.</li><li><strong>Ločeni razredi za slike in slike (figure)</strong>: Slike v uvodu ali celotnem besedilu članka imajo zdaj ločena polja za razrede CSS – eno za sliko in drugo za element figure, ki jo obdaja.</li></ul></div></div><div class=\"row align-items-center pt-1\"><div class=\"col-md-6 col-lg-7 mb-4\"><img class=\"img-fluid d-block mx-auto\" src=\"media/com_guidedtours/images/6_2/sublevel_menu.jpg\" alt=\"Sublevel menus\" width=\"383\" height=\"280\"></div><div class=\"col-md-6 col-lg-5\"><h3>Predloga za sprednji del (Cassiopeia)</h3><ul><li><strong>Večnivojski spustni meniji</strong>: Cassiopeia meniji zdaj podpirajo več kot eno podraven v spustnih ali zložljivih postavitvah.</li></ul></div></div><div class=\"row align-items-center pt-1\"><div class=\"col-md-6 col-lg-7 my-3\"><h3>Moduli in konfiguracija spletne strani</h3><ul class=\"mb-3\"><li><strong>mod_login link toggles</strong>: Nove možnosti skrbnikom omogočajo skrivanje povezav "_QQ_"Ste pozabili geslo?"_QQ_" in "_QQ_"Ste pozabili uporabniško ime?"_QQ_" brez preglasitve predloge. Privzeto so povezave prikazane, zato to ne vpliva na obstoječe spletne strani.</li><li><strong>Varnostna oznaka za posodobitve razširitev</strong>: Razvijalci lahko izdajo označijo kot varnostno posodobitev (s stopnjo resnosti od brez do kritična); tako označene posodobitve so izpostavljene v razdelku Sistem -&gt; Posodobitev -&gt; Razširitve ter na hitri ikoni na nadzorni plošči..</li></ul></div><div class=\"col-md-6 col-lg-5\"><img class=\"img-fluid d-block mx-auto\" src=\"media/com_guidedtours/images/6_2/security_warning.jpg\" alt=\"Security tags on extensions\" width=\"488\" height=\"144\"></div></div>"
COM_GUIDEDTOURS_TOUR_WHATSNEW_6_2_TITLE="Kaj je novega v Joomla 6.2!"

