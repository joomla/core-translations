COM_GUIDEDTOURS_TOUR_WHATSNEW_6_2_DESCRIPTION="<h1 class=\"fw-medium\">Vítejte v Joomla 6.2!</h1><div class=\"row align-items-center pt-4\"><h2 class=\"mb-3\">Aktualizace jádra</h2><div class=\"col-12 mb-3\"><h3>Vylepšení úpravy obsahu</h3><ul><li><strong>Integrace Správce médií a funkce „Číst dále“</strong>: Přidávání obrázků a médií je nyní snazší díky aktualizovanému výběrovému nástroji, který otevírá Správce médií Joomla; nové tlačítko „Číst dále“ navíc umožňuje rychlejší vkládání zlomů článku.</li><li><strong>Samostatné třídy pro obrázky a prvky figure</strong>: Obrázky v úvodu či plném textu článku mají nyní nezávislá pole pro CSS třídy – jedno pro samotný obrázek a druhé pro obklopující prvek &lt;figure&gt;.</li></ul></div></div><div class=\"row align-items-center pt-1\"><div class=\"col-md-6 col-lg-7 mb-4\"><img class=\"img-fluid d-block mx-auto\" src=\"media/com_guidedtours/images/6_2/sublevel_menu.jpg\" alt=\"Podúrovně menu\" width=\"383\" height=\"280\"></div><div class=\"col-md-6 col-lg-5\"><h3>Šablona pro veřejnou část (Cassiopeia)</h3><ul><li><strong>Víceúrovňová rozbalovací menu</strong>: Menu v šabloně Cassiopeia nyní podporují více než jednu podúroveň v rozbalovacích či skládacích rozloženích.</li></ul></div></div><div class=\"row align-items-center pt-1\"><div class=\"col-md-6 col-lg-7 my-3\"><h3>Moduly a konfigurace webu</h3><ul class=\"mb-3\"><li><strong>Přepínače odkazů v modulu mod_login</strong>: Nové možnosti umožňují správcům skrýt odkazy „Zapomněli jste heslo?“ a „Zapomněli jste uživatelské jméno?“ bez nutnosti úpravy šablony (tzv. template override). Výchozím nastavením je zobrazení, takže stávající weby nejsou ovlivněny.</li><li><strong>Bezpečnostní příznak pro aktualizace rozšíření</strong>: Vývojáři mohou označit vydání jako bezpečnostní aktualizaci (se závažností od „Žádná“ po „Kritická“); takto označené aktualizace jsou zvýrazněny v sekci Systém -&gt; Aktualizace -&gt; Rozšíření a ikona rychlého přístupu na ovládacím panelu.</li></ul></div><div class=\"col-md-6 col-lg-5\"><img class=\"img-fluid d-block mx-auto\" src=\"media/com_guidedtours/images/6_2/security_warning.jpg\" alt=\"Bezpečnostní štítky u rozšíření\" width=\"488\" height=\"144\"></div></div>"
COM_GUIDEDTOURS_TOUR_WHATSNEW_6_2_TITLE="Co je nového v Joomla 6.2!"

