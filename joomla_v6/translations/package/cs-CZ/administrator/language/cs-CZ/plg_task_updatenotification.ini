PLG_TASK_UPDATENOTIFICATION="Úloha - Oznámení o aktualizaci Joomla!"
PLG_TASK_UPDATENOTIFICATION_END="Aktualizace oznámení konce"
PLG_TASK_UPDATENOTIFICATION_EMAIL_DESC="Seznam čárkou oddělených e-mailových adres, na které bude zasíláno upozornění o dostupnosti aktualizace Joomla! Adresy v seznamu musí patřit již existujícím uživatelům vašeho webu s oprávněním Super User. Pokud žádný z uvedených e-mailů nemá oprávnění Super User, nebo pokud je seznam ponechán prázdný, obdrží e-mailem s oznámení o aktualizaci všichni Super User uživatelé."
PLG_TASK_UPDATENOTIFICATION_EMAIL_LBL="Příjemci oznámení (Super User)"
PLG_TASK_UPDATENOTIFICATION_SEND_TITLE="Joomla: Oznámení o aktualizaci"
PLG_TASK_UPDATENOTIFICATION_SEND_DESC="Tento plugin pravidelně kontroluje dostupnost nových verzí Joomla! Pokud novou verzi zjistí, odešle upozorňující e-mailovou zprávu a připomene vám aktualizovat Joomla! Obsah e-mailové zprávy si můžete přizpůsobit v sekci <a href=\"index.php?option=com_mails&view=templates&filter[extension]=plg_task_updatenotification\">Šablony e-mailových zpráv</a>."
PLG_TASK_UPDATENOTIFICATION_LANGUAGE_OVERRIDE_DESC="Zvolte jazyk e-mailových upozornění na dostupnost aktualizace. Při nastavení 'Automaticky' bude použit výchozí jazyk webu."
PLG_TASK_UPDATENOTIFICATION_LANGUAGE_OVERRIDE_LBL="Jazyk e-mailu"
PLG_TASK_UPDATENOTIFICATION_LANGUAGE_OVERRIDE_NONE="Automaticky"
PLG_TASK_UPDATENOTIFICATION_EMAIL_BODY="Toto je automatické oznámení ze stránek:\n{SITENAME} - {URL}\n\n================================================================================\nINFORMACE O AKTUALIZACI\n================================================================================\n\nPro váš web je k dispozici nová verze systému Joomla!.\n\nAktuálně nainstalovaná verze: {CURVERSION}\nDostupná verze: {NEWVERSION}\n\n================================================================================\nPOKYNY K AKTUALIZACI\n================================================================================\n\nPro instalaci aktualizace otevřete následující odkaz:\n\n{LINK}\n\nInformace o vydání:\n{RELEASENEWS}\n\n================================================================================\nPROČ TENTO E-MAIL DOSTÁVÁM?\n================================================================================\n\nToto oznámení bylo automaticky vytvořeno pluginem 'Systém - Oznámení o aktualizaci Joomla!'.\n\nPlugin pravidelně kontroluje dostupnost nových verzí Joomla! a informuje správce webu o dostupných aktualizacích.\n\nDokud nebude aktualizace provedena nebo budou oznámení vypnuta, můžete dostávat další připomínky.\n\nChcete-li tato oznámení vypnout, zakažte plugin 'Systém - Oznámení o aktualizaci Joomla!' ve Spráci pluginů.\n\nPokud nejste osobou odpovědnou za správu tohoto webu, kontaktujte prosím jeho správce nebo provozovatele.\n\n================================================================================\nODESÍLATEL OZNÁMENÍ\n================================================================================\n\nToto oznámení bylo automaticky odesláno webem {SITENAME}.\n"
; You can use the following merge codes:
; {NEWVERSION}		New Joomla! version, e.g. 1.2.3
; {CURVERSION}		Currently installed Joomla! version, e.g. 1.2.0
; {SITENAME}		Site name, as set in Global Configuration.
; {URL}			URL of the site's frontend page.
; {LINK}		Update URL (link to com_joomlaupdate, will request login if the Super User isn't already logged in).
; {RELEASENEWS}		URL to the release news on joomla.org
; \n			Newline character. Use it to start a new line in the email.
PLG_TASK_UPDATENOTIFICATION_EMAIL_SUBJECT="🔔 Aktualizace Joomla! je dostupná pro {SITENAME} – {URL}"
