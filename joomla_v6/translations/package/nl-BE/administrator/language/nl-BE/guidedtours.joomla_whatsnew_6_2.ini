COM_GUIDEDTOURS_TOUR_WHATSNEW_6_2_DESCRIPTION="<h1 class=\"fw-medium\">Welkom bij Joomla 6.2!</h1><div class=\"row align-items-center pt-4\"><h2 class=\"mb-3\">Kernupdates</h2><div class=\"col-12 mb-3\"><h3>Verbeteringen bij het bewerken van inhoud</h3><ul><li><strong>Integratie van Mediabeheer en 'Lees meer'</strong>: Het toevoegen van afbeeldingen en media is eenvoudiger geworden dankzij de vernieuwde kiezer die nu het Joomla-mediabeheer opent; daarnaast biedt de nieuwe 'Lees meer'-knop een snellere manier om artikelonderbrekingen in te voegen.</li><li><strong>Aparte klassen voor afbeeldingen en figure-elementen</strong>: Afbeeldingen in de intro- of volledige tekst van artikelen hebben nu aparte CSS-klassevelden voor de afbeelding zelf en het omringende 'figure'-element.</li></ul></div></div><div class=\"row align-items-center pt-1\"><div class=\"col-md-6 col-lg-7 mb-4\"><img class=\"img-fluid d-block mx-auto\" src=\"media/com_guidedtours/images/6_2/sublevel_menu.jpg\" alt=\"Subniveau-menu's\" width=\"383\" height=\"280\"></div><div class=\"col-md-6 col-lg-5\"><h3>Front-end template (Cassiopeia)</h3><ul><li><strong>Dropdownmenu's met meerdere niveaus</strong>: Menu's in Cassiopeia ondersteunen nu meer dan één subniveau in dropdown- of inklapbare lay-outs.</li></ul></div></div><div class=\"row align-items-center pt-1\"><div class=\"col-md-6 col-lg-7 my-3\"><h3>Modules &amp; Siteconfiguratie</h3><ul class=\"mb-3\"><li><strong>Schakelaars voor mod_login-links</strong>: Met nieuwe opties kunnen beheerders de links "_QQ_"Wachtwoord vergeten?"_QQ_" en "_QQ_"Gebruikersnaam vergeten?"_QQ_" verbergen zonder een template-override. De standaardinstelling is 'Tonen', dus dit heeft geen gevolgen voor bestaande sites.</li><li><strong>Beveiligingsmarkering voor extensie-updates</strong>: Ontwikkelaars kunnen een release markeren als beveiligingsupdate (met een ernstniveau van 'Geen' tot 'Kritiek'); gemarkeerde updates worden uitgelicht in Systeem -&gt; Update -&gt; Extensies en het snelpictogram op het dashboard.</li></ul></div><div class=\"col-md-6 col-lg-5\"><img class=\"img-fluid d-block mx-auto\" src=\"media/com_guidedtours/images/6_2/security_warning.jpg\" alt=\"Beveiligingslabels bij extensies\" width=\"488\" height=\"144\"></div></div>"
COM_GUIDEDTOURS_TOUR_WHATSNEW_6_2_TITLE="Wat is er nieuw in Joomla 6.2!"

