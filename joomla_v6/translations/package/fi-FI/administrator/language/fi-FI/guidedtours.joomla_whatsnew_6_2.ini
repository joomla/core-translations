COM_GUIDEDTOURS_TOUR_WHATSNEW_6_2_DESCRIPTION="<h1 class=\"fw-medium\">Tervetuloa Joomla 6.2 käyttäjäksi!</h1><div class=\"row align-items-center pt-4\"><h2 class=\"mb-3\">Järjestelmäpäivitykset</h2><div class=\"col-12 mb-3\"><h3>Sisällönmuokkauksen päivitykset</h3><ul><li><strong>Media Manager/Read More -integraatiot</strong>: Kuvien ja median lisääminen on entistä helpompaa, sillä päivitetty valitsin avaa nyt Joomlan medianhallinnan. Uudella 'Lue lisää' -painikkeella puolestaan lisäät artikkelinjakajat entistä nopeammin.</li><li><strong>Erilliset CSS-luokkakentät kuvaa &lt;figure&gt;-elementtiä varten.</strong>: Artikkelin johdanto- ja kokotekstikuvilla on nyt erilliset CSS-luokkakentät kuvaa ja sitä ympäröivää <figure>-elementtiä varten.</li></ul></div></div><div class=\"row align-items-center pt-1\"><div class=\"col-md-6 col-lg-7 mb-4\"><img class=\"img-fluid d-block mx-auto\" src=\"media/com_guidedtours/images/6_2/sublevel_menu.jpg\" alt=\"Sublevel menus\" width=\"383\" height=\"280\"></div><div class=\"col-md-6 col-lg-5\"><h3>Julkisen sivuston sivupohja (Cassiopeia)</h3><ul><li><strong>Monitasoiset alasvetovalikot </strong>: Cassiopeia-valikot tukevat nyt useampaa kuin yhtä alatasoa alasveto- ja avattavissa näkymissä..</li></ul></div></div><div class=\"row align-items-center pt-1\"><div class=\"col-md-6 col-lg-7 my-3\"><h3>Moduulit &amp; Sivusto Configuration</h3><ul class=\"mb-3\"><li><strong>mod_login linkkiefektit</strong>: Uudet valinnat mahdollistavat 'Unohditko salasanasi?' ja 'Unohditko käyttäjätunnuksesi?' -linkkien piilottamisen ilman template override -muutoksia. Oletusarvo on 'Näytä', joten toiminnolla ei ole vaikutusta nykyisiin sivustoihin.</li><li><strong>Tietoturvamerkintä lisäosien päivityksille </strong>: Kehittäjät voivat asettaa julkaisulle tietoturvamerkinnän (vakavuus None–Critical). Merkityt päivitykset korostetaan valikossa Järjestelmä -&gt; Päivitys -&gt; Laajennukset ja työpöydän pikalinkissä..</li></ul></div><div class=\"col-md-6 col-lg-5\"><img class=\"img-fluid d-block mx-auto\" src=\"media/com_guidedtours/images/6_2/security_warning.jpg\" alt=\"Security tags on extensions\" width=\"488\" height=\"144\"></div></div>"
COM_GUIDEDTOURS_TOUR_WHATSNEW_6_2_TITLE="Mitä uutta Joomla-versiossa 6.2!"

