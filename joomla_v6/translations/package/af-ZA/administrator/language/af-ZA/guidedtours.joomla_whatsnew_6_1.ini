COM_GUIDEDTOURS_TOUR_WHATSNEW_6_1_DESCRIPTION="<h1 class=\"fw-medium\">Welkom by Joomla 6.1!</h1><p>Joomla 6.1 stel belangrike verbeterings bekend wat die bou van webwerwe makliker, veiliger en meer buigsaam maak. Hierdie toer gee jou die belangrikste inligting in 'n oogopslag.</p><div class=\"row align-items-center mb-4 pt-4 border-top border-1\"><div class=\"col-md-6 col-lg-7\"><h2 class=\"mb-3\">Strooiposbeskerming is TERUG met Bewys-van-Werk CAPTCHA</h2><p>Geen rekening of API word vereis nie, dit is privaatheidsvriendelik en toeganklik, en hierdie CAPTCHA los stilweg wiskundige raaisels in die agtergrond op, onsigbaar vir besoekers.</p><p>Om dit te aktiveer, gaan na <em>Uitbreidings</em> -&gt; <em>Inproppe</em>, soek vir <strong>captcha</strong>, aktiveer dit en stel dit as verstek in Globale Konfigurasie.</p></div><div class=\"col-md-6 col-lg-5 text-center text-md-start mb-3\"><img class=\"img-fluid\" src=\"media/com_guidedtours/images/6_1/captcha.jpg\" alt=\"Die captcha toon besig om te verifieer en geverifieer\" width=\"600\" height=\"250\"></div></div><div class=\"row align-items-center border-top border-1 pt-4\"><div class=\"col-md-6 col-lg-5 text-center text-md-start mb-3\"><img class=\"img-fluid\" src=\"media/com_guidedtours/images/6_1/workflows.jpg\" alt=\"Grafiese voorstelling van die basiese werkvloei\" width=\"600\" height=\"350\"></div><div class=\"col-md-6 col-lg-7 mb-3\"><h2 class=\"mb-3\">Inhoudspyplyn in 'n oogopslag met die Visuele Werkvloei-redigeerder</h2><p>Bestuur jou inhoudswerkvloei makliker met die nuwe interaktiewe werkvloeidiagram wat jou toelaat om die hele publikasieproses te sien.</p><p>Aktiveer Werkvloeie in <em>Artikelbestuurder</em> -&gt; <em>Werkvloeie</em> en soek die grafiekknoppie.</p></div></div><div class=\"row align-items-center border-top border-1 pt-4\"><div class=\"col-md-6 col-lg-7 mb-3\"><h2 class=\"mb-3\">Drie nuwe opsies vir pasgemaakte mediavelde: Oudio, Video &amp; Dokumente</h2><p>Wanneer jy Pasgemaakte Velde vir jou inhoud skep, kan jy inhoudskeppers nou toelaat om enige tipe media in te sluit, nie net beelde nie.</p><p>Die media word as HTML5 &lt;audio&gt;, &lt;video&gt;, of dokumentskakels (PDF, sigblaaie...) weergegee.</p></div><div class=\"col-md-6 col-lg-5 text-center text-md-start mb-3\"><img class=\"img-fluid\" src=\"media/com_guidedtours/images/6_1/media.jpg\" alt=\"Die drie mediaveld-opsies oudio, video en dokument\" width=\"600\" height=\"350\"></div></div><div class=\"row align-items-center border-top border-1 pt-4\"><div class=\"col-12 mb-3\"><h2 class=\"mb-3\">Slimmer modules met weergawebeheer en meertalige assosiasies</h2><p>Joomla het al lank weergawegeskiedenis vir artikels. Dieselfde vermoë word nou na modules uitgebrei.<br>As jy 'n meertalige webwerf bestuur, kan jy nou module-instansies oor verskillende tale heen assosieer, op dieselfde manier as wat jy artikels oor tale heen kan assosieer.</p><h2>Ander verbeterings wat die moeite werd is om op te let</h2><ul class=\"mb-3\"><li>Ondersteuning vir afkortings <strong>&lt;abbr&gt;</strong> in die TinyMCE-rykteksredigeerder, semanties korrek en met verbeterde toeganklikheid (soek die nuwe Afkorting-knoppie in die TinyMCE-nutsbalk wanneer inhoud gewysig word).</li><li>Status van taaloorskrywings &amp; UX-verbeterings vir die vinnige skep van ontbrekende oorskrywings (statusaanwyser, wysig oorskrywings maklik).</li></ul></div></div>"
COM_GUIDEDTOURS_TOUR_WHATSNEW_6_1_TITLE="Wat is nuut in Joomla 6.1!"

