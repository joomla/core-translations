COM_GUIDEDTOURS_TOUR_WHATSNEW_6_2_DESCRIPTION="<h1 class=\"fw-medium\">Welkom by Joomla 6.2!</h1><div class=\"row align-items-center pt-4\"><h2 class=\"mb-3\">Kernopdaterings</h2><div class=\"col-12 mb-3\"><h3>Verbeterings aan inhoudsredigering</h3><ul><li><strong>Mediabestuurder-/Lees Meer-integrasies</strong>: Die byvoeging van prente en media is nou makliker met die opgedateerde kieser wat die Joomla-mediabestuurder oopmaak, en die nuwe Lees Meer-knoppie bied 'n vinniger manier om artikelonderbrekings in te voeg.</li><li><strong>Afsonderlike prent- en figuurklasse</strong>: Artikelinleidings- en volteksprente het nou onafhanklike CSS-klasvelde vir die prent en die omliggende figuurelement.</li></ul></div></div><div class=\"row align-items-center pt-1\"><div class=\"col-md-6 col-lg-7 mb-4\"><img class=\"img-fluid d-block mx-auto\" src=\"media/com_guidedtours/images/6_2/sublevel_menu.jpg\" alt=\"Subvlakkieslyste\" width=\"383\" height=\"280\"></div><div class=\"col-md-6 col-lg-5\"><h3>Voorkantsjabloon (Cassiopeia)</h3><ul><li><strong>Meervlakkige aftrekkieslyste</strong>: Cassiopeia-kieslyste ondersteun nou meer as een subvlak in aftrek- en invoubare uitlegte.</li></ul></div></div><div class=\"row align-items-center pt-1\"><div class=\"col-md-6 col-lg-7 my-3\"><h3>Modules &amp; Werfkonfigurasie</h3><ul class=\"mb-3\"><li><strong>mod_login-skakelopsies</strong>: Nuwe opsies stel administrateurs in staat om die skakels "_QQ_"Jou wagwoord vergeet?"_QQ_" en "_QQ_"Jou gebruikersnaam vergeet?"_QQ_" te versteek sonder om 'n sjabloonoorheersing te gebruik. Die verstekinstelling is Wys, dus word bestaande webwerwe nie geraak nie.</li><li><strong>Sekuriteitsmerk vir uitbreidingsopdaterings</strong>: Ontwikkelaars kan 'n vrystelling as 'n sekuriteitsopdatering merk (met 'n ernsvlak van Geen tot Kritiek). Gemerkte opdaterings word uitgelig onder Stelsel -&gt; Opdatering -&gt; Uitbreidings en op die vinnige ikoon op die beheerpaneel.</li></ul></div><div class=\"col-md-6 col-lg-5\"><img class=\"img-fluid d-block mx-auto\" src=\"media/com_guidedtours/images/6_2/security_warning.jpg\" alt=\"Sekuriteitsmerke op uitbreidings\" width=\"488\" height=\"144\"></div></div>"
COM_GUIDEDTOURS_TOUR_WHATSNEW_6_2_TITLE="Wat is nuut in Joomla 6.2!"

