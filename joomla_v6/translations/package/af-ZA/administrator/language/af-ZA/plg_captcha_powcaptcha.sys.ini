PLG_CAPTCHA_POWCAPTCHA="CAPTCHA - Bewys van werk"
PLG_CAPTCHA_POWCAPTCHA_XML_DESCRIPTION="Hierdie CAPTCHA-inprop bied 'n wiskundige taak aan die gebruiker se blaaier wat die blaaier outomaties kan oplos. Dit is nie bedoel om te bewys dat die gebruiker 'n mens is nie, maar om te bewys dat die gebruiker bereid is om die nodige tyd te bestee om die taak op te los. Tans gebaseer op die Altcha (altcha.org)-biblioteek."

