COM_GUIDEDTOURS_TOUR_WHATSNEW_6_2_DESCRIPTION="<h1 class=\"fw-medium\">Bienvenue dans Joomla 6.2 !</h1><div class=\"row align-items-center pt-4\"><h2 class=\"mb-3\">Mises à jour du noyau</h2><div class=\"col-12 mb-3\"><h3>Améliorations apportées à l'édition de contenu</h3><ul><li><strong>Gestionnaire de médias / Intégrations de 'Lire la suite'</strong>&#160;: L'ajout d'images et de fichiers multimédias est désormais plus simple grâce au sélecteur qui est mis à jour, ouvrant désormais le gestionnaire de médias de Joomla, et le nouveau bouton « Lire la suite » permet d'insérer plus rapidement des sauts d'article.</li><li><strong>Différentiation des classes « image » et « figure »</strong>&#160;: Les images d'introduction et du corps de l'article disposent désormais de champs de classe CSS distincts pour l'image et l'élément `figure` qui l'entoure.</li></ul></div></div><div class=\"row align-items-center pt-1\"><div class=\"col-md-6 col-lg-7 mb-4\"><img class=\"img-fluid d-block mx-auto\" src=\"media/com_guidedtours/images/6_2/sublevel_menu.jpg\" alt=\"Sublevel menus\" width=\"383\" height=\"280\"></div><div class=\"col-md-6 col-lg-5\"><h3>Template frontal (Cassiopeia)</h3><ul><li><strong>Menus déroulants à plusieurs niveaux</strong>&#160;: Les menus Cassiopeia prennent désormais en charge plusieurs sous-niveaux dans les mises en page de type menu déroulant ou repliable.</li></ul></div></div><div class=\"row align-items-center pt-1\"><div class=\"col-md-6 col-lg-7 my-3\"><h3>Modules et Configuration du site</h3><ul class=\"mb-3\"><li><strong>mod_login activation/désactivation des liens</strong>: De nouvelles options permettent aux administrateurs de masquer les liens « Mot de passe oublié ? » et « Identifiant oublié ? » sans avoir à modifier le template. La valeur par défaut est « Afficher », ce qui n'a donc aucune incidence sur les sites existants.</li><li><strong>Indicateur de sécurité pour les mises à jour des extensions</strong>&#160;: Les développeurs peuvent marquer une version comme mise à jour de sécurité (niveau de gravité allant de « Aucun » à « Critique ») ; les mises à jour ainsi marquées sont mises en évidence dans Système -&gt; Mise à jour -&gt; Extensions et sur l'icône rapide du tableau de bord.</li></ul></div><div class=\"col-md-6 col-lg-5\"><img class=\"img-fluid d-block mx-auto\" src=\"media/com_guidedtours/images/6_2/security_warning.jpg\" alt=\"Étiquettes de sécurité sur les extensions\" width=\"488\" height=\"144\"></div></div>"
COM_GUIDEDTOURS_TOUR_WHATSNEW_6_2_TITLE="Les nouveautés de Joomla 6.2 !"

