COM_GUIDEDTOURS_TOUR_WHATSNEW_6_2_STEP_0_DESCRIPTION="<h3>Poznámky k úplnému vydaniu Joomla 6.2</h3><p><a title=\"Full release notes\" href=\"https://www.joomla.org/announcements.html\" target=\"_blank\" rel=\"noopener noreferrer\">Pozrite si poznámky k úplnému vydaniu na stránke joomla.org</a></p><hr><h3>Nápoveda a informácie</h3><p class=\"mb-3\">Mnoho zdrojov, ktoré vám pomôžu, nájdete tu spolu s ďalšími odkazmi na ďalšie zdroje, dokumentáciu, podporu a informácie o tom, ako sa zapojiť do systému Joomla.</p><p><img class=\"img-fluid d-block mx-auto\" src=\"media/com_guidedtours/images/6_2/help_index.jpg\" alt=\"New help index\" width=\"450\" height=\"275\"></p>"
