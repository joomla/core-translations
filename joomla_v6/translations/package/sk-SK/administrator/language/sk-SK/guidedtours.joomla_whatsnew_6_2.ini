COM_GUIDEDTOURS_TOUR_WHATSNEW_6_2_DESCRIPTION="<h1 class=\"fw-medium\">Vitajte v Joomle 6.2!</h1><div class=\"row align-items-center pt-4\"><h2 class=\"mb-3\">Aktualizácie jadra</h2><div class=\"col-12 mb-3\"><h3>Vylepšenia pri editácii obsahu</h3><ul><li><strong>Integrácia Správcu médií a funkcie Čítať ďalej</strong>: Pridávanie obrázkov a médií je teraz jednoduchšie vďaka aktualizovanému výberovému oknu, ktoré teraz otvára Správcu médií Joomla, a nové tlačidlo Čítaťďalej ponúka rýchlejší spôsob vkladania oddelení v článkoch. </li><li><strong>Oddelené triedy pre obrázky a figúry</strong>: Obrázky v úvode článku a v plnom texte majú teraz samostatné polia tried CSS pre obrázok a obklopujúci prvok figúry. </li></ul></div></div><div class=\"row align-items-center pt-1\"><div class=\"col-md-6 col-lg-7 mb-4\"><img class=\"img-fluid d-block mx-auto\" src=\"media/com_guidedtours/images/6_2/sublevel_menu.jpg\" alt=\"Sublevel menus\" width=\"383\" height=\"280\"></div><div class=\"col-md-6 col-lg-5\"><h3>Šablóna front-endu (Cassiopeia)</h3><ul><li><strong>Viacúrovňové rozbaľovacie ponuky</strong>: Ponuky v šablóne Cassiopeia teraz podporujú viac ako jednu podúroveň v rozbaľovacích/zbaliteľných rozloženiach. </li></ul></div></div><div class=\"row align-items-center pt-1\"><div class=\"col-md-6 col-lg-7 my-3\"><h3>Moduly a konfigurácia webu</h3><ul class=\"mb-3\"><li><strong>Prepínanie odkazov mod_login</strong>: Nové možnosti umožňujú správcom skryť odkazy Zabudli ste heslo? a Zabudli ste používateľské meno? bez nutnosti prepisovania šablóny. Predvolené nastavenie je Zobraziť, takže to nemá žiadny vplyv na existujúce stránky.</li><li><strong>Bezpečnostná vlajka pre aktualizácie rozšírení</strong>: Vývojári môžu označiť vydanie ako bezpečnostnú aktualizáciu (závažnosť od Žiadna po Kritická); označené aktualizácie sú zvýraznené v časti Systém –&gt; Aktualizácia –&gt; Rozšírenia a na rýchlej ikone na riadiacom paneli.</li></ul></div><div class=\"col-md-6 col-lg-5\"><img class=\"img-fluid d-block mx-auto\" src=\"media/com_guidedtours/images/6_2/security_warning.jpg\" alt=\"Security tags on extensions\" width=\"488\" height=\"144\"></div></div>"
COM_GUIDEDTOURS_TOUR_WHATSNEW_6_2_TITLE="Čo je nové v Joomla 6.2!"

