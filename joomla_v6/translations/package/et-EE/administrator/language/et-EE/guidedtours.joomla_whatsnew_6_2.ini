COM_GUIDEDTOURS_TOUR_WHATSNEW_6_2_DESCRIPTION="<h1 class=\"fw-medium\">Teretulemast Joomla versiooni 6.2!</h1><div class=\"row align-items-center pt-4\"><h2 class=\"mb-3\">Tuuma uuendused</h2><div class=\"col-12 mb-3\"><h3>Sisu muutmise uuendused</h3><ul><li><strong>Failihalduri ja Loe lisa integreerimine</strong>: Piltide ja multimeedia lisamine on muutunud veelgi lihtsamaks uuendatud failivalijaga, mis avab nüüd Joomla failihalduri ning Uus "_QQ_"Loe edasi"_QQ_" nupp pakub kiiremat võimalust artikili murdumiskohtade määramiseks.</li><li><strong>Eraldatud piltide ja kujundite klassid</strong>: Artikli sissejuhatuse ja täispika artikli piltidel on nüüd teineteisest sõltumatu CSS-i klassi väli piltide ja selle ümber olevate kujundite jaoks.</li></ul></div></div><div class=\"row align-items-center pt-1\"><div class=\"col-md-6 col-lg-7 mb-4\"><img class=\"img-fluid d-block mx-auto\" src=\"media/com_guidedtours/images/6_2/sublevel_menu.jpg\" alt=\"Sublevel menus\" width=\"383\" height=\"280\"></div><div class=\"col-md-6 col-lg-5\"><h3>Saidi kujundus (Cassiopeia)</h3><ul><li><strong>Mitmetasemelised rippmenüüd</strong>: Cassiopeia menüüd toetavad nüüd menüüdes rohkem kui ühte taset.</li></ul></div></div><div class=\"row align-items-center pt-1\"><div class=\"col-md-6 col-lg-7 my-3\"><h3>Moodulid &amp; Saidi seadistamine</h3><ul class=\"mb-3\"><li><strong>mod_login linkide lülitid</strong>: Uued valikud võimaldavad adminil peita lingid “Unustasin parooli” ja “Unustasin kasutajanime” ilma kujunduste ülekirjutusi kasutamata. Vaikimisi neid linke näidatakse, et olemasolevaid saite, mitte muuta.</li><li><strong>Lisaprogrammide uuenduste turvamärgistus</strong>: Arendajad saavad nüüd märkida oma kujundusi turvaväljalaskeks (kriitilisus pole kuni kriitiline); märgistusega uuendusi tõstetakse esile Süsteem -&gt; Uuenda -&gt; Lisaprogrammid ning ka avalehe kiirikoonides.</li></ul></div><div class=\"col-md-6 col-lg-5\"><img class=\"img-fluid d-block mx-auto\" src=\"media/com_guidedtours/images/6_2/security_warning.jpg\" alt=\"Security tags on extensions\" width=\"488\" height=\"144\"></div></div>"
COM_GUIDEDTOURS_TOUR_WHATSNEW_6_2_TITLE="Mida uut Joomla versioonis 6.2!"

