COM_GUIDEDTOURS_TOUR_WHATSNEW_6_1_DESCRIPTION="<h1 class=\"fw-medium\">Tere tulemast Joomlasse 6.1!</h1><p>Joomla 6.1 toob olulisi täiustusi, mis muudavad saidi ehitamise lihtsamaks, turvalisemaks ja paindlikumaks. See juhendatud tutvustus annab ülevaate kõige olulisemast.</p><div class=\"row align-items-center mb-4 pt-4 border-top border-1\"><div class=\"col-md-6 col-lg-7\"><h2 class=\"mb-3\">Rämpspostikaitse on TAGASI koos Proof-of-Work CAPTCHA-ga</h2><p>Kontot ega API-t pole vaja. See privaatsussõbralik ja ligipääsetavuse sõbralik captcha lahendab taustal vaikselt matemaatilisi ülesandeid ning jääb külastajatele nähtamatuks.</p><p>Lubamiseks ava <em>Lisaprogrammid</em> -&gt; <em>Pluginad</em>, otsi <strong>captcha</strong>, luba see ja määra üldseadetes vaikimisi valikuks.</p></div><div class=\"col-md-6 col-lg-5 text-center text-md-start mb-3\"><img class=\"img-fluid\" src=\"media/com_guidedtours/images/6_1/captcha.jpg\" alt=\"Captcha olekud: kontrollimine ja kontrollitud\" width=\"600\" height=\"250\"></div></div><div class=\"row align-items-center border-top border-1 pt-4\"><div class=\"col-md-6 col-lg-5 text-center text-md-start mb-3\"><img class=\"img-fluid\" src=\"media/com_guidedtours/images/6_1/workflows.jpg\" alt=\"Põhilise töövoo graafiline kujutis\" width=\"600\" height=\"350\"></div><div class=\"col-md-6 col-lg-7 mb-3\"><h2 class=\"mb-3\">Sisu liikumine ühe pilguga visuaalse töövooredaktoriga</h2><p>Halda oma sisu töövoogu lihtsamalt uue interaktiivse töövooskeemi abil, mis näitab kogu avaldamisprotsessi.</p><p>Luba töövood jaotises <em>Sisu</em> -&gt; <em>Töövood</em> ja otsi graafiku nuppu.</p></div></div><div class=\"row align-items-center border-top border-1 pt-4\"><div class=\"col-md-6 col-lg-7 mb-3\"><h2 class=\"mb-3\">Kolm uut meedia lisavälja valikut: heli, video ja dokumendid</h2><p>Sisu lisaväljade loomisel saad nüüd lubada sisuloojatel lisada igat tüüpi meediat, mitte ainult pilte.</p><p>Meedia kuvatakse HTML5 &lt;audio&gt;, &lt;video&gt; elementidena või dokumendilinkidena (PDF, arvutustabelid...).</p></div><div class=\"col-md-6 col-lg-5 text-center text-md-start mb-3\"><img class=\"img-fluid\" src=\"media/com_guidedtours/images/6_1/media.jpg\" alt=\"Kolm meediavälja valikut: heli, video ja dokument\" width=\"600\" height=\"350\"></div></div><div class=\"row align-items-center border-top border-1 pt-4\"><div class=\"col-12 mb-3\"><h2 class=\"mb-3\">Nutikamad moodulid versioonihalduse ja mitmekeelsete seostega</h2><p>Joomlas on artiklite versiooniajalugu olnud juba ammu. Sama võimalus laieneb nüüd ka moodulitele.<br>Kui haldad mitmekeelset veebisaiti, saad nüüd mooduleid eri keelte vahel seostada samamoodi nagu artikleid.</p><h2>Muud tähelepanu väärivad täiustused</h2><ul class=\"mb-3\"><li>Lühendi <strong>&lt;abbr&gt;</strong> tugi TinyMCE tekstiredaktoris – semantiliselt korrektne ja parandab ligipääsetavust (sisu muutmisel otsi TinyMCE tööriistaribalt uut lühendi nuppu).</li><li>Keeleülekirjutuste oleku ja puuduvate ülekirjutuste kiirloomise kasutajakogemuse täiustused (olekunäidik, ülekirjutuste lihtne muutmine).</li></ul></div></div>"
COM_GUIDEDTOURS_TOUR_WHATSNEW_6_1_TITLE="Mida uut Joomla versioonis 6.1!"

