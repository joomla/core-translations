COM_GUIDEDTOURS_TOUR_WHATSNEW_6_2_STEP_0_DESCRIPTION="<h3>Πλήρεις σημειώσεις έκδοσης του Joomla 6.2</h3><p><a title=\"Πλήρεις σημειώσεις έκδοσης\" href=\"https://www.joomla.org/announcements.html\" target=\"_blank\" rel=\"noopener noreferrer\">Δείτε τις πλήρεις σημειώσεις έκδοσης στο joomla.org</a></p><hr><h3>Βοήθεια και πληροφορίες</h3><p class=\"mb-3\">Εδώ μπορείτε να βρείτε πολλούς πόρους που θα σας βοηθήσουν, μαζί με πρόσθετους συνδέσμους για περισσότερους πόρους, τεκμηρίωση, υποστήριξη και πληροφορίες για το πώς να συμμετάσχετε ενεργά στο Joomla.</p><p><img class=\"img-fluid d-block mx-auto\" src=\"media/com_guidedtours/images/6_2/help_index.jpg\" alt=\"Νέο ευρετήριο βοήθειας\" width=\"450\" height=\"275\"></p>"
