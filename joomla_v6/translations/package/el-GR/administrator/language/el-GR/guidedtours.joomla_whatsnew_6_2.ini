COM_GUIDEDTOURS_TOUR_WHATSNEW_6_2_DESCRIPTION="<h1 class=\"fw-medium\">Καλώς ήρθατε στο Joomla 6.2!</h1><div class=\"row align-items-center pt-4\"><h2 class=\"mb-3\">Ενημερώσεις πυρήνα</h2><div class=\"col-12 mb-3\"><h3>Αναβαθμίσεις επεξεργασίας περιεχομένου</h3><ul><li><strong>Ενσωματώσεις Διαχείρισης πολυμέσων/"_QQ_"Διαβάστε περισσότερα"_QQ_"</strong>: Η προσθήκη εικόνων και πολυμέσων έχει γίνει ευκολότερη με τον ενημερωμένο επιλογέα που πλέον ανοίγει τη Διαχείριση πολυμέσων του Joomla, και το νέο κουμπί "_QQ_"Διαβάστε περισσότερα"_QQ_" παρέχει έναν πιο γρήγορο τρόπο για την εισαγωγή διαχωριστικών άρθρου.</li><li><strong>Ξεχωριστές κλάσεις εικόνας και σχήματος</strong>: Οι εικόνες εισαγωγής/πλήρους κειμένου των άρθρων διαθέτουν πλέον ανεξάρτητα πεδία κλάσεων CSS για την εικόνα και το περιβάλλον στοιχείο σχήματός της.</li></ul></div></div><div class=\"row align-items-center pt-1\"><div class=\"col-md-6 col-lg-7 mb-4\"><img class=\"img-fluid d-block mx-auto\" src=\"media/com_guidedtours/images/6_2/sublevel_menu.jpg\" alt=\"Μενού υποεπιπέδων\" width=\"383\" height=\"280\"></div><div class=\"col-md-6 col-lg-5\"><h3>Πρότυπο Front-End (Cassiopeia)</h3><ul><li><strong>Αναπτυσσόμενα μενού πολλών επιπέδων</strong>: Τα μενού του Cassiopeia πλέον υποστηρίζουν περισσότερα από ένα υποεπίπεδα σε αναπτυσσόμενες/πτυσσόμενες διατάξεις.</li></ul></div></div><div class=\"row align-items-center pt-1\"><div class=\"col-md-6 col-lg-7 my-3\"><h3>Ενότητες &amp; Ρύθμιση ιστοτόπου</h3><ul class=\"mb-3\"><li><strong>Εναλλαγές συνδέσμων mod_login</strong>: Νέες επιλογές επιτρέπουν στους διαχειριστές να αποκρύπτουν τους συνδέσμους «Ξεχάσατε τον κωδικό πρόσβασής σας;» και «Ξεχάσατε το όνομα χρήστη;» χωρίς παράκαμψη προτύπου. Η προεπιλογή είναι "_QQ_"Εμφάνιση"_QQ_", συνεπώς δεν υπάρχει καμία επίπτωση στους υπάρχοντες ιστότοπους.</li><li><strong>Επισήμανση ασφαλείας για ενημερώσεις επεκτάσεων</strong>: Οι προγραμματιστές μπορούν να επισημάνουν μια κυκλοφορία ως ενημέρωση ασφαλείας (σοβαρότητα από Καμία έως Κρίσιμη)· οι επισημασμένες ενημερώσεις τονίζονται στο Σύστημα -&gt; Ενημέρωση -&gt; Επεκτάσεις και στο εικονίδιο γρήγορης πρόσβασης του πίνακα ελέγχου.</li></ul></div><div class=\"col-md-6 col-lg-5\"><img class=\"img-fluid d-block mx-auto\" src=\"media/com_guidedtours/images/6_2/security_warning.jpg\" alt=\"Ετικέτες ασφαλείας σε επεκτάσεις\" width=\"488\" height=\"144\"></div></div>"
COM_GUIDEDTOURS_TOUR_WHATSNEW_6_2_TITLE="Τι νέο υπάρχει στο Joomla 6.2!"

