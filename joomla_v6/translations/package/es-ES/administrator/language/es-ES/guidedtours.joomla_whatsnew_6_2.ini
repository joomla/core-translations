COM_GUIDEDTOURS_TOUR_WHATSNEW_6_2_DESCRIPTION="<h1 class=\"fw-medium\">¡Bienvenido a Joomla 6.2!</h1><div class=\"row align-items-center pt-4\"><h2 class=\"mb-3\">Novedades del core</h2><div class=\"col-12 mb-3\"><h3>Mejoras en la edición de contenidos</h3><ul><li><strong>Integraciones del gestor multimedia/leer más</strong>: Añadir imágenes y medios es ahora más fácil con el selector actualizado que ahora abre el gestor multimedia de Joomla, y el nuevo botón «leer más» proporciona una forma más rápida de insertar textos de introducción en los artículos.</li><li><strong>Separación de las clases de image y figure</strong>: Las imágenes de intro/texto completo de los artículos ahora tienen campos independientes para las clases CSS de la imagen y el elemento «figure» que la contiene.</li></ul></div></div><div class=\"row align-items-center pt-1\"><div class=\"col-md-6 col-lg-7 mb-4\"><img class=\"img-fluid d-block mx-auto\" src=\"media/com_guidedtours/images/6_2/sublevel_menu.jpg\" alt=\"Menús con subniveles\" width=\"383\" height=\"280\"></div><div class=\"col-md-6 col-lg-5\"><h3>Plantilla del Front-End (Cassiopeia)</h3><ul><li><strong>Menús desplegables multinivel</strong>: Los menús de Cassiopeia ahora permiten más de un subnivel en los diseños desplegables/colapsables.</li></ul></div></div><div class=\"row align-items-center pt-1\"><div class=\"col-md-6 col-lg-7 my-3\"><h3>Módulos y configuración del sitio</h3><ul class=\"mb-3\"><li><strong>Selectores de enlaces de mod_login</strong>: Nuevas opciones permiten a los administradores esconder los enlaces «¿Olvidó su contraseña?» y «¿Olvidó su nombre de usuario?» sin necesidad de un override. Por defecto están configurados en «mostrar», de modo que este cambio no impacta en sitios existentes.</li><li><strong>Indicador de seguridad para actualizaciones de extensiones</strong>: Los desarrolladores pueden marcar una nueva versión como «versión de seguridad» (con gravedad desde «Ninguna» hasta «Crítica»); las actualizaciones marcadas son resaltadas en Sistema -&gt; Actualización -&gt; Extensiones y en el icono rápido del panel de control.</li></ul></div><div class=\"col-md-6 col-lg-5\"><img class=\"img-fluid d-block mx-auto\" src=\"media/com_guidedtours/images/6_2/security_warning.jpg\" alt=\"Etiquetas de seguridad en extensiones\" width=\"488\" height=\"144\"></div></div>"
COM_GUIDEDTOURS_TOUR_WHATSNEW_6_2_TITLE="¡Novedades en Joomla 6.2!"

