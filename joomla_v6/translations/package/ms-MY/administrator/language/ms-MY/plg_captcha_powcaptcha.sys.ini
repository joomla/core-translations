PLG_CAPTCHA_POWCAPTCHA="CAPTCHA - Proof-of-Work"
PLG_CAPTCHA_POWCAPTCHA_XML_DESCRIPTION="Pemalam CAPTCHA ini memberikan tugasan matematik kepada pelayar pengguna yang boleh diselesaikan secara automatik oleh pelayar. Ia bukan bertujuan membuktikan bahawa pengguna ialah manusia, tetapi membuktikan bahawa pengguna sanggup meluangkan masa yang diperlukan untuk menyelesaikan tugasan. Kini berasaskan pustaka Altcha (altcha.org)."
