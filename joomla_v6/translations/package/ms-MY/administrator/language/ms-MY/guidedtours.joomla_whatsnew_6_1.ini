COM_GUIDEDTOURS_TOUR_WHATSNEW_6_1_DESCRIPTION="<h1 class=\"fw-medium\">Selamat datang ke Joomla 6.1!</h1><p>Joomla 6.1 memperkenalkan penambahbaikan penting yang menjadikan pembinaan laman lebih mudah, selamat dan fleksibel. Lawatan ini memberikan perkara asas secara ringkas.</p><div class=\"row align-items-center mb-4 pt-4 border-top border-1\"><div class=\"col-md-6 col-lg-7\"><h2 class=\"mb-3\">Perlindungan Spam KEMBALI dengan CAPTCHA Proof-of-Work</h2><p>Tiada akaun atau API diperlukan, mesra privasi dan boleh diakses. CAPTCHA ini menyelesaikan teka-teki matematik secara senyap di latar belakang, tanpa dilihat oleh pelawat.</p><p>Untuk mendayakannya, pergi ke <em>Sambungan</em> -&gt; <em>Pemalam</em>, cari <strong>captcha</strong>, dayakan dan tetapkan sebagai lalai dalam Konfigurasi Global.</p></div><div class=\"col-md-6 col-lg-5 text-center text-md-start mb-3\"><img class=\"img-fluid shadow\" src=\"media/com_guidedtours/images/6_1/captcha.jpg\" alt=\"Keadaan captcha sedang mengesahkan dan telah disahkan\" width=\"600\" height=\"250\"></div></div><div class=\"row align-items-center border-top border-1 pt-4\"><div class=\"col-md-6 col-lg-5 text-center text-md-start mb-3\"><img class=\"img-fluid shadow\" src=\"media/com_guidedtours/images/6_1/workflows.jpg\" alt=\"Perwakilan grafik aliran kerja asas\" width=\"600\" height=\"350\"></div><div class=\"col-md-6 col-lg-7 mb-3\"><h2 class=\"mb-3\">Saluran Kandungan Sepintas Lalu dengan Penyunting Aliran Kerja Visual</h2><p>Urus aliran kerja kandungan anda dengan lebih mudah menggunakan gambar rajah aliran kerja interaktif baharu yang membolehkan anda melihat keseluruhan proses penerbitan.</p><p>Dayakan Aliran Kerja dalam <em>Pengurus Artikel</em> -&gt; <em>Aliran Kerja</em> dan cari butang graf.</p></div></div><div class=\"row align-items-center border-top border-1 pt-4\"><div class=\"col-md-6 col-lg-7 mb-3\"><h2 class=\"mb-3\">Tiga Pilihan Medan Media Tersuai Baharu: Audio, Video dan Dokumen</h2><p>Semasa mencipta Medan Tersuai untuk kandungan anda, kini anda boleh membenarkan pencipta kandungan menyertakan apa-apa jenis media, bukan imej sahaja.</p><p>Media tersebut dipaparkan sebagai &lt;audio&gt;, &lt;video&gt; HTML5 atau pautan dokumen (PDF, hamparan...).</p></div><div class=\"col-md-6 col-lg-5 text-center text-md-start mb-3\"><img class=\"img-fluid shadow\" src=\"media/com_guidedtours/images/6_1/media.jpg\" alt=\"Tiga pilihan medan media audio, video dan dokumen\" width=\"600\" height=\"350\"></div></div><div class=\"row align-items-center border-top border-1 pt-4\"><div class=\"col-12 mb-3\"><h2 class=\"mb-3\">Modul Lebih Pintar dengan Versi dan Persatuan Berbilang Bahasa</h2><p>Joomla telah lama mempunyai sejarah versi untuk artikel. Keupayaan yang sama kini diperluas kepada modul.<br>Jika anda mengendalikan laman berbilang bahasa, kini anda boleh mengaitkan contoh modul dalam bahasa yang berbeza, sama seperti mengaitkan artikel merentas bahasa.</p><h2>Penambahbaikan Lain yang Perlu Diketahui</h2><ul class=\"mb-3\"><li>Sokongan singkatan <strong>&lt;abbr&gt;</strong> dalam penyunting teks kaya TinyMCE, yang betul dari segi semantik dan meningkatkan kebolehcapaian (cari butang Singkatan baharu dalam bar alat TinyMCE semasa menyunting kandungan).</li><li>Penambahbaikan pengalaman pengguna bagi status pengatasan bahasa dan penciptaan pantas pengatasan yang hilang (penunjuk status, sunting pengatasan dengan mudah).</li></ul></div></div>"
COM_GUIDEDTOURS_TOUR_WHATSNEW_6_1_TITLE="Apa yang Baharu dalam Joomla 6.1!"
