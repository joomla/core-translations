COM_GUIDEDTOURS_TOUR_WHATSNEW_6_2_DESCRIPTION="<h1 class=\"fw-medium\">კეთილი იყოს თქვენი მობრძანება Joomla 6.2!</h1><div class=\"row align-items-center pt-4\"><h2 class=\"mb-3\">ძირითადი განახლებები</h2><div class=\"col-12 mb-3\"><h3>კონტენტის რედაქტირების გაუმჯობესებები</h3><ul><li><strong>მედია მენეჯერი/'ვრცლად' ფუნქციის  ინტეგრაციები</strong>: სურათებისა და მედიამასალების დამატება უფრო გამარტივდა განახლებული არჩევის ხელსაწყოს (picker) წყალობით, რომელიც ახლა ხსნის Joomla! მედია მენეჯერს, ხოლო ახალი ღილაკი 'ვრცლად' სტატიაში წყვეტის ჩასმის უფრო სწრაფ საშუალებას იძლევა.</li><li><strong>სურათისა და ფიგურის კლასების გამიჯვნა</strong>: სტატიის შესავლის/სრული ტექსტის სურათებს ახლა აქვთ დამოუკიდებელი CSS-კლასების ველები - როგორც სურათისთვის, ისე მისი მომცველი figure ელემენტისთვის.</li></ul></div></div><div class=\"row align-items-center pt-1\"><div class=\"col-md-6 col-lg-7 mb-4\"><img class=\"img-fluid d-block mx-auto\" src=\"media/com_guidedtours/images/6_2/sublevel_menu.jpg\" alt=\"Sublevel menus\" width=\"383\" height=\"280\"></div><div class=\"col-md-6 col-lg-5\"><h3>ფრონტ-ენდის თარგი (Cassiopeia)</h3><ul><li><strong>მრავალდონიანი ჩამოსაშლელი მენიუები</strong>: Cassiopeia-ს მენიუები ახლა მხარს უჭერენ ერთზე მეტ ქვედონეს ჩამოსაშლელ/კეცვად განლაგებებში.</li></ul></div></div><div class=\"row align-items-center pt-1\"><div class=\"col-md-6 col-lg-7 my-3\"><h3>მოდულები და საიტის კონფიგურაცია</h3><ul class=\"mb-3\"><li><strong>mod_login-ის ბმულის გადამრთველები</strong>: ახალი პარამეტრები ადმინისტრატორებს საშუალებას აძლევს დამალონ “პაროლი დაგავიწყდათ?” და “სახელი დაგავიწყდათ?” ბმულები თარგის ჩანაცვლების (override) გარეშე. ავტომატურად არჩეულია 'ჩვენება'), ამიტომ არსებულ საიტებზე გავლენას არ ახდენს.</li><li><strong>უსაფრთხოების დროშა (flag) გაფართოებების განახლებებისთვის</strong>: დეველოპერებს შეუძლიათ მონიშნონ გამოშვება როგორც უსაფრთხოების განახლება (სიმძიმე — არცერთიდან კრიტიკულამდე); მონიშნული განახლებები გამოყოფილია განყოფილებაში 'სისტემა -> განახლება -> გაფართოებები', ასევე — მართვის პანელზე არსებულ სწრაფი წვდომის ხატულაზე.</li></ul></div><div class=\"col-md-6 col-lg-5\"><img class=\"img-fluid d-block mx-auto\" src=\"media/com_guidedtours/images/6_2/security_warning.jpg\" alt=\"Security tags on extensions\" width=\"488\" height=\"144\"></div></div>"
COM_GUIDEDTOURS_TOUR_WHATSNEW_6_2_TITLE="რა არის ახალი Joomla 6.2!"

