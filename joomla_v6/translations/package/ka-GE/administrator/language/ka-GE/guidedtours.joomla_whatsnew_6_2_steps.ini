COM_GUIDEDTOURS_TOUR_WHATSNEW_6_2_STEP_0_DESCRIPTION="<h3>Joomla 6.2 სრული გამოშვების შენიშვნები</h3><p><a title=\"სრული გამოშვების შენიშვნები\" href=\"https://www.joomla.org/announcements.html\" target=\"_blank\" rel=\"noopener noreferrer\">იხილეთ სრული გამოშვების შენიშვნები joomla.org</a></p><hr><h3>დახმარება და ინფორმაცია</h3><p class=\"mb-3\">ბევრი რესურსი, რომელიც დაგეხმარებათ, შეგიძლიათ იხილოთ აქ, დამატებით ბმულებთან ერთად მეტი რესურსების, დოკუმენტაციის, მხარდაჭერისა და როგორ ჩაერთოთ Joomla!-ში.</p><p><img class=\"img-fluid d-block mx-auto\" src=\"media/com_guidedtours/images/6_2/help_index.jpg\" alt=\"New help index\" width=\"450\" height=\"275\"></p>"
