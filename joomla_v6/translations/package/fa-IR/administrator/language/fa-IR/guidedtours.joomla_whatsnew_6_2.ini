COM_GUIDEDTOURS_TOUR_WHATSNEW_6_2_DESCRIPTION="<h1 class=\"fw-medium\">به جوملا 6.2 خوش آمدید!</h1><div class=\"row align-items-center pt-4\"><h2 class=\"mb-3\">به‌روزرسانی‌های هسته</h2><div class=\"col-12 mb-3\"><h3>ارتقاهای ویرایش محتوا</h3><ul><li><strong>یکپارچه‌سازی مدیر رسانه/بیشتر بخوانید Read More</strong>: افزودن تصاویر و رسانه با انتخاب‌گر به‌روزشده که اکنون مدیر رسانه جوملا را باز می‌کند آسان‌تر شده است، و دکمه جدید بیشتر بخوانید Read More راهی سریع‌تر برای درج شکست مقاله article breaks فراهم می‌کند.</li><li><strong>کلاس‌های مجزای تصویر و figure</strong>: تصاویر مقدمه/متن کامل مقاله اکنون دارای فیلدهای کلاس CSS مستقل برای تصویر و عنصر figure اطراف آن هستند.</li></ul></div></div><div class=\"row align-items-center pt-1\"><div class=\"col-md-6 col-lg-7 mb-4\"><img class=\"img-fluid d-block mx-auto\" src=\"media/com_guidedtours/images/6_2/sublevel_menu.jpg\" alt=\"Sublevel menus\" width=\"383\" height=\"280\"></div><div class=\"col-md-6 col-lg-5\"><h3>قالب بخش کاربری (Cassiopeia)</h3><ul><li><strong>منوهای کشویی چندسطحی</strong>: منوهای Cassiopeia اکنون از بیش از یک زیرسطح در چیدمان‌های کشویی/جمع‌شونده پشتیبانی می‌کنند.</li></ul></div></div><div class=\"row align-items-center pt-1\"><div class=\"col-md-6 col-lg-7 my-3\"><h3>ماژول‌ها &amp; پیکربندی سایت</h3><ul class=\"mb-3\"><li><strong>کلیدهای پیوند mod_login</strong>: گزینه‌های جدید به مدیران اجازه می‌دهد پیوندهای “رمز عبور خود را فراموش کرده‌اید؟“ و “نام کاربری خود را فراموش کرده‌اید؟“ را بدون بازنویسی قالب پنهان کنند. پیش‌فرض روی نمایش است، بنابراین تأثیری بر سایت‌های موجود ندارد.</li><li><strong>نشانگر امنیتی برای به‌روزرسانی‌های افزونه</strong>: توسعه‌دهندگان می‌توانند یک انتشار را به عنوان به‌روزرسانی امنیتی علامت‌گذاری کنند (شدت از هیچ تا بحرانی)؛ به‌روزرسانی‌های علامت‌گذاری‌شده در سیستم -&gt; به‌روزرسانی -&gt; افزونه‌ها و روی نماد سریع داشبورد برجسته می‌شوند.</li></ul></div><div class=\"col-md-6 col-lg-5\"><img class=\"img-fluid d-block mx-auto\" src=\"media/com_guidedtours/images/6_2/security_warning.jpg\" alt=\"Security tags on extensions\" width=\"488\" height=\"144\"></div></div>"
COM_GUIDEDTOURS_TOUR_WHATSNEW_6_2_TITLE="ویژگی‌های جدید در جوملا 6.2!"

