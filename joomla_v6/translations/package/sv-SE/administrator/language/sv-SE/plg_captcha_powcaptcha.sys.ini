PLG_CAPTCHA_POWCAPTCHA="CAPTCHA - Beräkningsbevis"
PLG_CAPTCHA_POWCAPTCHA_XML_DESCRIPTION="Denna CAPTCHA-plugin ger användarens webbläsare en matematisk uppgift som webbläsaren kan lösa automatiskt. Syftet är inte att bevisa att användaren är en människa, utan att användaren är villig att lägga den tid som krävs för att lösa uppgiften. Bygger för närvarande på biblioteket Altcha (altcha.org)."

