COM_GUIDEDTOURS_TOUR_WHATSNEW_6_2_DESCRIPTION="<h1 class=\"fw-medium\">Välkommen till Joomla 6.2!</h1><div class=\"row align-items-center pt-4\"><h2 class=\"mb-3\">Uppdateringar av kärnan</h2><div class=\"col-12 mb-3\"><h3>Förbättrad innehållsredigering</h3><ul><li><strong>Integration med mediahanteraren och Läs mer</strong>: Det har blivit enklare att lägga till bilder och media med den uppdaterade väljaren som nu öppnar Joomlas mediahanterare. Den nya knappen Läs mer gör det snabbare att infoga en brytning mellan artikelns introtext och fulltext.</li><li><strong>Separata klasser för bilder och figure-element</strong>: Artikelns intro- och fulltextbilder har nu separata fält för CSS-klasser för bilden och det omgivande figure-elementet.</li></ul></div></div><div class=\"row align-items-center pt-1\"><div class=\"col-md-6 col-lg-7 mb-4\"><img class=\"img-fluid d-block mx-auto\" src=\"media/com_guidedtours/images/6_2/sublevel_menu.jpg\" alt=\"Undermenyer\" width=\"383\" height=\"280\"></div><div class=\"col-md-6 col-lg-5\"><h3>Webbplatsmall (Cassiopeia)</h3><ul><li><strong>Rullgardinsmenyer med flera nivåer</strong>: Menyer i Cassiopeia stöder nu flera undernivåer i rullgardinsmenyer och hopfällbara menyer.</li></ul></div></div><div class=\"row align-items-center pt-1\"><div class=\"col-md-6 col-lg-7 my-3\"><h3>Moduler &amp; webbplatsinställningar</h3><ul class=\"mb-3\"><li><strong>Visa eller dölj länkar i mod_login</strong>: Nya alternativ låter administratörer dölja länkarna ”Glömt ditt lösenord?” och ”Glömt ditt användarnamn?” utan en mallersättning. Standardvärdet är Visa, så befintliga webbplatser påverkas inte.</li><li><strong>Säkerhetsmarkering för tilläggsuppdateringar</strong>: Utvecklare kan markera en utgåva som en säkerhetsuppdatering (allvarlighetsgrad Ingen till Kritisk). Markerade uppdateringar framhävs under System -&gt; Uppdatera -&gt; Tillägg och på kontrollpanelens snabbikon.</li></ul></div><div class=\"col-md-6 col-lg-5\"><img class=\"img-fluid d-block mx-auto\" src=\"media/com_guidedtours/images/6_2/security_warning.jpg\" alt=\"Säkerhetsmarkeringar på tillägg\" width=\"488\" height=\"144\"></div></div>"
COM_GUIDEDTOURS_TOUR_WHATSNEW_6_2_TITLE="Nyheter i Joomla 6.2!"

