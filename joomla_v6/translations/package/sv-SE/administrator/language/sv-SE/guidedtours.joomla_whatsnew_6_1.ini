COM_GUIDEDTOURS_TOUR_WHATSNEW_6_1_DESCRIPTION="<h1 class=\"fw-medium\">Välkommen till Joomla 6.1!</h1><p>Joomla 6.1 innehåller viktiga förbättringar som gör det enklare, säkrare och mer flexibelt att bygga webbplatser. Den här rundturen ger dig en snabb överblick.</p><div class=\"row align-items-center mb-4 pt-4 border-top border-1\"><div class=\"col-md-6 col-lg-7\"><h2 class=\"mb-3\">Spamskyddet är tillbaka med CAPTCHA baserad på beräkningsbevis</h2><p>Denna integritetsvänliga och tillgängliga CAPTCHA kräver varken konto eller API. Webbläsaren löser matematiska uppgifter i bakgrunden utan att besökarna märker det.</p><p>Aktivera funktionen genom att gå till <em>Tillägg</em> -&gt; <em>Pluginer</em>, söka efter <strong>captcha</strong>, aktivera pluginen och ange den som standard i Globala inställningar.</p></div><div class=\"col-md-6 col-lg-5 text-center text-md-start mb-3\"><img class=\"img-fluid\" src=\"media/com_guidedtours/images/6_1/captcha.jpg\" alt=\"CAPTCHA-statusarna Verifierar och Verifierad\" width=\"600\" height=\"250\"></div></div><div class=\"row align-items-center border-top border-1 pt-4\"><div class=\"col-md-6 col-lg-5 text-center text-md-start mb-3\"><img class=\"img-fluid\" src=\"media/com_guidedtours/images/6_1/workflows.jpg\" alt=\"Grafisk vy över det grundläggande arbetsflödet\" width=\"600\" height=\"350\"></div><div class=\"col-md-6 col-lg-7 mb-3\"><h2 class=\"mb-3\">Överblick över publiceringen med den visuella arbetsflödesredigeraren</h2><p>Hantera arbetsflödet för ditt innehåll enklare med det nya interaktiva diagrammet som visar hela publiceringsprocessen.</p><p>Aktivera arbetsflöden under <em>Artikelhanteraren</em> -&gt; <em>Arbetsflöden</em> och leta efter diagramknappen.</p></div></div><div class=\"row align-items-center border-top border-1 pt-4\"><div class=\"col-md-6 col-lg-7 mb-3\"><h2 class=\"mb-3\">Tre nya alternativ för egna mediefält: ljud, video &amp; dokument</h2><p>När du skapar egna fält för ditt innehåll kan du nu låta innehållsskapare lägga till alla typer av media, inte bara bilder.</p><p>Media visas som HTML5-elementen &lt;audio&gt; och &lt;video&gt; eller som dokumentlänkar (PDF, kalkylblad med mera).</p></div><div class=\"col-md-6 col-lg-5 text-center text-md-start mb-3\"><img class=\"img-fluid\" src=\"media/com_guidedtours/images/6_1/media.jpg\" alt=\"De tre mediefältsalternativen ljud, video och dokument\" width=\"600\" height=\"350\"></div></div><div class=\"row align-items-center border-top border-1 pt-4\"><div class=\"col-12 mb-3\"><h2 class=\"mb-3\">Smartare moduler med versionshantering och språkkopplingar</h2><p>Joomla har länge haft versionshistorik för artiklar. Nu finns samma möjlighet även för moduler.<br>Om du driver en flerspråkig webbplats kan du nu koppla samman moduler på olika språk, på samma sätt som artiklar.</p><h2>Fler förbättringar</h2><ul class=\"mb-3\"><li>Stöd för förkortningar med <strong>&lt;abbr&gt;</strong> i textredigeraren TinyMCE ger semantiskt korrekt innehåll och förbättrad tillgänglighet. (Leta efter den nya knappen Förkortning i verktygsfältet när du redigerar innehåll.)</li><li>Förbättrad hantering av språkersättningar (statusindikator &amp; möjlighet att snabbt skapa saknade ersättningar och enkelt redigera befintliga).</li></ul></div></div>"
COM_GUIDEDTOURS_TOUR_WHATSNEW_6_1_TITLE="Nyheter i Joomla 6.1!"

