COM_GUIDEDTOURS_TOUR_WHATSNEW_6_2_TITLE="Що нового в Joomla 6.2!"


[Not in reference]

COM_GUIDEDTOURS_TOUR_WHATSNEW_6_2_DESCRIPTION="<h1 class=\"fw-medium\">Вітаємо у Joomla 6.2!</h1><div class=\"row align-items-center pt-4\"><h2 class=\"mb-3\">Оновлення ядра</h2><div class=\"col-12 mb-3\"><h3>Покращення редагування матеріалів</h3><ul><li><strong>Інтеграція медіаменеджера та роздільника «Докладніше»</strong>: додавати зображення й медіафайли стало простіше завдяки оновленому вибору, який відкриває медіаменеджер Joomla. Нова кнопка «Докладніше» дає змогу швидше вставляти роздільники матеріалу.</li><li><strong>Окремі класи зображення та елемента figure</strong>: для зображень вступного та повного тексту матеріалу тепер можна окремо задати класи CSS для самого зображення та навколишнього елемента figure.</li></ul></div></div><div class=\"row align-items-center pt-1\"><div class=\"col-md-6 col-lg-7 mb-4\"><img class=\"img-fluid d-block mx-auto\" src=\"media/com_guidedtours/images/6_2/sublevel_menu.jpg\" alt=\"Меню з підрівнями\" width=\"383\" height=\"280\"></div><div class=\"col-md-6 col-lg-5\"><h3>Шаблон сайту (Cassiopeia)</h3><ul><li><strong>Багаторівневі спадні меню</strong>: меню Cassiopeia тепер підтримують кілька підрівнів у спадних і розгортних макетах.</li></ul></div></div><div class=\"row align-items-center pt-1\"><div class=\"col-md-6 col-lg-7 my-3\"><h3>Модулі та налаштування сайту</h3><ul class=\"mb-3\"><li><strong>Перемикачі посилань у mod_login</strong>: нові параметри дають змогу приховати посилання «Забули пароль?» і «Забули ім’я користувача?» без перевизначення шаблону. За замовчуванням посилання показуються, тому наявні сайти не зміняться.</li><li><strong>Позначка безпеки для оновлень розширень</strong>: розробники можуть позначити випуск як оновлення безпеки (рівень від «Відсутній» до «Критичний»). Такі оновлення виділяються в розділі «Система» → «Оновлення» → «Розширення» та в модулі швидких піктограм панелі керування.</li></ul></div><div class=\"col-md-6 col-lg-5\"><img class=\"img-fluid d-block mx-auto\" src=\"media/com_guidedtours/images/6_2/security_warning.jpg\" alt=\"Позначки безпеки розширень\" width=\"488\" height=\"144\"></div></div>"
