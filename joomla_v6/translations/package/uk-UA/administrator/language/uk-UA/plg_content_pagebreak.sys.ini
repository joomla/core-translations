PLG_CONTENT_PAGEBREAK="Зміст. Розрив сторінки"
PLG_CONTENT_PAGEBREAK_XML_DESCRIPTION="<p>Плагін дає змогу розбивати статті на сторінки й за потреби додавати зміст. Вставляйте розриви сторінок кнопкою на панелі інструментів WYSIWYG-редактора. У редакторі місце розриву відображається простою горизонтальною лінією. Відображуваний текст залежить від вибраних параметрів: це може бути назва, альтернативний текст (якщо його вказано) або номер сторінки.<br>Наведений HTML-код — приклад допустимого синтаксису.<br>Використання: &amp;lt;hr class=\"system-pagebreak\" /&amp;gt;&lt;br /&gt;&amp;lt;hr class=\"system-pagebreak\" title=\"Назва сторінки\" /&amp;gt; або &lt;br /&gt;&amp;lt;hr class=\"system-pagebreak\" alt=\"Перша сторінка\" /&amp;gt; або &lt;br /&gt;&amp;lt;hr class=\"system-pagebreak\" title=\"Назва сторінки\" alt=\"Перша сторінка\" /&amp;gt; або &lt;br /&gt;&amp;lt;hr class=\"system-pagebreak\" alt=\"Перша сторінка\" title=\"Назва сторінки\" /&amp;gt;.</p>"

