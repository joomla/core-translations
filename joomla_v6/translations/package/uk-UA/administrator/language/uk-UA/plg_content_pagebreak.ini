PLG_CONTENT_PAGEBREAK_XML_DESCRIPTION="Плагін дає змогу розбивати статті на сторінки й за потреби додавати зміст. Вставляйте розриви сторінок кнопкою на панелі інструментів WYSIWYG-редактора.<br><br>У редакторі місце розриву відображається простою горизонтальною лінією. Відображуваний текст залежить від вибраних параметрів: це може бути назва, альтернативний текст (якщо його вказано) або номер сторінки.<br>Синтаксис HTML: &lt;hr class=\"system-pagebreak\" /&gt;<br>&lt;hr class=\"system-pagebreak\" title=\"Назва сторінки\" /&gt; або<br>&lt;hr class=\"system-pagebreak\" alt=\"Перша сторінка\" /&gt; або<br>&lt;hr class=\"system-pagebreak\" title=\"Назва сторінки\" alt=\"Перша сторінка\" /&gt; або<br>&lt;hr class=\"system-pagebreak\" alt=\"Перша сторінка\" title=\"Назва сторінки\" /&gt;."

