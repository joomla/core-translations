COM_GUIDEDTOURS_TOUR_WHATSNEW_6_2_STEP_0_DESCRIPTION="<h3>Повний перелік змін у Joomla 6.2</h3><p><a title=\"Повний перелік змін\" href=\"https://www.joomla.org/announcements/release-news/joomla-6-2-is-here.html\" target=\"_blank\" rel=\"noopener noreferrer\">Переглянути повний перелік змін на joomla.org</a></p><hr><h3>Довідка та інформація</h3><p class=\"mb-3\">Тут зібрано багато корисних ресурсів і додаткових посилань на матеріали, документацію, підтримку та інформацію про те, як долучитися до Joomla.</p><p><img class=\"img-fluid d-block mx-auto\" src=\"media/com_guidedtours/images/6_2/help_index.jpg\" alt=\"Оновлений покажчик довідки\" width=\"450\" height=\"275\"></p>"
