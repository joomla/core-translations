COM_GUIDEDTOURS_TOUR_WHATSNEW_6_2_DESCRIPTION="<h1 class=\"fw-medium\">Velkommen til Joomla 6.2!</h1><div class=\"row align-items-center pt-4\"><h2 class=\"mb-3\">Kerneopdateringer</h2><div class=\"col-12 mb-3\"><h3>Indeholdsredigerings opgraderinger</h3><ul><li><strong>Medie styring/Læs mere integrationer</strong>: Tilføjelse af billeder og medier er blevet endnu lettere med den opdaterede vælger, som nu åbner Joomla Medie manageren, og den nye Læs mere knap leverer en hurtigere måde til at indsætte artikelskift.</li><li><strong>Separate billede- og figurklasser</strong>: Artikel intro/fuld-tekst billeder har nu uafhængige CSS klassefelter til billedet og dets omgivende figurelement.</li></ul></div></div><div class=\"row align-items-center pt-1\"><div class=\"col-md-6 col-lg-7 mb-4\"><img class=\"img-fluid d-block mx-auto\" src=\"media/com_guidedtours/images/6_2/sublevel_menu.jpg\" alt=\"Sublevel menus\" width=\"383\" height=\"280\"></div><div class=\"col-md-6 col-lg-5\"><h3>Frontend skabelon (Cassiopeia)</h3><ul><li><strong>Multi-niveau dropdown menuer</strong>: Cassiopeia menuer understøtter nu mere end et underniveau i dropdown/kollaps layouts.</li></ul></div></div><div class=\"row align-items-center pt-1\"><div class=\"col-md-6 col-lg-7 my-3\"><h3>Moduler &amp; Webstedskonfiguration</h3><ul class=\"mb-3\"><li><strong>mod_login link skift</strong>: Nye indstillinger lader admins skjule linksene “Glemt din adgangskode?” og “Glemt dit brugernavn?” uden en skabelonoverskrivning. Standard er Vis, så det påvirker ikke eksisterende websteder.</li><li><strong>Sikkerhedsmarkering for udvidelsesopdateringer</strong>: Udviklere kan markere en udgivelse som en sikkerhedsopdatering (alvorlighed Ingen til Kritisk); markerede opdateringer bliver fremhævet i System -&gt; Opdateringer -&gt; Udvidelser og på kontrolpanelets hurtigikon.</li></ul></div><div class=\"col-md-6 col-lg-5\"><img class=\"img-fluid d-block mx-auto\" src=\"media/com_guidedtours/images/6_2/security_warning.jpg\" alt=\"Security tags on extensions\" width=\"488\" height=\"144\"></div></div>"
COM_GUIDEDTOURS_TOUR_WHATSNEW_6_2_TITLE="Hvad er nyt i Joomla 6.2!"

