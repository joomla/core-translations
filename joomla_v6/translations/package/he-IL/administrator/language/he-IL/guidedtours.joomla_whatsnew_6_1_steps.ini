COM_GUIDEDTOURS_TOUR_WHATSNEW_6_1_STEP_0_DESCRIPTION="<h3>הערות השחרור המלאות של Joomla 6.1</h3><p><a title=\"הערות שחרור מלאות\" href=\"https://www.joomla.org/announcements.html\" target=\"_blank\" rel=\"noopener noreferrer\">צפה בהערות השחרור המלאות באתר joomla.org</a></p><hr><h3>עזרה ומידע</h3><p>כאן ניתן למצוא משאבי עזרה רבים, יחד עם קישורים נוספים למשאבים, לתיעוד, לתמיכה ולדרכים להשתלב בקהילת Joomla.</p>"
