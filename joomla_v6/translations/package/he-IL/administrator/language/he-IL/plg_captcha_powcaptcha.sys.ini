PLG_CAPTCHA_POWCAPTCHA="CAPTCHA - הוכחת עבודה"
PLG_CAPTCHA_POWCAPTCHA_XML_DESCRIPTION="תוסף CAPTCHA זה מציג לדפדפן של המשתמש משימה מתמטית שהדפדפן יכול לפתור באופן אוטומטי. מטרתו אינה להוכיח שהמשתמש הוא אדם, אלא להוכיח שהמשתמש מוכן להשקיע את הזמן הדרוש לפתרון המשימה. מבוסס כרגע על הספרייה Altcha (altcha.org)."

