PLG_TASK_UPDATENOTIFICATION="משימה - ג'ומלה! עדכון הודעה"
PLG_TASK_UPDATENOTIFICATION_END="סיום התראת עדכון"
PLG_TASK_UPDATENOTIFICATION_EMAIL_DESC="רשימת כתובות דוא\"ל שמופרדים בפסיקים אשר יקבלו את הודעות על עידכון המערכת. הכתובות ברשימה חייבות להיות משויכות למשתמשים קיימים באתר שלךושיש להם הזכיות של מהנהל על. אם אף אחד הכתבובות אינן משויכות למשתמש על, או אם שדה נשאר ריק, כל משתמשי העל של האתר יקבלו את הודעת העדכון בדואר אלקטרוני."
PLG_TASK_UPDATENOTIFICATION_EMAIL_LBL="כתובת דואל של מנהל על"
PLG_TASK_UPDATENOTIFICATION_SEND_TITLE="Joomla!: הודעת עדכון"
PLG_TASK_UPDATENOTIFICATION_SEND_DESC="משימה זו בודקת מעת לעת אם קיימות גרסאות חדשות של Joomla!. כאשר נמצאת גרסה חדשה, תישלח אליך הודעת אימייל שתזכיר לך לעדכן. ניתן להתאים אישית את האימייל ב<a href=\"index.php?option=com_mails&view=templates&filter[extension]=plg_task_updatenotification\">מערכת &rarr; תבניות דואר.</a>"
PLG_TASK_UPDATENOTIFICATION_LANGUAGE_OVERRIDE_DESC="בחר שפה עבור הודעות עדכון של הדוא"_QQ_"ל. הגדר לאוטומטי כדי לשלוח אותם בשפת האתר באותו זמן."
PLG_TASK_UPDATENOTIFICATION_LANGUAGE_OVERRIDE_LBL="שפת הדואל"
PLG_TASK_UPDATENOTIFICATION_LANGUAGE_OVERRIDE_NONE="אוטומטי"
PLG_TASK_UPDATENOTIFICATION_EMAIL_BODY="דוא"_QQ_"ל זה לא נשלח על ידי ג'ומלה!. זה נשלח אוטומטית על ידי האתר שלך,\n{SITENAME} - {URL} \n\n============================ ================================================ ==\nעדכן מידע\n========================================== =====================================\n\nהאתר שלך גילה שיש גרסה מעודכנת של ג'ומלה! זמין.\n\nג'ומלה! הגרסה המותקנת כעת: {CURVERSION}\nג'ומלה! גרסה זמינה להתקנה: {NEWVERSION}\n\nאימייל זה נשלח אליך מהאתר שלך כדי להזכיר לך עובדה זו.\nהג'ומלה! הפרויקט לעולם לא ייצור איתך קשר ישירות לגבי עדכונים זמינים של ג'ומלה! באתר שלך.\n\n======================================== ======================================\nעדכון הוראות\n======= ================================================ ======================\n\nכדי להתקין את העדכון ב-{SITENAME} אנא בחר בקישור הבא. (אם כתובת האתר אינה קישור, העתק והדבק אותה לדפדפן שלך).\n\nקישור לעדכון: {LINK}\n\nניתן למצוא את חדשות הפרסום כאן: {RELEASENEWS}\n\n====== ================================================ ========================\nלמה אני מקבל את האימייל הזה?\n================= ================================================ =============\n\nאימייל זה נשלח אוטומטית על ידי תוסף שסופק על ידי ג'ומלה!, התוכנה שמפעילה את האתר שלך.\nתוסף זה מחפש גרסאות מעודכנות של ג'ומלה! ושולחת הודעת דוא"_QQ_"ל למנהלים שלו.\nתקבל מספר הודעות דוא"_QQ_"ל דומות מהאתר שלך עד שתעדכן את התוכנה או תשבית הודעות דוא"_QQ_"ל אלה.\n\nכדי להשבית הודעות דוא"_QQ_"ל אלה, אנא בטל את הפרסום של ה'משימה - ג'ומלה! Update Notification' plugin במנהל הפלאגין באתר שלך.\n\nאם אתה לא מבין מה ג'ומלה! הוא ומה שאתה צריך לעשות בבקשה אל תיצור קשר עם ג'ומלה!.\nהם לא שולחים לך את האימייל הזה והם לא יכולים לעזור לך. במקום זאת, אנא צור קשר עם האדם שבנה או מנהל את האתר שלך.\n\nאם אתה האדם שבנה או מנהל את האתר שלך, שים לב שייתכן שהתוסף הזה הופעל אוטומטית כאשר התקנת או עדכנת את ג'ומלה! באתר שלך.\n\n======================================== ======================================\nמי שלח לי את האימייל הזה?\n=== ================================================ ===========================\n\nאימייל זה נשלח אליך מהאתר שלך, {SITENAME}"
; You can use the following merge codes:
; {NEWVERSION}		New Joomla! version, e.g. 1.2.3
; {CURVERSION}		Currently installed Joomla! version, e.g. 1.2.0
; {SITENAME}		Site name, as set in Global Configuration.
; {URL}			URL of the site's frontend page.
; {LINK}		Update URL (link to com_joomlaupdate, will request login if the Super User isn't already logged in).
; {RELEASENEWS}		URL to the release news on joomla.org
; \n			Newline character. Use it to start a new line in the email.
