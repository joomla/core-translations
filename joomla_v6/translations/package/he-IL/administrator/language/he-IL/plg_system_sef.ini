PLG_SEF_DOMAIN_DESCRIPTION="אם ניתן לגשת לאתר שלך דרך יותר מדומיין אחד הזן כאן את הדומיין המועדף (המכונה לפעמים קנוני). <br><strong>הערה:</strong> https://example.com ו-https://www.example.com הם דומיינים שונים."
