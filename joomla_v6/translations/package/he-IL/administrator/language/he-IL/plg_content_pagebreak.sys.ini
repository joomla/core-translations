PLG_CONTENT_PAGEBREAK="תוכן - שבירת עמוד"
PLG_CONTENT_PAGEBREAK_XML_DESCRIPTION="<p>מאפשר יצירת מאמר מחולק לעמודים עם תוכן עניינים אופציונלי.</p><p>הוסף מעברי עמוד באמצעות לחצן מעבר העמוד שנמצא בדרך כלל בסרגל הכלים של עורך ה-WYSIWYG. מיקום מעבר העמוד במאמר יוצג בעורך כקו אופקי פשוט.</p><p>הטקסט המוצג תלוי באפשרויות שנבחרו, ויכול להיות הכותרת, טקסט חלופי (אם סופק) או מספרי עמודים.</p><p>אופן השימוש ב-HTML:<br>&lt;hr class=&quot;system-pagebreak&quot; /&gt;<br>&lt;hr class=&quot;system-pagebreak&quot; title=&quot;The page title&quot; /&gt; או <br>&lt;hr class=&quot;system-pagebreak&quot; alt=&quot;The first page&quot; /&gt; או <br>&lt;hr class=&quot;system-pagebreak&quot; title=&quot;The page title&quot; alt=&quot;The first page&quot; /&gt; או <br>&lt;hr class=&quot;system-pagebreak&quot; alt=&quot;The first page&quot; title=&quot;The page title&quot; /&gt;</p>"

