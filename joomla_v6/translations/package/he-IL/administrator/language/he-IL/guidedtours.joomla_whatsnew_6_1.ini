COM_GUIDEDTOURS_TOUR_WHATSNEW_6_1_DESCRIPTION="<h1 class=\"fw-medium\">ברוכים הבאים ל-Joomla 6.1!</h1><p>Joomla 6.1 מציגה שיפורים מרכזיים שהופכים את בניית האתרים לקלה, בטוחה וגמישה יותר. סיור זה מציג לך את עיקרי הדברים במבט אחד.</p><div class=\"row align-items-center mb-4 pt-4 border-top border-1\"><div class=\"col-md-6 col-lg-7\"><h2 class=\"mb-3\">ההגנה מפני ספאם חוזרת עם CAPTCHA מסוג Proof-of-Work</h2><p>ללא צורך בחשבון או ב-API, ידידותי לפרטיות ונגיש, ה-CAPTCHA הזה פותר בשקט חידות מתמטיות ברקע, באופן בלתי נראה למבקרים.</p><p>כדי להפעיל, עבור אל <em>הרחבות</em> -&gt; <em>תוספים</em>, חפש <strong>captcha</strong>, הפעל את התוסף והגדר אותו כברירת מחדל בהגדרות הכלליות.</p></div><div class=\"col-md-6 col-lg-5 text-center text-md-start mb-3\"><img class=\"img-fluid\" src=\"media/com_guidedtours/images/6_1/captcha.jpg\" alt=\"מצבי ה-CAPTCHA: מאמת ואומת\" width=\"600\" height=\"250\"></div></div><div class=\"row align-items-center border-top border-1 pt-4\"><div class=\"col-md-6 col-lg-5 text-center text-md-start mb-3\"><img class=\"img-fluid\" src=\"media/com_guidedtours/images/6_1/workflows.jpg\" alt=\"ייצוג גרפי של תהליך העבודה הבסיסי\" width=\"600\" height=\"350\"></div><div class=\"col-md-6 col-lg-7 mb-3\"><h2 class=\"mb-3\">מסלול התוכן במבט אחד עם עורך תהליכי העבודה החזותי</h2><p>נהל את תהליך העבודה של התוכן בקלות רבה יותר בעזרת תרשים תהליך העבודה האינטראקטיבי החדש, שמאפשר לראות את כל תהליך הפרסום.</p><p>הפעל תהליכי עבודה ב<em>מנהל המאמרים</em> -&gt; <em>תהליכי עבודה</em> וחפש את לחצן התרשים.</p></div></div><div class=\"row align-items-center border-top border-1 pt-4\"><div class=\"col-md-6 col-lg-7 mb-3\"><h2 class=\"mb-3\">שלוש אפשרויות חדשות לשדה מותאם אישית מסוג מדיה: שמע, וידאו &amp; מסמכים</h2><p>בעת יצירת שדות מותאמים אישית עבור התוכן שלך, ניתן כעת לאפשר ליוצרי התוכן לכלול כל סוג של מדיה, ולא רק תמונות.</p><p>המדיה מוצגת כרכיבי HTML5 &lt;audio&gt;, &lt;video&gt;, או כקישורים למסמכים (PDF, גיליונות אלקטרוניים...).</p></div><div class=\"col-md-6 col-lg-5 text-center text-md-start mb-3\"><img class=\"img-fluid\" src=\"media/com_guidedtours/images/6_1/media.jpg\" alt=\"שלוש אפשרויות שדה המדיה: שמע, וידאו ומסמך\" width=\"600\" height=\"350\"></div></div><div class=\"row align-items-center border-top border-1 pt-4\"><div class=\"col-12 mb-3\"><h2 class=\"mb-3\">מודולים חכמים יותר עם ניהול גרסאות ושיוכים רב-לשוניים</h2><p>ל-Joomla יש זה מכבר היסטוריית גרסאות למאמרים. יכולת זו מורחבת כעת גם למודולים.<br>אם אתה מפעיל אתר רב-לשוני, ניתן כעת לשייך מופעי מודולים בין שפות שונות, בדיוק כפי שניתן לשייך מאמרים בין שפות.</p><h2>שיפורים נוספים שכדאי לציין</h2><ul class=\"mb-3\"><li>תמיכה בקיצורים <strong>&lt;abbr&gt;</strong> בעורך הטקסט העשיר TinyMCE, נכונה מבחינה סמנטית ומשפרת את הנגישות (חפש את לחצן הקיצור החדש בסרגל הכלים של TinyMCE בעת עריכת תוכן).</li><li>שיפורי חוויית משתמש בסטטוס דריסות השפה &amp; יצירה מהירה של דריסות חסרות (מחוון סטטוס, עריכה קלה של דריסות).</li></ul></div></div>"
COM_GUIDEDTOURS_TOUR_WHATSNEW_6_1_TITLE="מה חדש ב-Joomla 6.1!"

