COM_GUIDEDTOURS_TOUR_WHATSNEW_6_0_DESCRIPTION="<h1 class=\"fw-medium\">ברוכים הבאים ל-Joomla 6!</h1><div class=\"row align-items-center border-top border-1 pt-4\"><div class=\"col-md-6 col-lg-6 text-center text-md-start mb-3\"><img class=\"img-fluid shadow\" src=\"media/com_guidedtours/images/6_0/cassiopeiacolors.jpg\" alt=\"הצגת כלי ההתאמה האישית של סגנון תבנית הבת\" width=\"640\" height=\"380\"></div><div class=\"col-md-6 col-lg-6 mb-3\"><h2 class=\"mb-3\">Cassiopeia מורחבת</h2><p>גלה תבניות בת עם סגנון חדש המדגים יכולות התאמה אישית מתקדמות, כגון שינוי גופנים וצבעים.</p></div></div><div class=\"row align-items-center border-top border-1 pt-4\"><div class=\"col-md-12 mb-3\"><h2 class=\"mb-3\">ניהול גרסאות מורחב</h2><p>מערכת ניהול הגרסאות של Joomla שופרה וכוללת כעת שדות מותאמים אישית, תגיות וקטגוריות, כך שניתן לעקוב אחר כל שינויי התוכן, להשוות ביניהם ולשחזר אותם.</p></div></div>"
COM_GUIDEDTOURS_TOUR_WHATSNEW_6_0_TITLE="מה חדש ב-Joomla 6!"

