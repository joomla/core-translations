PLG_SYSTEM_JOOA11Y="מערכת - בודק נגישות ג'ומלה"
PLG_SYSTEM_JOOA11Y_FIELD_CHECK_ROOT="אזור יעד לבדיקה"
PLG_SYSTEM_JOOA11Y_FIELD_CHECK_ROOT_DESC="הזן בורר יחיד כדי למקד לאזור מסוים באתר שלך. הגדרת ברירת המחדל היא ציון הדרך <strong>main</strong>. חלופות לציוני דרך הן מחלקות, אלמנטים או תפקידי ARIA (למשל #main-content, .main, [role='main']). הזן <strong>body</strong> כדי לבדוק את הדף כולו."
PLG_SYSTEM_JOOA11Y_FIELD_CHECKS="כבה בדיקות"
PLG_SYSTEM_JOOA11Y_FIELD_CHECKS_DESC="כבה בדיקות ספציפיות לפי שם מפתח. למד כיצד <a href=\"https://sa11y.netlify.app/plugins/joomla/#turn-off-checks\" target=\"_blank\" rel=\"noopener noreferrer\">לכבות בדיקות</a>."
PLG_SYSTEM_JOOA11Y_FIELD_CONTAINER_IGNORE="התעלם מאזורים"
PLG_SYSTEM_JOOA11Y_FIELD_CONTAINER_IGNORE_DESC="התעלם מאזורים ספציפיים בתוך מיכל התוכן. השתמש בפסיקים כדי להפריד בין מחלקות או אלמנטים (למשל #ignore, .ignore)"
PLG_SYSTEM_JOOA11Y_FIELD_EXTRA_PROPS="מאפיינים נוספים"
PLG_SYSTEM_JOOA11Y_FIELD_EXTRA_PROPS_DESC="העבר מאפיינים נוספים להתאמה אישית. למד כיצד להוסיף <a href=\"https://sa11y.netlify.app/plugins/joomla/#extra-properties\" target=\"_blank\" rel=\"noopener noreferrer\">מאפיינים נוספים</a>."
PLG_SYSTEM_JOOA11Y_FIELD_READABILITY_ROOT="אזור יעד לקריאות"
PLG_SYSTEM_JOOA11Y_FIELD_READABILITY_ROOT_DESC="ציון דרך בדף שייבדק לקריאות. הגדרת ברירת המחדל היא ציון הדרך <strong>main</strong>."
PLG_SYSTEM_JOOA11Y_FIELD_SHOW_ALWAYS="הצג תמיד"
PLG_SYSTEM_JOOA11Y_FIELD_SHOW_ALWAYS_DESC="טען את בודק הנגישות בכל הדפים. זה שימושי בעת פיתוח האתר, אך אין להשאירו פועל כאשר האתר פעיל."
PLG_SYSTEM_JOOA11Y_KEY="מפתח"
PLG_SYSTEM_JOOA11Y_VALUE="Value"
PLG_SYSTEM_JOOA11Y_XML_DESCRIPTION="בודק הנגישות של ג'ומלה מדגיש באופן ויזואלי בעיות נגישות ושימושיות נפוצות. מכוון למחברי תוכן, הפלאגין מזהה שגיאות או אזהרות ומספק הנחיות לתיקונן. שים לב שהפלאגין אינו מציע ניתוח מקיף ואינו מבטיח נגישות האתר באופן אוטומטי. חשוב לבחור תבנית שנגישת מטבעה כדי להבטיח עמידה בתקני הנגישות."

