PLG_SYSTEM_SHORTCUT="מערכת - קיצורי הקלדה"
PLG_SYSTEM_SHORTCUT_XML_DESCRIPTION="<p>מאפשר קיצורי מקלדת בממשק הניהול, שיכולים להיות מסופקים גם על ידי תוספים אחרים, וכולל ישירות את רשימת הקיצורים הבאה:</p><ul class=\"list-unstyled\"><li><kbd>J</kbd> <small>ואז</small> <kbd>A</kbd> שמירה</li><li><kbd>J</kbd> <small>ואז</small> <kbd>S</kbd> שמירה וסגירה</li><li><kbd>J</kbd> <small>ואז</small> <kbd>Q</kbd> ביטול</li><li><kbd>J</kbd> <small>ואז</small> <kbd>N</kbd> חדש</li><li><kbd>J</kbd> <small>ואז</small> <kbd>F</kbd> חיפוש</li><li><kbd>J</kbd> <small>ואז</small> <kbd>O</kbd> אפשרויות</li><li><kbd>J</kbd> <small>ואז</small> <kbd>H</kbd> עזרה</li><li><kbd>J</kbd> <small>ואז</small> <kbd>M</kbd> הצגה/הסתרה של התפריט</li><li><kbd>J</kbd> <small>ואז</small> <kbd>X</kbd> סקירה כללית</li><li><kbd>J</kbd> <small>ואז</small> <kbd>D</kbd> לוח הבקרה הראשי</li></ul>"

