COM_GUIDEDTOURS_TOUR_WELCOMETOJOOMLA_STEP_MENUS_TITLE="התפריט"
COM_GUIDEDTOURS_TOUR_WELCOMETOJOOMLA_STEP_MENUS_DESCRIPTION="<p>התפריט מספק גישה לדפי הניהול של ממשק הניהול. לכל אזור יש אוסף דפים לניהול היבט מסוים של Joomla, כגון תוכן, תפריטים ומשתמשים.</p><p>סמלי החלונות מקשרים ללוחות בקרה ייעודיים עבור אזורים אלה. תפריט המערכת עצמו מוביל ללוח בקרה.</p>"

COM_GUIDEDTOURS_TOUR_WELCOMETOJOOMLA_STEP_QUICKACCESS_TITLE="חלוניות לוח הבקרה"
COM_GUIDEDTOURS_TOUR_WELCOMETOJOOMLA_STEP_QUICKACCESS_DESCRIPTION="<p>לוחות הבקרה מספקים גישה מהירה לדפים נפוצים באמצעות הסמלים שלהם.</p><p>כל חלונית בלוח הבקרה היא מודול ניהול שניתן להתאים אישית דרך סמל ההגדרות שלה <span class=\"icon-cogs\" aria-hidden=\"true\"></span>.<br>כך ניתן להגדיר את לוחות הבקרה של האתר בהתאם לצרכים שלך.</p>"

COM_GUIDEDTOURS_TOUR_WELCOMETOJOOMLA_STEP_NOTIFICATIONS_TITLE="חלונית ההתראות"
COM_GUIDEDTOURS_TOUR_WELCOMETOJOOMLA_STEP_NOTIFICATIONS_DESCRIPTION="<p>חלונית ההתראות מציגה מתי זמינים עדכונים עבור Joomla והרחבות אחרות. גם בקשות פרטיות ממתינות מוצגות כאן.</p>"

COM_GUIDEDTOURS_TOUR_WELCOMETOJOOMLA_STEP_TOPBAR_TITLE="הסרגל העליון"
COM_GUIDEDTOURS_TOUR_WELCOMETOJOOMLA_STEP_TOPBAR_DESCRIPTION="<p>הסרגל העליון מציג את כותרת הדף המוצג, כך שתמיד תדע היכן אתה נמצא. שאר הפריטים בסרגל העליון הם מודולים אופציונליים.</p><p>בדרך כלל ניתן למצוא כאן את גרסת Joomla הנוכחית וגישה לסיורים מודרכים נוספים.</p><p>הפריטים האחרונים הם בדרך כלל קישור לחזית האתר ותפריט המשתמש, שבו ניתן לנהל את החשבון שלך ולהתנתק.</p>"

COM_GUIDEDTOURS_TOUR_WELCOMETOJOOMLA_STEP_FINALWORDS_TITLE="עזרה ומידע"
COM_GUIDEDTOURS_TOUR_WELCOMETOJOOMLA_STEP_FINALWORDS_DESCRIPTION="<p>כאן ניתן למצוא משאבי עזרה רבים, יחד עם קישורים נוספים למשאבים, לתיעוד, לתמיכה ולדרכים להשתלב בקהילת Joomla.</p>"

