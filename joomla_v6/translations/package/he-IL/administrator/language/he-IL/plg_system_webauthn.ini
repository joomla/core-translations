PLG_SYSTEM_WEBAUTHN="מערכת - התחברות עם מפתח גישה (ללא סיסמה)"
PLG_SYSTEM_WEBAUTHN_CANNOT_ADD_FOR_A_USER="אינך יכול להוסיף או להסיר מפתחות גישה בשם משתמשים. על המשתמשים להתחבר ולהגדיר את המכשירים שלהם בעצמם."
PLG_SYSTEM_WEBAUTHN_DESCRIPTION="מאפשר אימות ללא סיסמה באמצעות מפתחות גישה. שים לב שלשונית מפתחות הגישה בעורך פרופיל המשתמש ולחצני ההתחברות עם מפתח גישה יוצגו רק אם המשתמש ניגש לאתר דרך HTTPS. רישום מפתחות גישה והשימוש בהם להתחברות לאתר יפעלו רק כאשר האתר משתמש באישור תקין, החתום על ידי רשות אישורים שהדפדפן של המשתמש סומך עליה."
PLG_SYSTEM_WEBAUTHN_ERR_AJAX_INVALIDACTION="פעולת ajax לא חוקית"
PLG_SYSTEM_WEBAUTHN_ERR_CANNOT_FIND_USERNAME="אינו יכול למצוא שדה שם משתמש בכניסה למודול. אימות ללא סיסמה לא יעבוד באתר זה אלא אם תשתמש במודול כניסה אחר."
PLG_SYSTEM_WEBAUTHN_ERR_CANT_STORE_FOR_GUEST="לא ניתן לאחסן אישורים עבור משתמש אורח!"
PLG_SYSTEM_WEBAUTHN_ERR_CORRUPT_STORED_CREDENTIAL="פרטי הזיהוי השמורים עבור חשבון המשתמש שלך פגומים. התחבר בשיטה אחרת, ולאחר מכן הסר את מפתח הגישה והוסף אותו מחדש."
PLG_SYSTEM_WEBAUTHN_ERR_CREATE_INVALID_LOGIN_REQUEST="בקשת כניסה לא חוקית ללא סיסמה. משהו מקולקל או שזה ניסיון לפרוץ לאתר."
PLG_SYSTEM_WEBAUTHN_ERR_CREATE_INVALID_PK="רישום מפתח הגישה נכשל. התגובה של מפתח הגישה שהתקבלה מהדפדפן אינה תואמת למפתח הציבורי שהנפיק השרת. משמעות הדבר היא שמישהו ניסה לפרוץ אליך או שמשהו אינו תקין."
PLG_SYSTEM_WEBAUTHN_ERR_CREATE_INVALID_USER="מסיבות אבטחה, אינך מורשה לרשום מפתחות גישה בשם משתמש אחר."
PLG_SYSTEM_WEBAUTHN_ERR_CREATE_NO_ATTESTED_DATA="משהו השתבש, אך אין מידע נוסף זמין על השגיאה כרגע. נסה לרשום שוב את מפתח הגישה שלך."
PLG_SYSTEM_WEBAUTHN_ERR_CREATE_NO_PK="השרת לא הנפיק מפתח ציבורי לרישום מפתח גישה, אך איכשהו התקבלה מהדפדפן בקשה לרישום מפתח גישה. משמעות הדבר היא שמישהו ניסה לפרוץ אליך או שמשהו אינו תקין."
PLG_SYSTEM_WEBAUTHN_ERR_CREDENTIAL_ID_ALREADY_IN_USE="לא ניתן לשמור אישורים. אישורים אלה כבר נמצאים בשימוש על ידי משתמש אחר."
PLG_SYSTEM_WEBAUTHN_ERR_EMPTY_USERNAME="עליך להזין את שם המשתמש שלך (אך לא את הסיסמה) לפני בחירה בלחצן ההתחברות עם מפתח גישה."
PLG_SYSTEM_WEBAUTHN_ERR_INVALID_USERNAME="שם המשתמש שצוין אינו תואם לחשבון משתמש שאיפשר כניסה ללא סיסמה באתר זה."
PLG_SYSTEM_WEBAUTHN_ERR_LABEL_NOT_SAVED="אינו יכול לשמור את התווית החדשה"
PLG_SYSTEM_WEBAUTHN_ERR_NOT_DELETED="לא ניתן היה להסיר את מפתח הגישה"
PLG_SYSTEM_WEBAUTHN_ERR_NOUSER="לא נמצא חשבון משתמש"
PLG_SYSTEM_WEBAUTHN_ERR_NO_BROWSER_SUPPORT="מצטערים, הדפדפן שלך אינו תומך בתקן מפתחות הגישה להתחברות ללא סיסמה, או שהאתר שלך אינו מוגש דרך HTTPS עם אישור תקין החתום על ידי רשות אישורים שהדפדפן שלך סומך עליה. יהיה עליך להתחבר לאתר זה באמצעות שם המשתמש והסיסמה שלך."
PLG_SYSTEM_WEBAUTHN_ERR_NO_STORED_CREDENTIAL="לא ניתן למצוא את פרטי הזיהוי השמורים עבור מפתח הגישה שלך."
PLG_SYSTEM_WEBAUTHN_ERR_USER_REMOVED="נראה שהמשתמש של מפתח גישה זה כבר אינו קיים באתר."
PLG_SYSTEM_WEBAUTHN_ERR_XHR_INITCREATE="לא ניתן לקבל מהאתר שלך את פרטי הרישום של מפתח הגישה."
PLG_SYSTEM_WEBAUTHN_FIELD_ATTESTATION_SUPPORT_DESC="אפשר שימוש רק במפתחות גישה בעלי חתימות קריפטוגרפיות הניתנות לאימות עבור התחברות עם מפתח גישה. מומלץ מאוד לסביבות אבטחה גבוהה. דורש שהתיקייה הזמנית של המערכת תהיה ניתנת לכתיבה על ידי PHP, וכן את הרחבת OpenSSL. עלול למנוע לחלוטין פעולה של מפתחות גישה זולים ולא מאושרים מסוימים. השבתת האפשרות מונעת גם מ-Joomla לזהות את היצרן והדגם של מפתח הגישה שבו אתה משתמש (לא יוצג סמל ליד שם מפתח הגישה)."
PLG_SYSTEM_WEBAUTHN_FIELD_ATTESTATION_SUPPORT_LABEL="תמיכת Attestation"
PLG_SYSTEM_WEBAUTHN_FIELD_DESC="מאפשר לנהל שיטות התחברות ללא סיסמה באמצעות מפתחות גישה. נדרשים דפדפן ומפתח גישה נתמכים (לדוגמה Google Chrome או Firefox עם מפתח אבטחה בעל אישור FIDO2).<br><br><strong>MacOS/iOS/watchOS:</strong> Touch/Face ID.<br><strong>Windows:</strong> Hello (טביעת אצבע / זיהוי פנים / PIN).<br><strong>Android:</strong> נעילת מסך ביומטרית.<br><br>פרטים נוספים ניתן למצוא ב<a href=\"https://guide.joomla.org/user-manual/users/users-webauthn-passwordless-login\" target=\"_blank\" rel=\"noopener noreferrer\">תיעוד ההתחברות ללא סיסמה עם מפתח גישה</a>."
