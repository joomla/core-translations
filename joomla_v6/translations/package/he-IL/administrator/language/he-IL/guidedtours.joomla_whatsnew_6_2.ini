COM_GUIDEDTOURS_TOUR_WHATSNEW_6_2_DESCRIPTION="<h1 class=\"fw-medium\">ברוכים הבאים ל-Joomla 6.2!</h1><div class=\"row align-items-center pt-4\"><h2 class=\"mb-3\">עדכוני ליבה</h2><div class=\"col-12 mb-3\"><h3>שדרוגים בעריכת תוכן</h3><ul><li><strong>שילוב מנהל המדיה ו'קרא עוד'</strong>: הוספת תמונות ומדיה נעשתה קלה יותר בזכות הבורר המעודכן, שפותח כעת את מנהל המדיה של Joomla, וכפתור 'קרא עוד' החדש מאפשר להוסיף מעברי מאמר במהירות.</li><li><strong>מחלקות נפרדות לתמונה ול-figure</strong>: לתמונות הפתיח והטקסט המלא של מאמרים יש כעת שדות מחלקת CSS נפרדים לתמונה ולרכיב ה-figure העוטף אותה.</li></ul></div></div><div class=\"row align-items-center pt-1\"><div class=\"col-md-6 col-lg-7 mb-4\"><img class=\"img-fluid d-block mx-auto\" src=\"media/com_guidedtours/images/6_2/sublevel_menu.jpg\" alt=\"תפריטים בתת-רמות\" width=\"383\" height=\"280\"></div><div class=\"col-md-6 col-lg-5\"><h3>תבנית האתר (Cassiopeia)</h3><ul><li><strong>תפריטים נפתחים מרובי רמות</strong>: תפריטי Cassiopeia תומכים כעת ביותר מתת-רמה אחת בפריסות נפתחות/מתקפלות.</li></ul></div></div><div class=\"row align-items-center pt-1\"><div class=\"col-md-6 col-lg-7 my-3\"><h3>מודולים והגדרות אתר</h3><ul class=\"mb-3\"><li><strong>הסתרת קישורים ב-mod_login</strong>: אפשרויות חדשות מאפשרות למנהלים להסתיר את הקישורים “שכחת את הסיסמה?” ו“שכחת את שם המשתמש?” ללא דריסת תבנית. ברירת המחדל היא 'הצג', כך שאין השפעה על אתרים קיימים.</li><li><strong>סימון אבטחה לעדכוני הרחבות</strong>: מפתחים יכולים לסמן גרסה כעדכון אבטחה (חומרה מ'ללא' עד 'קריטית'); עדכונים מסומנים מודגשים ב-מערכת -&gt; עדכון -&gt; הרחבות ובסמל הגישה המהירה בלוח הבקרה.</li></ul></div><div class=\"col-md-6 col-lg-5\"><img class=\"img-fluid d-block mx-auto\" src=\"media/com_guidedtours/images/6_2/security_warning.jpg\" alt=\"תגיות אבטחה בהרחבות\" width=\"488\" height=\"144\"></div></div>"
COM_GUIDEDTOURS_TOUR_WHATSNEW_6_2_TITLE="מה חדש ב-Joomla 6.2!"

