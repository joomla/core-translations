COM_GUIDEDTOURS_TOUR_WHATSNEW_6_0_STEP_0_DESCRIPTION="<div class=\"row align-items-center pt-3\"><div class=\"col-12\"><h2 class=\"mb-3\">עדכונים נוספים</h2><p>מאמרים מקודמים חולקים כעת את התצוגה של מנהל המאמרים.</p></div></div><div class=\"row align-items-center pt-4\"><div class=\"col-12\"><h3>אם פספסת</h3><p>ג'ומלה! 6 תומכת בעדכונים אוטומטיים באמצעות The Update Framework (TUF) לשיפור האבטחה והביצועים.<br>הגדרות העדכון האוטומטי נמצאות בסעיף התצורה של <em>עדכון ג'ומלה!</em>.</p></div></div><div class=\"row align-items-center pt-4\"><div class=\"col-12\"><h3>שיפורים ותיקונים נוספים</h3><ul class=\"mb-3\"><li>הודעת אימייל עם אישור הרשמה על ידי מנהל <a href=\"https://github.com/joomla/joomla-cms/pull/45802\" target=\"_blank\" rel=\"noopener noreferrer\">PR#45802</a></li><li>הוספת מחלקות מותאמות לרשימת המחלקות בחלון התמונה של TinyMCE <a href=\"https://github.com/joomla/joomla-cms/pull/45676\" target=\"_blank\" rel=\"noopener noreferrer\">PR#45676</a></li><li>הוספת אפשרות להסרת תגית באצווה <a href=\"https://github.com/joomla/joomla-cms/pull/40613\" target=\"_blank\" rel=\"noopener noreferrer\">PR#40613</a></li><li>ועוד שיפורים רבים מאחורי הקלעים...</li></ul></div></div>"
COM_GUIDEDTOURS_TOUR_WHATSNEW_6_0_STEP_0_TITLE="תכונות נוספות"
COM_GUIDEDTOURS_TOUR_WHATSNEW_6_0_STEP_1_DESCRIPTION="<h3>מידע אודות ג'ומלה 6.0</h3><p><a title=\"Release information\" href=\"https://6.joomla.org/\" target=\"_blank\" rel=\"noopener noreferrer\">צפה את מידע השחרור ב-6.joomla.org</a></p><hr><h3>עזרה ומידע</h3><p>משאבי עזרה רבים נמצאים כאן, יחד עם קישורים נוספים למשאבים, תיעוד, תמיכה, ואיך להשתתף בג'ומלה.</p>"
COM_GUIDEDTOURS_TOUR_WHATSNEW_6_0_STEP_1_TITLE="מידע נוסף ועזרה"

