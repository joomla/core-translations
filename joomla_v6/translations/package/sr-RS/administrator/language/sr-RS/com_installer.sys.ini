COM_INSTALLER_DISCOVER_VIEW_DEFAULT_DESC="Овај екран омогућава откривање екстензија које нису прошле кроз уобичајени поступак инсталације. <br />На пример, датотеке неких екстензија могу бити превелике за отпремање путем веб-интерфејса због ограничења окружења. Помоћу ове могућности можете пренети датотеке екстензије директно на веб-сервер на други начин, као што су FTP или SFTP, и сместити их у одговарајући директоријум. <br />Затим можете користити откривање да пронађете недавно отпремљену екстензију и активирате је у својој инсталацији Џумле! <br />Откривањем можете пронаћи и инсталирати више екстензија истовремено."
