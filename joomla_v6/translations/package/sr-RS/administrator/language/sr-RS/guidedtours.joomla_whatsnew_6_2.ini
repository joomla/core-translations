COM_GUIDEDTOURS_TOUR_WHATSNEW_6_2_DESCRIPTION="<h1 class=\"fw-medium\">Добро дошли у Џумлу 6.2!</h1><div class=\"row align-items-center pt-4\"><h2 class=\"mb-3\">Ажурирања језгра</h2><div class=\"col-12 mb-3\"><h3>Унапређења уређивања садржаја</h3><ul><li><strong>Интеграција управљача медијима и дугмета „Опширније“</strong>: Додавање слика и медија је олакшано унапређеним бирачем који сада отвара Џумлин управљач медијима, а ново дугме „Опширније“ омогућава брже уметање прелома чланка.</li><li><strong>Засебне класе слике и елемента figure</strong>: Слике увода и целог текста чланка сада имају засебна поља за CSS класу слике и елемента figure који је окружује.</li></ul></div></div><div class=\"row align-items-center pt-1\"><div class=\"col-md-6 col-lg-7 mb-4\"><img class=\"img-fluid d-block mx-auto\" src=\"media/com_guidedtours/images/6_2/sublevel_menu.jpg\" alt=\"Менији нижих нивоа\" width=\"383\" height=\"280\"></div><div class=\"col-md-6 col-lg-5\"><h3>Шаблон јавног дела сајта (Cassiopeia)</h3><ul><li><strong>Вишенивоски падајући менији</strong>: Менији шаблона Cassiopeia сада подржавају више од једног поднивоа у падајућем и склопивом приказу.</li></ul></div></div><div class=\"row align-items-center pt-1\"><div class=\"col-md-6 col-lg-7 my-3\"><h3>Модули &amp; подешавања сајта</h3><ul class=\"mb-3\"><li><strong>Укључивање и искључивање линкова модула mod_login</strong>: Нове опције омогућавају администраторима да сакрију линкове „Заборавили сте лозинку?“ и „Заборавили сте корисничко име?“ без измене приказа путем шаблона. Подразумевано је изабрано „Прикажи“, па ово не утиче на постојеће сајтове.</li><li><strong>Безбедносна ознака ажурирања екстензија</strong>: Програмери могу означити издање као безбедносно ажурирање (ниво озбиљности од „Није назначен“ до „Критично“); означена ажурирања су истакнута у одељку Систем -&gt; Ажурирање -&gt; Екстензије и на иконици за брзи приступ на контролној табли.</li></ul></div><div class=\"col-md-6 col-lg-5\"><img class=\"img-fluid d-block mx-auto\" src=\"media/com_guidedtours/images/6_2/security_warning.jpg\" alt=\"Безбедносне ознаке екстензија\" width=\"488\" height=\"144\"></div></div>"
COM_GUIDEDTOURS_TOUR_WHATSNEW_6_2_TITLE="Шта је ново у Џумли 6.2!"

