JLIB_RULES_SELECT_SETTING="Изаберите нову поставку <sup>1</sup>"
JLIB_RULES_SETTING_NOTES="<ol><li>1. Ова нова поставка ће бити примењена на ову и све подређене групе, компоненте и садржај. Имајте на уму да ће <em>Одбијено</em> поништити било коју наслеђену поставку и такође поставке у било којој подређеној групи, компоненти и садржају. У случају конфликта поставки, <em>Одбиј</em> ће преузети првенство. <em>Није подешено</em> је еквивалентно <em>Одбијено</em> али може бити промењено у подређеним групама, компонентама и садржајима.</li><li>2. Ако изаберете нову поставку, кликните <em>Сачувај</em> да бисте освежили израчунате поставке.</li></ol>"
JLIB_RULES_SETTING_NOTES_ITEM="Ако промените поставку, она ће се применити на ову ставку. Имајте на уму да: <br><em><strong>Наслеђено</strong></em> значи да ће се користити дозволе из глобалне конфигурације, надређене групе и категорије. <br><em><strong>Одбијено</strong></em> значи да без обзира на глобалну конфигурацију, поставке надређене групе или категорије, група која се уређује не може да предузме ову радњу на овој ставци. <br><em><strong>Дозвољено</strong></em> значи да ће група која се уређује моћи да предузме ову радњу за ову ставку (али ако је то у супротности са глобалном конфигурацијом, надређеном групом или категоријом, неће имати утицаја; конфликт ће бити означен са <em><strong>Није дозвољено (наслеђено)</strong></em> у оквиру Израчунате поставке)."
