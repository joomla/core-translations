PLG_LDAP_FIELD_CACERT_DESC="Пуна путања до датотеке или директоријума у ком Џумла може да пронађе сертификат сертификационог тела (CA) за LDAP сервер. Ако је поље празно, користе се подразумеване системске вредности опција TLS_CACERT и TLS_CACERTDIR LDAP клијента."
