PLG_LDAP_FIELD_SEARCHSTRING_DESC="Стринг упита за претрагу одређеног корисника. Кључна реч [search] замењује се податком за пријаву који корисник унесе. Пример стринга: uid=[search]. Можете користити више стрингова раздвојених тачком са зарезом. Користи се после почетне операције bind за све методе."
PLG_LDAP_FIELD_SEARCHSTRING_LABEL="Стринг за претрагу"
PLG_LDAP_FIELD_UID_DESC="LDAP атрибут који садржи ID за пријаву корисника. За Active Directory то је sAMAccountName."
PLG_LDAP_FIELD_UID_LABEL="Мапирање: ID корисника"
PLG_LDAP_FIELD_USERNAME_DESC="Корисничко име и лозинка за повезивање одређују параметре везе при тражењу DN-а. Доступне су две опције: анонимно тражење DN-а (оставите оба поља празна) и администраторско повезивање (корисничко име за повезивање је корисничко име администраторског налога, на пример Administrator). Ова поља се користе само за метод Bind and Search."
PLG_LDAP_FIELD_USERNAME_LABEL="Корисничко име за повезивање"
PLG_LDAP_FIELD_USERSDN_DESC="Кључна реч [username] замењује се податком за пријаву који корисник унесе. Пример стринга: uid=[username], dc=my-domain, dc=com. Можете користити више стрингова раздвојених тачком са зарезом. Користи се само за метод Bind Directly as User."
PLG_LDAP_FIELD_USERSDN_LABEL="Кориснички DN"
