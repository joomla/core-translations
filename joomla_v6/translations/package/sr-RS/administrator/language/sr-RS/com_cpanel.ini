COM_CPANEL_MSG_ADDNOSNIFF_BODY="<p>Џумла се сада испоручује са додатним безбедносним побољшањима у подразумеваним датотекама htaccess.txt и web.config.txt. Ова побољшања онемогућавају такозвано препознавање MIME типа садржаја (MIME-type sniffing) у веб прегледачима. Ова функција омогућава одређене врсте напада при којима се извршавају скрипте у иначе безопасним форматима датотека (нпр. сликама), што доводи до Cross-Site-Scripting рањивости.</p><p>Тим за безбедност препоручује да ручно примените неопходне измене на постојеће датотеке .htaccess или web.config, пошто се оне не могу аутоматски ажурирати.</p><p><strong>Измене за .htaccess</strong><br>Додајте следеће редове пре \"## Mod_rewrite in use.\":</p><pre>&lt;IfModule mod_headers.c&gt;\nHeader always set X-Content-Type-Options \"nosniff\"\n&lt;/IfModule&gt;</pre><p><strong>Измене за web.config</strong><br>Додајте следеће редове одмах после \"&lt;/rewrite&gt;\":</p><pre>&lt;httpProtocol&gt;\n  &lt;customHeaders&gt;\n    &lt;add name=\"X-Content-Type-Options\" value=\"nosniff\" /&gt;\n  &lt;/customHeaders&gt;\n&lt;/httpProtocol&gt;</pre>" ; Translators: Don't touch the code part in the message, Starting with ## Mod_rewrite &hellip;
COM_CPANEL_MSG_ADDNOSNIFF_TITLE="Безбедносно ажурирање .htaccess & web.config"
COM_CPANEL_MSG_HTACCESSSVG_BODY="<p>Од 3.9.21 Џумла се испоручује са додатним безбедносним правилом у подразумеваном htaccess.txt. Ово правило ће заштитити кориснике SVG датотека од потенцијалних рањивости "_QQ_"Cross-Site-Scripting (XSS)"_QQ_".<br>Тим за безбедност препоручује да ручно примените неопходне измене на било коју постојећу .htaccess датотеку, пошто се ова датотека не може аутоматски ажурирати.</p><p><strong>Промене за .htaccess</strong></p><pre>&lt;FilesMatch \"\.svg$\"&gt;\n  &lt;IfModule mod_headers.c&gt;\n    Header always set Content-Security-Policy \"script-src 'none'\"\n  &lt;/IfModule&gt;\n&lt;/FilesMatch&gt;</pre><p>Тренутно нам није познат метод за условно конфигурисање овога на IIS веб серверима, обратите се свом хостинг провајдеру за даљу помоћ.</p>"
COM_CPANEL_MSG_HTACCESSSVG_TITLE="Додатна XSS заштита за коришћење SVG датотека"
COM_CPANEL_MSG_LANGUAGEACCESS340_BODY="Од Џумла! 3.4.0 можда имате проблема са додатком Систем – језички филтер на вашој веб локацији. Да бисте их поправили, отворите <a href=\"index.php?option=com_languages&view=languages\">Менаџер језика</a> и ручно сачувајте сваки језик садржаја да бисте били сигурни да је ниво приступа сачуван."
COM_CPANEL_MSG_LANGUAGEACCESS340_TITLE="Имате могуће проблеме са вишејезичким поставкама"
COM_CPANEL_MSG_ROBOTS_BODY="У Џумли! 3.3 измењене су подразумеване датотеке robots.txt како би Гуглу подразумевано био омогућен приступ шаблонима и медијским датотекама ради побољшања SEO-а. Ова измена се не примењује аутоматски приликом надоградње, па се корисницима препоручује да прегледају измене у датотеци robots.txt.dist и примене их у својој датотеци robots.txt."
COM_CPANEL_MSG_ROBOTS_TITLE="Ажурирање robots.txt"
COM_CPANEL_MSG_STATS_COLLECTION_BODY="<p>Од Џумле! 3.5 додатак за статистику шаље анонимне податке пројекту Џумла. Шаљу се само верзија Џумле, верзија PHP-а, систем за управљање базом података и његова верзија, као и оперативни систем сервера.</p><p>Ови подаци се прикупљају како би будуће верзије Џумле могле да користе најновије могућности база података и PHP-а без негативног утицаја на велики број корисника. Потреба за тим постала је јасна када је Џумла! 3.3 увела безбедније Bcrypt лозинке, за које је био потребан најмање PHP 5.3.10.</p><p>Ради потпуне транспарентности и помоћи програмерима <a href=\"https://developer.joomla.org/about/stats.html\" target=\"_blank\" rel=\"noopener noreferrer\">ови подаци су јавно доступни.</a> API и графикони приказују верзије Џумле, верзије PHP-а и системе за управљање базама података који се користе.</p><p>Ако не желите да пројекту Џумла шаљете ове информације, можете да онемогућите додатак Систем - Статистика Џумле.</p>"
COM_CPANEL_MSG_STATS_COLLECTION_TITLE="Прикупљање статистике у Џумли"
COM_CPANEL_MSG_TEXTFILTER3919_BODY="<p>Као део прегледа нашег безбедносног тима, направили смо неке промене у подразумеваним подешавањима за глобалне текстуалне филтере у новој инсталацији Џумла. Подразумевана поставка за групе 'Јавно', 'Гост' и 'Регистровани' је сада 'Без HTML-а'. Пошто се ове промене примењују само на нове инсталације, топло препоручујемо да прегледате ове промене и ажурирате свој сајт са: Систем &rarr; Глобална конфигурација &rarr; Филтери за текст</p>"
COM_CPANEL_MSG_TEXTFILTER3919_TITLE="Ажуриране препоруке за текстуалне филтере"
