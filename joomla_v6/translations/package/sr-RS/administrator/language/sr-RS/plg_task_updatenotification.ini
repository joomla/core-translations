PLG_TASK_UPDATENOTIFICATION_EMAIL_DESC="Списак адреса е-поште које ће примати обавештења о ажурирању. Адресе раздвојте зарезима. Адресе МОРАЈУ припадати постојећим корисницима веб-сајта који имају овлашћења суперкорисника. Ако ниједна наведена адреса не припада суперкориснику или ако оставите поље празно, сви суперкорисници овог веб-сајта примиће обавештење о ажурирању."
PLG_TASK_UPDATENOTIFICATION_EMAIL_LBL="Адресе е-поште суперкорисника"
PLG_TASK_UPDATENOTIFICATION_SEND_TITLE="Joomla! Обавештења о ажурирању"
PLG_TASK_UPDATENOTIFICATION_SEND_DESC="Овај додатак повремено проверава доступност нове Јоомла! верзије. Када је пронађе, послаће вам имејл, подсећајући вас да извршите ажурирње. Е-поруку можете прилагодити на <a href=\"index.php?option=com_mails&view=templates&filter[extension]=plg_task_updatenotification\"> System &rarr; Шаблони поште </a>"
PLG_TASK_UPDATENOTIFICATION_LANGUAGE_OVERRIDE_DESC="Изаберите језик порука о ажурирању. Изаберите „Аутоматски“ да би се поруке слале на језику веб-сајта који је активан у тренутку слања."
PLG_TASK_UPDATENOTIFICATION_LANGUAGE_OVERRIDE_LBL="Језик е-поште"
PLG_TASK_UPDATENOTIFICATION_LANGUAGE_OVERRIDE_NONE="Аутоматски"
PLG_TASK_UPDATENOTIFICATION_EMAIL_BODY="Ова порука је послата аутоматизовано са вашег сајта,\n{SITENAME} - {URL} \n\n================================================================================\nАжурирање
ИНФОРМАЦИЈЕ\n================================================================================\n\nВаш сајт је детектовао да постоји нова верзија доступна за надоградњу.\n\nJoomla! верзија која је тренутно инсталирана је: {CURVERSION}\nJoomla! верзија која је доступна за ажурирање: {NEWVERSION}\n\nОва порука је послата да као подсетник.\nTJoomla представници вас НИКАДА неће контактирати на ову тему.\n\n================================================================================\nКо ми је послао ову емаил поруку?\n================================================================================\n\nОву имејл поруку је послао ваш сајт, {SITENAME}"
; You can use the following merge codes:
; {NEWVERSION}		New Joomla! version, e.g. 1.2.3
; {CURVERSION}		Currently installed Joomla! version, e.g. 1.2.0
; {SITENAME}		Site name, as set in Global Configuration.
; {URL}			URL of the site's frontend page.
; {LINK}		Update URL (link to com_joomlaupdate, will request login if the Super User isn't already logged in).
; {RELEASENEWS}		URL to the release news on joomla.org
; \n			Newline character. Use it to start a new line in the email.
