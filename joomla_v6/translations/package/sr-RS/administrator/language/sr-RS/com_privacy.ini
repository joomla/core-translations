COM_PRIVACY_CORE_CAPABILITY_COMMUNICATION_WITH_JOOMLA_ORG="Када је доступна мрежна веза, инсталирана Џумла ће покушати да комуницира са серверима joomla.org ради различитих функција, међу којима су:<ul><li>Провера доступних ажурирања Џумле</li><li>Приказ помоћи за екстензије језгра Џумле</li><li>Услуга „Инсталација са веба“ (укључује се по избору)</li><li>Сервер за прикупљање статистике (укључује се по избору)</li></ul>Као и код свих HTTP захтева, IP адреса вашег сервера биће пренета као део захтева. Информације о томе како Џумла обрађује податке на својим серверима потражите у нашој <a href=\"https://www.joomla.org/privacy-policy.html\" target=\"_blank\" rel=\"noopener noreferrer\">политици приватности</a>."
COM_PRIVACY_CORE_CAPABILITY_LOGGING_IP_ADDRESS="Систем евидентирања Џумле бележи IP адресу посетиоца чија активност доводи до уписивања поруке у датотеке евиденције. Ове датотеке служе за бележење различитих активности на сајту Џумле, укључујући информације о ажурирањима језгра, неуспелим покушајима пријављивања, необрађеним грешкама и информације намењене програмерима, као што је употреба застарелих API-ја. Формат ових датотека може да прилагоди свака екстензија која подешава систем евидентирања. Зато вам препоручујемо да преузмете и прегледате датотеке евиденције за свој сајт, које се налазе на путањи `%s`."
COM_PRIVACY_CORE_CAPABILITY_SESSION_IP_ADDRESS_AND_COOKIE="Сваки захтев ка сајту Џумле покреће сесију која чува IP адресу у подацима сесије и креира колачић сесије у корисниковом прегледачу. IP адреса се користи као безбедносна мера за заштиту од могућег неовлашћеног преузимања сесије. Овај податак се брише када сесија истекне и њени подаци буду очишћени. Назив колачића сесије заснива се на насумично генерисаној хеш вредности и зато нема сталан идентификатор. Колачић сесије се уклања када сесија истекне или корисник затвори прегледач."
