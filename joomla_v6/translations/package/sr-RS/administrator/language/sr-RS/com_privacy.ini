COM_PRIVACY_EMAIL_ADMIN_REQUEST_BODY_EXPORT_REQUEST="Администратор сајта {URL} креирао је захтев за извоз личних података повезаних са овом имејл адресом. Из безбедносних разлога морате да потврдите да је ово важећи захтев за извоз ваших личних података са овог сајта.\n\nАко је захтев креиран грешком, занемарите овај имејл и ништа се неће догодити.\n\nДа бисте потврдили захтев, изаберите једну од следећих могућности:\n\n1. Отворите следећи URL: {TOKENURL}\n\n2. Копирајте токен из овог имејла, отворите наведену URL адресу и налепите токен у образац.\nURL: {FORMURL}\nТокен: {TOKEN}\n\nИмајте у виду да овај токен важи само 24 сата од тренутка слања овог имејла."
COM_PRIVACY_EMAIL_ADMIN_REQUEST_BODY_REMOVE_REQUEST="Администратор сајта {URL} креирао је захтев за уклањање свих личних података повезаних са овом имејл адресом. Из безбедносних разлога морате да потврдите да је ово важећи захтев за уклањање ваших личних података са овог сајта.\n\nАко је захтев креиран грешком, занемарите овај имејл и ништа се неће догодити.\n\nДа бисте потврдили захтев, изаберите једну од следећих могућности:\n\n1. Отворите следећи URL: {TOKENURL}\n\n2. Копирајте токен из овог имејла, отворите наведену URL адресу и налепите токен у образац.\nURL: {FORMURL}\nТокен: {TOKEN}\n\nИмајте у виду да овај токен важи само 24 сата од тренутка слања овог имејла."
