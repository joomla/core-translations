COM_PRIVACY_POSTINSTALL_BODY="<p>Увођењем GDPR прописа за грађане ЕУ и сличних регулатива широм света, може бити неопходно да затражите сагласност пре чувања било каквих <strong>личних података</strong> корисника.</p><p>Joomla 3.9 доноси нове могућности које вам помажу у креирању политика приватности сајта и прикупљању сагласности корисника. Поред тога, доступан је и ток рада који вам помаже у управљању захтевима корисника, као што су захтеви за брисање њихових личних података са вашег сајта.</p><p>За више информација о овој функцији погледајте <a href='https://guide.joomla.org/user-manual/privacy' target='_blank' rel='noopener noreferrer'>документацију о приватности</a>.</p>"
