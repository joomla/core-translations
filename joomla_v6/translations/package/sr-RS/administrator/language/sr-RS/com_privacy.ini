COM_PRIVACY_MSG_CAPABILITIES_INTRODUCTION="Информације на овом екрану прикупљају се од екстензија које овом систему пријављују своје могућности у вези са приватношћу. Сврха овог приказа је да власницима сајтова пружи увид у могућности инсталираних екстензија и информације које ће им помоћи да саставе правила свог сајта, као што је политика приватности. Пошто овај приказ захтева да екстензије подржавају систем извештавања и приказује само информације из омогућених екстензија, овај списак не треба сматрати потпуним. За више информација погледајте документацију сваке екстензије."
