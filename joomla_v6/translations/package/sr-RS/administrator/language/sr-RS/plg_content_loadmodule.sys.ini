PLG_CONTENT_LOADMODULE="Садржај - учитај модуле"
PLG_LOADMODULE_XML_DESCRIPTION="Унутар садржаја овај додатак учитава модул по ID-у, синтакса: {loadmoduleid 1}; по позицији, синтакса: {loadposition user1}; или по називу, синтакса: {loadmodule mod_login}. Опционо можете навести стил модула, а за loadmodule и одређени модул по наслову, синтакса: {loadmodule mod_login,module title,style}."

