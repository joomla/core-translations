COM_CONFIG_TEXT_FILTERS_DESC="Ова подешавања филтера текста примењују се на сва поља уређивача текста у изабраним групама.<br>Филтери вам дају већу контролу над HTML-ом који аутори уносе. Подесите строжа или блажа правила према потребама свог веб-сајта. Филтрирање се укључује по избору, а подразумевана подешавања пружају добру заштиту од HTML тагова који се често користе у нападима на веб-сајтове."
