JLIB_RULES_SETTING_NOTES_COM_CONFIG="Ако промените подешавање, оно ће се применити на ову и све подређене групе, као и на компоненте и садржај. Имајте на уму:<br><em><strong>Наслеђено</strong></em> значи да се примењују дозволе надређене групе.<br><em><strong>Одбијено</strong></em> значи да група коју уређујете не може да изврши ову радњу без обзира на подешавање надређене групе.<br><em><strong>Дозвољено</strong></em> значи да група коју уређујете може да изврши ову радњу (ако је подешавање у сукобу са подешавањем надређене групе, промена неће имати дејства; у одељку „Израчуната подешавања“ стајаће <em><strong>Није дозвољено (Закључано)</strong></em>).<br><em><strong>Није подешено</strong></em> користи се само за групу „Јавно“ у глобалној конфигурацији. Та група је надређена свим осталим групама. Ако дозвола није подешена, радња се сматра одбијеном, али се дозвола може променити за подређене групе, компоненте, категорије и ставке." ; Alternate language strings for the rules form field

