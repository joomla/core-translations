COM_GUIDEDTOURS_TOUR_WHATSNEW_6_2_DESCRIPTION="<h1 class=\"fw-medium\">Üdvözöljük a Joomla 6.2-ben!</h1><div class=\"row align-items-center pt-4\"><h2 class=\"mb-3\">A rendszer újdonságai</h2><div class=\"col-12 mb-3\"><h3>Továbbfejlesztett tartalomszerkesztés</h3><ul><li><strong>Médiakezelő és „Bővebben” funkciók integrációja</strong>: A képek és médiafájlok beszúrása egyszerűbbé vált a frissített választónak köszönhetően, amely mostantól a Joomla Médiakezelőjét nyitja meg, az új „Bővebben” gomb pedig gyorsabbá teszi a cikkek felosztását.</li><li><strong>Külön kép- és ábraosztályok</strong>: A cikkek bevezető és teljes szövegében szereplő képekhez külön CSS-osztály adható meg magához a képhez, illetve az azt körülvevő ábraelemhez.</li></ul></div></div><div class=\"row align-items-center pt-1\"><div class=\"col-md-6 col-lg-7 mb-4\"><img class=\"img-fluid d-block mx-auto\" src=\"media/com_guidedtours/images/6_2/sublevel_menu.jpg\" alt=\"Többszintű menük\" width=\"383\" height=\"280\"></div><div class=\"col-md-6 col-lg-5\"><h3>Webhelyoldali sablon (Cassiopeia)</h3><ul><li><strong>Többszintű legördülő menük</strong>: A Cassiopeia menüi mostantól több almenüszintet is támogatnak a legördülő és összecsukható elrendezésekben.</li></ul></div></div><div class=\"row align-items-center pt-1\"><div class=\"col-md-6 col-lg-7 my-3\"><h3>Modulok és weboldal-beállítások</h3><ul class=\"mb-3\"><li><strong>A mod_login modul hivatkozásainak megjelenítése</strong>: Az új beállítások lehetővé teszik a rendszergazdák számára, hogy sablonfelülírás nélkül elrejtsék az „Elfelejtette a jelszavát?” és az „Elfelejtette a felhasználónevét?” hivatkozásokat. Alapértelmezés szerint a hivatkozások megjelennek, így a meglévő weboldalak működését ez nem befolyásolja.</li><li><strong>Biztonsági jelölés a bővítményfrissítéseknél</strong>: A fejlesztők egy kiadást biztonsági frissítésként jelölhetnek meg, a „Nincs” és a „Kritikus” közötti súlyossági szintek valamelyikével. A megjelölt frissítések kiemelve jelennek meg a Rendszer -&gt; Frissítés -&gt; Bővítmények oldalon és a vezérlőpult gyorsikonjánál.</li></ul></div><div class=\"col-md-6 col-lg-5\"><img class=\"img-fluid d-block mx-auto\" src=\"media/com_guidedtours/images/6_2/security_warning.jpg\" alt=\"Biztonsági jelölések a bővítményeknél\" width=\"488\" height=\"144\"></div></div>"
COM_GUIDEDTOURS_TOUR_WHATSNEW_6_2_TITLE="Újdonságok a Joomla 6.2-ben!"

