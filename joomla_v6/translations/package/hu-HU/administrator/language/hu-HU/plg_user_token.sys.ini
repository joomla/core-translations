PLG_USER_TOKEN="Felhasználó - Joomla API-token"
PLG_USER_TOKEN_ALLOWEDUSERGROUPS_DESC="Melyik Joomla felhasználói csoport használhatja a Joomla tokeneket a Joomla API alkalmazás hitelesítéséhez. Azt is vezérli, hogy mely felhasználói csoportok látják a Joomla tokenek kezelőfelületet a felhasználói profiljukban. Alapértelmezett: A Joomla beépített Super User csoportja (8-as azonosítójú felhasználói csoport)."
PLG_USER_TOKEN_ALLOWEDUSERGROUPS_LABEL="Engedélyezett felhasználócsoportok"
PLG_USER_TOKEN_XML_DESCRIPTION="Lehetővé teszi a Joomla API alkalmazás hitelesítéséhez használt biztonsági tokenek kezelését (távoli hozzáférés a weboldalhoz). Ezek a tokenek szigorúan személyesek. Megtekintheti saját tokenjét, de más felhasználók tokenjeit csak letilthatja vagy visszaállíthatja."

