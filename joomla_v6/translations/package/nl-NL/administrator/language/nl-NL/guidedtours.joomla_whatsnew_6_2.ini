COM_GUIDEDTOURS_TOUR_WHATSNEW_6_2_DESCRIPTION="<h1 class=\"fw-medium\">Welkom bij Joomla 6.2!</h1><div class=\"row align-items-center pt-4\"><h2 class=\"mb-3\">Core updates</h2><div class=\"col-12 mb-3\"><h3>Content bewerken upgrades</h3><ul><li><strong>Mediabeheer/Verder lezen integraties</strong>: Toevoegen van afbeeldingen en media is makkelijker geworden via de bijgewerkte Ophaler die nu Joomla Media beheer opent en de nieuwe Lees meer knop biedt een snellere manier om artikel afbrekingen in te voeren.</li><li><strong>Scheid afbeelding en figure classes</strong>: Artiekel intro/volledige tekst afbeeldingen hebben nu onafhankelijke CSS class fvelden voor de afbeelding en het omliggende figure element.</li></ul></div></div><div class=\"row align-items-center pt-1\"><div class=\"col-md-6 col-lg-7 mb-4\"><img class=\"img-fluid d-block mx-auto\" src=\"media/com_guidedtours/images/6_2/sublevel_menu.jpg\" alt=\"Sublevel menus\" width=\"383\" height=\"280\"></div><div class=\"col-md-6 col-lg-5\"><h3>Front-End Template (Cassiopeia)</h3><ul><li><strong>Multi-level dropdown menu's</strong>: Cassiopeia menus ondersteunen nu meer dan een sublevel in dropdown/collapsible layouts.</li></ul></div></div><div class=\"row align-items-center pt-1\"><div class=\"col-md-6 col-lg-7 my-3\"><h3>Modules &amp; Site instellingen</h3><ul class=\"mb-3\"><li><strong>mod_login link toggles</strong>: Nieuwe opties laten beheerders de “Wachtwoord vergeten?” en “Gebruikersnaam vergeten?” links verbergen zonder template override. Default is laten zien, er zijn dus geen consequenties voor bestaande sites.</li><li><strong>Veiliheid waarschuwingsvlaggen voor extensie updates</strong>: Ontwikkelaars kunnen een release aanmerken als beveiligingsupdate (severity Niet tot Kritiek); updates worden aangemerkt in Systeem -&gt; Update -&gt; Extensies en op het Dashboard snelle icoon.</li></ul></div><div class=\"col-md-6 col-lg-5\"><img class=\"img-fluid d-block mx-auto\" src=\"media/com_guidedtours/images/6_2/security_warning.jpg\" alt=\"Security tags on extensions\" width=\"488\" height=\"144\"></div></div>"
COM_GUIDEDTOURS_TOUR_WHATSNEW_6_2_TITLE="Wat is er nieuw in Joomla 6.2!"

