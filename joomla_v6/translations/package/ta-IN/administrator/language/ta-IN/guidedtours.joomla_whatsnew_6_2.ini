COM_GUIDEDTOURS_TOUR_WHATSNEW_6_2_DESCRIPTION="<h1 class=\"fw-medium\"> Joomla! 6.2 தங்களை வரவேற்கிறது!</h1><div class=\"row align-items-center pt-4\"><h2 class=\"mb-3\">அடிப்படைப் புதுப்பிப்புகள் (Core Updates)</h2><div class=\"col-12 mb-3\"><h3>உள்ளடக்கம் தொகுத்தல் மேம்பாடுகள்</h3><ul><li><strong>ஊடகம் மேலாளர்/மேலும் படிக்க ஒருங்கிணைப்புகள்</strong>: Joomla ஊடக மேலாளர்-ஐத் திறக்கும் மேம்படுத்தப்பட்ட 'தேர்ந்தெடுப்பி' (picker) மூலம் படங்கள் மற்றும் ஊடகங்களைச் சேர்ப்பது எளிதாகியுள்ளது; அத்துடன், புதிய 'மேலும் படிக்க' ('Read More') பொத்தான் கட்டுரைகளில் இடைவெளியை (article break) விரைவாகச் சேர்க்க உதவுகிறது.</li><li><strong>தனி, படம் (image) மற்றும் உருவம் (figure) classes</strong>: கட்டுரையின் அறிமுக/முழு-உரையிலுள்ள படங்களுக்கு, அந்தப் படம் மற்றும் அதைச் சுற்றியுள்ள 'figure' மூலகம் ஆகியவற்றுக்குத் தனித்தனி CSS class புலங்கள் தற்போது உள்ளன.</li></ul></div></div><div class=\"row align-items-center pt-1\"><div class=\"col-md-6 col-lg-7 mb-4\"><img class=\"img-fluid d-block mx-auto\" src=\"media/com_guidedtours/images/6_2/sublevel_menu.jpg\" alt=\"Sublevel menus\" width=\"383\" height=\"280\"></div><div class=\"col-md-6 col-lg-5\"><h3>முன்புற வார்ப்புரு (காசியோபியா)</h3><ul><li><strong>பல-நிலை கீழ்த்தொங்கு பட்டிகள்</strong>: காசியோபியா (Cassiopeia) பட்டிகள் தற்போது கீழ்த்தொங்கு (dropdown) அல்லது சுருக்கக்கூடிய (collapsible) வடிவமைப்புகளில் ஒன்றுக்கு மேற்பட்ட உப-நிலைகளை ஆதரிக்கின்றன.</li></ul></div></div><div class=\"row align-items-center pt-1\"><div class=\"col-md-6 col-lg-7 my-3\"><h3>கூறகங்கள் &amp; தள உள்ளமைவு</h3><ul class=\"mb-3\"><li><strong>mod_login இணைப்பு நிலைமாற்றிகள்</strong>: புதிய விருப்புகள், வார்ப்புரு மீறல் (template override) இல்லாமலேயே "_QQ_"தங்கள் கடவுச்சொல்லை மறந்து விட்டீர்களா?"_QQ_" மற்றும் "_QQ_"தங்கள் பயனாளர்பெயரை மறந்துவிட்டீர்களா?"_QQ_" ஆகிய இணைப்புகளை மறைக்க நிர்வாகிகளை அனுமதிக்கின்றன. இயல்புநிலையாகவே 'காட்டுக' (Show) என அமைக்கப்பட்டுள்ளதால், ஏற்கனவே உள்ள தளங்களில் எந்தப் பாதிப்பும் இருக்காது.</li><li><strong> நீட்சிப் புதுப்பிப்புகளுக்கான பாதுகாப்புக்குறி</strong>: உருவாக்குபவர்கள் ஒரு வெளியீட்டைப் பாதுகாப்புப் புதுப்பிப்பாக (தீவிரம் ஏதுமில்லை [None] முதல் மிக இக்கட்டானது [Critical] வரை) குறியிடலாம்; குறியிடப்பட்ட புதுப்பிப்புகள் தொகுதி &amp;rarr; புதுப்பிக்க &amp;darr; நீட்சிகள் என்பதிலும், முகப்புப்பெட்டி துரிதப் படிமத்திலும் கவனயீர்ப்பாகக் காட்டப்படும்.</li></ul></div><div class=\"col-md-6 col-lg-5\"><img class=\"img-fluid d-block mx-auto\" src=\"media/com_guidedtours/images/6_2/security_warning.jpg\" alt=\"Security tags on extensions\" width=\"488\" height=\"144\"></div></div>"
COM_GUIDEDTOURS_TOUR_WHATSNEW_6_2_TITLE="Joomla! 6.2 இல் என்ன புதியது!"

