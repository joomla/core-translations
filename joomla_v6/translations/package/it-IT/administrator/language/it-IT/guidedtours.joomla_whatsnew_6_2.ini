COM_GUIDEDTOURS_TOUR_WHATSNEW_6_2_DESCRIPTION="<h1 class=\"fw-medium\">Benvenuto in Joomla 6.2!</h1><div class=\"row align-items-center pt-4\"><h2 class=\"mb-3\">Aggiornamenti del core</h2><div class=\"col-12 mb-3\"><h3>Miglioramenti nella modifica dei contenuti</h3><ul><li><strong>Integrazione con Gestione media e Leggi tutto</strong>: aggiungere immagini e media è ora più semplice grazie al selettore aggiornato, che apre direttamente la Gestione media di Joomla, mentre il nuovo pulsante Leggi tutto offre un modo più rapido per inserire l'interruzione dell'articolo.</li><li><strong>Classi separate per immagine e figure</strong>: le immagini introduttive e dell'articolo completo hanno ora campi classe CSS indipendenti per l'immagine e per l'elemento figure che la contiene.</li></ul></div></div><div class=\"row align-items-center pt-1\"><div class=\"col-md-6 col-lg-7 mb-4\"><img class=\"img-fluid d-block mx-auto\" src=\"media/com_guidedtours/images/6_2/sublevel_menu.jpg\" alt=\"Menu con sottolivelli\" width=\"383\" height=\"280\"></div><div class=\"col-md-6 col-lg-5\"><h3>Template del frontend (Cassiopeia)</h3><ul><li><strong>Menu a discesa multilivello</strong>: i menu di Cassiopeia ora supportano più di un sottolivello nei layout a discesa e comprimibili.</li></ul></div></div><div class=\"row align-items-center pt-1\"><div class=\"col-md-6 col-lg-7 my-3\"><h3>Moduli &amp; configurazione del sito</h3><ul class=\"mb-3\"><li><strong>Visibilità dei link in mod_login</strong>: nuove opzioni permettono agli amministratori di nascondere i link “Password dimenticata?” e “Nome utente dimenticato?” senza ricorrere a un override del template. L'impostazione predefinita è Mostra, quindi non ci sono effetti sui siti esistenti.</li><li><strong>Indicatore di sicurezza per gli aggiornamenti delle estensioni</strong>: gli sviluppatori possono contrassegnare una release come aggiornamento di sicurezza (con gravità da Nessuna a Critica); gli aggiornamenti contrassegnati vengono evidenziati in Sistema -&gt; Aggiornamenti -&gt; Estensioni e nell'icona rapida del Pannello di controllo.</li></ul></div><div class=\"col-md-6 col-lg-5\"><img class=\"img-fluid d-block mx-auto\" src=\"media/com_guidedtours/images/6_2/security_warning.jpg\" alt=\"Etichette di sicurezza sulle estensioni\" width=\"488\" height=\"144\"></div></div>"
COM_GUIDEDTOURS_TOUR_WHATSNEW_6_2_TITLE="Cosa c'è di nuovo in Joomla 6.2!"

