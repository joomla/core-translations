COM_GUIDEDTOURS_TOUR_WHATSNEW_6_1_DESCRIPTION="<h1 class=\"fw-medium\">Selamat datang ke Joomla 6.1!</h1><p>Joomla 6.1 memperkenalkan penambahbaikan penting yang menjadikan pembinaan laman lebih mudah, selamat dan fleksibel.</p><h2>Perlindungan Spam dengan CAPTCHA Proof-of-Work</h2><p>CAPTCHA ini mesra privasi, mudah dicapai dan menyelesaikan teka-teki matematik secara senyap di latar belakang.</p><h2>Editor Aliran Kerja Visual</h2><p>Urus aliran kerja kandungan dengan lebih mudah melalui rajah interaktif yang menunjukkan keseluruhan proses penerbitan.</p><h2>Tiga Medan Media Baharu: Audio, Video dan Dokumen</h2><p>Medan tersuai kini boleh memaparkan audio, video atau pautan dokumen, bukan imej sahaja.</p><h2>Modul Lebih Pintar</h2><p>Sejarah versi kini tersedia untuk modul dan tika modul boleh dikaitkan merentas bahasa seperti artikel.</p><h2>Penambahbaikan Lain</h2><ul><li>Sokongan singkatan <strong>&lt;abbr&gt;</strong> dalam editor teks TinyMCE.</li><li>Penunjuk status dan penciptaan pantas untuk penggantian bahasa.</li></ul>"
COM_GUIDEDTOURS_TOUR_WHATSNEW_6_1_TITLE="Apakah yang baharu dalam Joomla 6.1!"
