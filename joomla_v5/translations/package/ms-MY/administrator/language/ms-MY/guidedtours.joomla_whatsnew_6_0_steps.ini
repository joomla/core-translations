COM_GUIDEDTOURS_TOUR_WHATSNEW_6_0_STEP_0_DESCRIPTION="<h2>Kemas Kini Lain</h2><p>Artikel pilihan kini berkongsi paparan Pengurus Artikel.</p><h3>Jika anda terlepas</h3><p>Joomla! 6 menyokong kemas kini automatik dengan The Update Framework (TUF) untuk keselamatan dan prestasi yang lebih baik.</p><h3>Penambahbaikan dan Pembetulan Lain</h3><ul><li>E-mel pemberitahuan apabila pendaftaran pentadbir diluluskan.</li><li>Kelas tersuai dalam senarai kelas dialog imej TinyMCE.</li><li>Keupayaan membuang tag secara kelompok.</li><li>Dan banyak lagi penambahbaikan dalaman.</li></ul>"
COM_GUIDEDTOURS_TOUR_WHATSNEW_6_0_STEP_0_TITLE="Ciri-ciri Lain"
COM_GUIDEDTOURS_TOUR_WHATSNEW_6_0_STEP_1_DESCRIPTION="<h3>Maklumat Keluaran Joomla 6.0</h3><p><a title=\"Maklumat keluaran\" href=\"https://6.joomla.org/\" target=\"_blank\" rel=\"noopener noreferrer\">Lihat maklumat keluaran di 6.joomla.org</a></p><hr><h3>Bantuan dan Maklumat</h3><p>Pelbagai sumber bantuan, dokumentasi, sokongan dan maklumat penyertaan dalam Joomla tersedia di sini.</p>"
