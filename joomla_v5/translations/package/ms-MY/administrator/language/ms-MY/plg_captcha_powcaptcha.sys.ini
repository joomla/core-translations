PLG_CAPTCHA_POWCAPTCHA_XML_DESCRIPTION="Plugin CAPTCHA ini memaparkan tugasan matematik yang boleh diselesaikan secara automatik oleh pelayar pengguna. Ia bukan bertujuan membuktikan pengguna ialah manusia, tetapi membuktikan pengguna sanggup meluangkan masa yang diperlukan untuk menyelesaikan tugasan. Kini berasaskan pustaka Altcha (altcha.org)."
