COM_GUIDEDTOURS_TOUR_WHATSNEW_6_2_DESCRIPTION="<h1 class=\"fw-medium\">Selamat datang ke Joomla 6.2!</h1><div class=\"row align-items-center pt-4\"><h2 class=\"mb-3\">Kemas Kini Teras</h2><div class=\"col-12 mb-3\"><h3>Penambahbaikan Penyuntingan Kandungan</h3><ul><li><strong>Integrasi Pengurus Media dan Baca Selanjutnya</strong>: Menambah imej dan media kini lebih mudah dengan pemilih baharu yang membuka Pengurus Media Joomla. Butang Baca Selanjutnya yang baharu pula memudahkan sisipan pemisah artikel.</li><li><strong>Kelas imej dan figure berasingan</strong>: Imej pengenalan dan teks penuh artikel kini mempunyai medan kelas CSS berasingan untuk imej dan elemen figure di sekelilingnya.</li></ul></div></div><div class=\"row align-items-center pt-1\"><div class=\"col-md-6 col-lg-7 mb-4\"><img class=\"img-fluid d-block mx-auto\" src=\"media/com_guidedtours/images/6_2/sublevel_menu.jpg\" alt=\"Menu aras bawah\" width=\"383\" height=\"280\"></div><div class=\"col-md-6 col-lg-5\"><h3>Templat Bahagian Hadapan (Cassiopeia)</h3><ul><li><strong>Menu juntai bawah berbilang aras</strong>: Menu Cassiopeia kini menyokong lebih daripada satu aras submenu dalam susun atur juntai bawah dan boleh lipat.</li></ul></div></div><div class=\"row align-items-center pt-1\"><div class=\"col-md-6 col-lg-7 my-3\"><h3>Modul dan Konfigurasi Laman</h3><ul class=\"mb-3\"><li><strong>Pilihan pautan mod_login</strong>: Pilihan baharu membolehkan pentadbir menyembunyikan pautan “Terlupa kata laluan?” dan “Terlupa nama pengguna?” tanpa penggantian templat. Tetapan lalai ialah Papar, jadi laman sedia ada tidak terjejas.</li><li><strong>Penanda keselamatan untuk kemas kini sambungan</strong>: Pembangun boleh menandakan keluaran sebagai kemas kini keselamatan dengan tahap daripada Tiada hingga Kritikal. Kemas kini bertanda akan diserlahkan di Sistem -&gt; Kemas Kini -&gt; Sambungan dan pada ikon pantas papan pemuka.</li></ul></div><div class=\"col-md-6 col-lg-5\"><img class=\"img-fluid d-block mx-auto\" src=\"media/com_guidedtours/images/6_2/security_warning.jpg\" alt=\"Tag keselamatan pada sambungan\" width=\"488\" height=\"144\"></div></div>"
COM_GUIDEDTOURS_TOUR_WHATSNEW_6_2_TITLE="Apa yang Baharu dalam Joomla 6.2!"
