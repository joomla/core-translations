JGLOBAL_FILTER_TYPE_DESC="<p>1. Senarai Larangan membenarkan semua tag dan atribut kecuali yang disenaraikan.<br><strong>--</strong> Tag untuk Senarai Larangan Lalai termasuk: 'applet', 'body', 'bgsound', 'base', 'basefont', 'canvas', 'embed', 'frame', 'frameset', 'head', 'html', 'id', 'iframe', 'ilayer', 'layer', 'link', 'meta', 'name', 'object', 'script', 'style', 'title', 'xml'<br><strong>--</strong> Atribut untuk Senarai Larangan Lalai termasuk: 'action', 'background', 'codebase', 'dynsrc', 'lowsrc', 'formaction'<br><strong>--</strong> Anda boleh melarang tag dan atribut tambahan dengan menambahkannya ke medan Tag Tapis dan Atribut Tapis, dipisahkan dengan koma.<br><strong>--</strong> Senarai Larangan Tersuai membolehkan anda mengatasi Senarai Larangan Lalai. Tambah tag dan atribut yang hendak dilarang dalam medan Tag Tapis dan Atribut Tapis.</p><p>Senarai Dibenarkan hanya membenarkan tag yang disenaraikan dalam medan Tag Tapis dan Atribut Tapis.</p><p>Tiada HTML membuang semua tag HTML daripada kandungan apabila ia disimpan.</p><p>Ambil perhatian bahawa tetapan ini berfungsi tanpa mengira editor yang digunakan. <br>Walaupun anda menggunakan editor WYSIWYG, tetapan penapisan mungkin membuang tag dan atribut tambahan sebelum maklumat disimpan dalam pangkalan data.</p>"
