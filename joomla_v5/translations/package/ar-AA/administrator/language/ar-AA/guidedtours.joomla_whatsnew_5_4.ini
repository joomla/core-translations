COM_GUIDEDTOURS_TOUR_WHATSNEW_5_4_DESCRIPTION="<h1 class=\"fw-medium\">أهلاً بك في Joomla 5.4!</h1><div class=\"row align-items-center border-top border-1 pt-4\"><div class=\"col-md-6 col-lg-5 text-center text-md-start mb-3 mb-md-0\"><img class=\"img-fluid\" src=\"media/com_guidedtours/images/5_4/automated-updates.jpg\" alt=\"عرض إشعار لوحة التحكم حيث يمكنك رؤية أيقونة التحديثات التلقائية الجديدة لتفعيلها\" width=\"774\" height=\"281\"></div><div class=\"col-md-6 col-lg-7 mb-3\"><h2 class=\"mb-3\">وصلت ميزة التحديثات التلقائية!</h2><p>يدعم نظام Joomla 5.4 الآن التحديثات التلقائية لضمان أعلى مستويات الأمان والأداء.</p><p><strong>حافظ على أمان موقعك وحمايته!</strong></p></div></div>"
