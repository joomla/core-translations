PLG_LOADMODULE_XML_DESCRIPTION="يقوم هذا الملحق بتحميل وحدة ضمن المحتوى عبر معرف ID، بالصيغة: {loadmoduleid 1}، أو عبر موضعها، بالصيغة: {loadposition user1}، أو عبر اسمها البرمجي، بالصيغة: {loadmodule mod_login}. ويمكن اختيارياً تحديد نمط عرض الوحدة، وتحديد وحدة بعينها حسب العنوان في loadmodule، بالصيغة: {loadmodule mod_login,module title,style}."

