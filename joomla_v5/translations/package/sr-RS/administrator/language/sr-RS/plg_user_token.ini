PLG_USER_TOKEN="Корисник - Токен за Joomla API"
PLG_USER_TOKEN_COPY="Копирај"
PLG_USER_TOKEN_COPY_DESC="Копирајте токен у оставу"
PLG_USER_TOKEN_COPY_FAIL="Копирање токена није успело."
PLG_USER_TOKEN_COPY_SUCCESS="Токен је копиран."
PLG_USER_TOKEN_ENABLED_DESC="Изаберите „Не“ да бисте привремено спречили приступ свом веб-сајту помоћу овог токена."
PLG_USER_TOKEN_ENABLED_LABEL="Активно"
PLG_USER_TOKEN_GROUP_DESC="Управљајте безбедносним токенима за аутентификацију у апликацији Joomla API (удаљени приступ вашем веб-сајту). Ако нисте сигурни чему служе, вероватно вам нису потребни и ова подешавања можете да занемарите."
PLG_USER_TOKEN_GROUP_LABEL="Токен за Joomla API"
PLG_USER_TOKEN_NOTOKENFOROTHERPEOPLE_DESC="Можете да видите само свој токен. Токене других корисника можете да омогућите, онемогућите или замените, на пример ако сумњате да је неовлашћена особа дошла до њих."
PLG_USER_TOKEN_RESET_DESC="Изаберите „Да“ и сачувајте кориснички профил да бисте стари токен заменили новим."
PLG_USER_TOKEN_RESET_LABEL="Ресетуј"
PLG_USER_TOKEN_SAVEME_DESC="Још немате токен. Сачувајте кориснички профил да бисте генерисали токен. Вратите се на ову страницу да бисте видели токен и управљали њиме."
PLG_USER_TOKEN_SAVEMEFOROTHERPEOPLE_DESC="Овај корисник још нема токен. Када сачувате његов профил, генерисаће се нови токен. Из безбедносних разлога нећете моћи да га видите, али ћете моћи да га омогућите, онемогућите или замените."
PLG_USER_TOKEN_TOKEN_DESC="Ово је ваш токен. Користите га у апликацијама трећих страна којима је потребан удаљени приступ вашем веб-сајту преко апликације Joomla API."
PLG_USER_TOKEN_TOKEN_LABEL="Токен"
PLG_USER_TOKEN_XML_DESCRIPTION="Омогућава управљање безбедносним токенима за аутентификацију у апликацији Joomla API (удаљени приступ вашем веб-сајту). Токени су строго лични. Свој токен можете да видите, а токене других корисника можете само да онемогућите или замените."

