PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_8_INTROTEXT="<p><strong>Поносно представљамо Joomla верзију 5!</strong></p><p>Научите више о токовима рада у Joomla-и.</p>"
