PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_9_FIELD_0="Lorem ipsum dolor sit amet, consetetur sadipscing elitr, sed diam nonumy eirmod tempor invidunt ut labore et dolore magna aliquyam erat, sed diam voluptua."
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_9_INTROTEXT="<p> Токови рада управљају фазама кроз које ваши чланци морају проћи док не буду објављени. </p><p> Компонента за управљање токовима рада није подразумевано омогућена. </p><p> Да бисте видели ток рада који смо обезбедили са демонстрационим подацима, прво морате да омогућите ову функцију. </p><ol><li> Приступите администраторском делу </li><li> На картици „Садржај“ > „Чланци“ > „Опције“ > „Интеграција“ подесите „Омогући ток рада“ на „Да“ </li><li> Сачувајте измене </li></ol><p> Сада када поново приступите „Садржају“, видећете одељак „Токови рада“ </p><p> Када уређујете чланак, видећете и нове прелазе за чланке који се односе на токове рада. </p>"
