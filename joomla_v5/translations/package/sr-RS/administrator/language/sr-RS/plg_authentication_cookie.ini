PLG_AUTHENTICATION_COOKIE_PRIVACY_CAPABILITY_COOKIE="У комбинацији са додатком који подржава функцију \"Запамти ме\", као што је додатак \"Систем – Запамти ме\", овај додатак креира колачић у прегледачу корисника ако је поље за потврду \"Запамти ме\" изабрано приликом пријављивања на веб-сајт. Овај колачић се може препознати по префиксу `joomla_remember_me` и користи се за аутоматско пријављивање корисника када посете веб-сајт, а још нису пријављени."
PLG_AUTHENTICATION_COOKIE_XML_DESCRIPTION="<p>Обрађује аутентификацију корисника Џумле помоћу колачића.</p><p><strong>Упозорење! Морате имати омогућен барем још један додатак за аутентификацију.</strong><br>За пријављивање помоћу колачића биће вам потребан и додатак као што је Систем - Запамти ме.</p>"

