COM_USERS_POSTINSTALL_MULTIFACTORAUTH_BODY="<p>Joomla! долази са драстично побољшаном <a href=\"https://en.wikipedia.org/wiki/Multi-factor_authentication\" target=\"_blank\" rel=\"noopener noreferrer\">Вишефакторском аутентикацијом</a> и искуством да бисте осигурали пријаве својих корисника.</p><p>За разлику од претходних верзија Joomla CMS система, корисници <em>немају више потребу да уносе сигурносни код са својим корисничким именом и лозинком</em>. Вишефакторска аутентикација се обавља у посебном процесу и после пријаве уколико корисник не обави све потребне кораке неће бити у могућности да настави са коришћењем других страница на сајту које су намењене регистрованим корисницима и на тај начин се старамо да окружење буде отпорно на <a href=\"https://en.wikipedia.org/wiki/Phishing\" target=\"_blank\" rel=\"noopener noreferrer\">фишинг</a>&ndash;нападе. Такође омогућава интерактивно пријављивање са Windows Hello, Apple TouchID / Биометријску пријаву лицем, отисцима прстију и сличним механизмима за passkeys пријаве.</p>"
