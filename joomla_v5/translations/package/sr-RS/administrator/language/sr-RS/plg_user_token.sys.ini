PLG_USER_TOKEN="Корисник - Токен за Joomla API"
PLG_USER_TOKEN_ALLOWEDUSERGROUPS_DESC="Одређује које корисничке групе у Џумли могу да користе токене за аутентификацију у апликацији Joomla API. Одређује и којим групама се у корисничком профилу приказује одељак за управљање токенима. Подразумевано: уграђена група „Супер корисници“ – Super Users (User Group ID 8)."
PLG_USER_TOKEN_ALLOWEDUSERGROUPS_LABEL="Дозвољене корисничке групе"
PLG_USER_TOKEN_XML_DESCRIPTION="Омогућава управљање безбедносним токенима за аутентификацију у апликацији Joomla API (удаљени приступ вашем веб-сајту). Токени су строго лични. Свој токен можете да видите, а токене других корисника можете само да онемогућите или замените."

