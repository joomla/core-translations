COM_JOOMLAUPDATE_UPDATE_SUCCESS_MAIL_BODY="Ова е-пошта НИЈЕ послата од стране пројекта Joomla!. Аутоматски га шаље ваш сајт,\n{SITENAME} - {URL} \n\n==============================================================================\nИНФОРМАЦИЈЕ О АЖУРИРАЊУ\n================================================================================\nВаш сајт је успешно аутоматски ажуриран са {OLDVERSION} на {NEWVERSION}.\nМолимо вас да проверите свој сајт да ли има неочекиваног понашања или кварова.\nОву е-пошту вам шаље ваш сајт.\nJoomla! Пројекат вас никада неће директно контактирати.\n=============================================================================\nЗАШТО ДОБИЈАМ ОВУ ИМЕЈЛ ПОРУКУ?\n===============================================================================\nОву е-пошту је аутоматски послао Joomla!, софтвер који покреће ваш сајт.\nОмогућили сте аутоматска ажурирања на свом сајту и инсталација таквог ажурирања покреће ову поруку.\nАко не разумете шта Joomla! је и шта треба да урадите, молимо вас да не контактирате Joomla! пројекат.\nОни вам НЕ шаљу ову е-пошту и не могу вам помоћи. Уместо тога, контактирајте особу која је направила или управља вашим сајтом.\n============================================================================\nКО МИ ЈЕ ПОСАО ОВУ Е-ПОШТУ?\n===============================================================================\nОву е-пошту вам је послао ваш сајт, {SITENAME}"
