COM_JOOMLAUPDATE_ERRORMODAL_BODY_FORBIDDEN="<p>Џумла не може да комуницира са датотеком <code>administrator/components/com_joomlaupdate/extract.php</code> која обавља ажурирање. Најчешћи разлози су:</p><ul><li>Конфигурациона датотека сервера у корену веб-сајта, као што је <code>.htaccess</code> или <code>web.config</code>, спречава приступ датотеци.</li><li>Подешавања сервера спречавају приступ датотеци.</li><li>Власништво над датотеком или њене дозволе спречавају сервер да јој приступи.</li><li>Веб-сајт је иза балансера оптерећења или CDN-а чија подешавања спречавају приступ датотеци или блокирају слање команди.</li><li>Датотека је доступна, али заштита сервера, као што је mod_security2, блокира слање команди.</li></ul><p>Ако нисте сигурни у узрок, обратите се свом хостинг провајдеру.</p>"
COM_JOOMLAUPDATE_ERRORMODAL_BODY_INVALIDLOGIN="<p>Компонента за ажурирање Џумле не може исправно да комуницира са датотеком <code>administrator/components/com_joomlaupdate/extract.php</code> која обавља ажурирање. Најчешћи разлози су:</p><ul><li>Датотека <code>administrator/components/com_joomlaupdate/update.php</code> са упутствима за примену ажурирања није могла да се креира, на пример због проблема са дозволама.</li><li>Скрипта <code>extract.php</code> не може да прочита ту датотеку због проблема са дозволама.</li><li>Прегледач, мрежна опрема или сервер мења лозинку коју из безбедносних разлога шаљемо са сваким захтевом ка скрипти <code>extract.php</code></li></ul><p>Покушајте да користите други прегледач без инсталираних екстензија, по могућству на другом рачунару и преко другог интернет провајдера. Ако се грешка и даље јавља, обратите се свом хостинг провајдеру.</p>"
COM_JOOMLAUPDATE_ERRORMODAL_BODY_SERVERERROR="<p>Дошло је до грешке на серверу при примени ажурирања Џумле на ваш веб-сајт.</p><p>Могуће је да надоградња веб-сајта на нову верзију Џумле није завршена.</p>"
