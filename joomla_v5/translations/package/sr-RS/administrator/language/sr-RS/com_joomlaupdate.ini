COM_JOOMLAUPDATE_CONFIG_AUTOMATED_UPDATES_DESC="Аутоматска ажурирања су доступна само за сајтове који су јавно доступни на интернету. Ако је ваш сајт иза заштитног зида или није јавно доступан, као што је локално тестно окружење, мораћете ручно да ажурирате.<br><br><strong>Напомена:</strong> омогућавањем аутоматских ажурирања регистроваћете свој сајт на одговарајућој услузи коју пружа пројекат Joomla!.<br>Регистрација омогућава пројекту Joomla приступ информацијама о вашем сајту и серверском окружењу, тачније URL-у сајта, PHP верзији, типу и верзији базе података, верзији CMS-а и типу и верзији серверског ОС-а.<br>Ове информације се користе само за побољшање услуге."
