PLG_CONTENT_FIELDS="Садржај - Поља"
PLG_CONTENT_FIELDS_XML_DESCRIPTION="<p>Овај додатак омогућава приказ прилагођеног поља уметнутог помоћу додатка 'Дугме - Поља' или синтаксе: {field #} директно у област уређивача.</p><p><strong>Могућа синтакса:</strong></p><ul><li><code>{field 1}</code> приказује поље са ID 1</li><li><code>{field 1,foo}</code> приказује изабрано поље користећи алтернативни распоред 'foo'.</li><li><code>{fieldgroup 2}</code> приказује сва поља у групи поља са ID 2.</li></ul>"

