JGLOBAL_FILTER_TYPE_DESC="<p>1. Листа забрањених дозвољава све тагове и атрибуте осим наведених.<br><strong>--</strong> Подразумевана листа забрањених обухвата тагове: 'applet', 'body', 'bgsound', 'base', 'basefont', 'canvas', 'embed', 'frame', 'frameset', 'head', 'html', 'id', 'iframe', 'ilayer', 'layer', 'link', 'meta', 'name', 'object', 'script', 'style', 'title', 'xml'<br><strong>--</strong> Подразумевана листа забрањених обухвата атрибуте: 'action', 'background', 'codebase', 'dynsrc', 'lowsrc', 'formaction'<br><strong>--</strong> Додатне тагове и атрибуте можете забранити уносом у поља Тагови филтера и Атрибути филтера. Раздвојте називе зарезима.<br><strong>--</strong> Прилагођена листа забрањених замењује подразумевану листу. У поља Тагови филтера и Атрибути филтера унесите тагове и атрибуте које желите да забраните.</p><p>Листа дозвољених пропушта само оно што је наведено у пољима Тагови филтера и Атрибути филтера.</p><p>Опција Без HTML-а уклања све HTML тагове из садржаја приликом чувања.</p><p>Ова подешавања важе без обзира на то који уређивач користите. <br>Чак и ако користите WYSIWYG уређивач, филтер може да уклони додатне тагове и атрибуте пре уписа података у базу.</p>"
