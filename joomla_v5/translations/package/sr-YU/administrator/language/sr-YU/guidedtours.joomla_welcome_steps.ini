COM_GUIDEDTOURS_TOUR_WELCOMETOJOOMLA_STEP_MENUS_TITLE="Meni"

COM_GUIDEDTOURS_TOUR_WELCOMETOJOOMLA_STEP_QUICKACCESS_DESCRIPTION="<p>Kontrolne table omogućavaju brz pristup često korišćenim stranicama preko ikonica.</p><p>Svaki panel kontrolne table je administratorski modul koji se može prilagoditi preko ikonice za podešavanja <span class=\"icon-cogs\" aria-hidden=\"true\"></span>.<br>Tako možete podesiti kontrolne table sajta prema sopstvenim potrebama.</p>"

COM_GUIDEDTOURS_TOUR_WELCOMETOJOOMLA_STEP_NOTIFICATIONS_TITLE="Panel sa obaveštenjima"

COM_GUIDEDTOURS_TOUR_WELCOMETOJOOMLA_STEP_TOPBAR_DESCRIPTION="<p>Gornja traka prikazuje naslov prikazane stranice, tako da uvek znate gde se nalazite. Ostale stavke na gornjoj traci su opcioni moduli.</p><p>Tu se obično nalaze trenutna verzija Joomle i pristup dodatnim vođenim turama.</p><p>Poslednje stavke su obično link ka sajtu (frontend) i korisnički meni preko kojeg upravljate nalogom i odjavljujete se.</p>"

