PLG_USER_TOKEN="Korisnik - Joomla API Token"
PLG_USER_TOKEN_COPY="Kopiraj"
PLG_USER_TOKEN_COPY_DESC="Kopirajte token u privremenu memoriju"
PLG_USER_TOKEN_COPY_FAIL="Neuspelo kopiranje tokena."
PLG_USER_TOKEN_COPY_SUCCESS="Token je kopiran."
PLG_USER_TOKEN_ENABLED_DESC="Postavite na Ne da privremeno sprečite pristup vašem sajtu s ovim tokenom."
PLG_USER_TOKEN_ENABLED_LABEL="Aktivno"
PLG_USER_TOKEN_GROUP_DESC="Upravljajte bezbednosnim tokenima koji se koriste za autentifikaciju u Joomla API aplikaciji (daljinski pristup vašem sajtu). Ako niste sigurni šta ovo radi, verovatno vam ne treba i možete slobodno zanemariti ova podešavanja."
PLG_USER_TOKEN_GROUP_LABEL="Joomla API Token"
PLG_USER_TOKEN_NOTOKENFOROTHERPEOPLE_DESC="Ne možete videti token za korisnike osim za sebe. I dalje možete omogućiti, onemogućiti ili poništiti njihov token, npr. kada postoji sumnja da je njihov token procurio neovlašćenim osobama."
PLG_USER_TOKEN_RESET_DESC="Postavite na Da i sačuvajte svoj korisnički profil da biste generisali novi token koji će zameniti stari."
PLG_USER_TOKEN_RESET_LABEL="Poništi"
PLG_USER_TOKEN_SAVEME_DESC="Još nemate token. Sačuvajte svoj korisnički profil da biste generisali token. Vratite se na ovu stranicu da biste videli token i upravljali njime."
PLG_USER_TOKEN_SAVEMEFOROTHERPEOPLE_DESC="Ovaj korisnik još nema token. Ako sačuvate njegov profil, generisaće se novi token, ali ga nećete moći videti iz bezbednosnih razloga. I dalje ćete moći da omogućite, onemogućite ili poništite njegov token."
PLG_USER_TOKEN_TOKEN_DESC="Ovo je vaš token. Koristite ga u aplikacijama trećih strana koje zahtevaju daljinski pristup vašem sajtu putem Joomla API aplikacije."
PLG_USER_TOKEN_TOKEN_LABEL="Token"
PLG_USER_TOKEN_XML_DESCRIPTION="Omogućava upravljanje bezbednosnim tokenima koji se koriste za proveru autentičnosti u Joomla API aplikaciji (daljinski pristup vašem sajtu). Ovi tokeni su strogo lični. Možete videti sopstveni token, ali možete samo onemogućiti ili poništiti tokene drugih korisnika."

