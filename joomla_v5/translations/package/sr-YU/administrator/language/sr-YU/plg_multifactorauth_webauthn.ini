PLG_MULTIFACTORAUTH_WEBAUTHN="Višefaktorska autentifikacija - Passkeys"
PLG_MULTIFACTORAUTH_WEBAUTHN_ERR_CREATE_INVALID_LOGIN_REQUEST="Nevažeći zahtev za autentifikaciju."
PLG_MULTIFACTORAUTH_WEBAUTHN_ERR_CREATE_INVALID_PK="Passkey registracija nije uspela. Odgovor primljen od brauzera ne odgovara Javnom ključu koji je izdao server. Ovo znači da je neko probao da vas hakuje ili je nešto neispravno."
PLG_MULTIFACTORAUTH_WEBAUTHN_ERR_CREATE_INVALID_USER="Iz sigurnosnih razloga nije vam dozvoljeno da se registrujete putem passkeys-a u ime drugog korisnika."
PLG_MULTIFACTORAUTH_WEBAUTHN_ERR_CREATE_NO_ATTESTED_DATA="Nešto je krenulo po zlu ali nema više informacija o grešci u ovom trenutku. Pokušajte registraciju vašeg passkey-a."
PLG_MULTIFACTORAUTH_WEBAUTHN_ERR_CREATE_NO_PK="Server nije izdao javni ključ za passkey registraciju ali je primio passkey registracioni zahtev iz brauzera. Ovo znači da je neko pokušao da vas hakuje ili je nešto neispravno."
PLG_MULTIFACTORAUTH_WEBAUTHN_ERR_NOTAVAILABLE_BODY="Vaš brauzer ne podržava standard passkey. Još uvek nisu svi brauzeri kompatibilni sa passkey ključevima na svim uređajima."
