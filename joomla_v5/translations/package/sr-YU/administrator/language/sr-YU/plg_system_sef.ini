PLG_SEF_INDEXPHP_DESCRIPTION="Ova opcija omogućava strožije rukovanje 'index.php' u URL-ovima kada je u Globalnoj konfiguraciji omogućeno 'Koristi URL prepisivanje'. Uklanja 'index.php' ako ga URL još sadrži i preusmerava dolazne zahteve sa 'index.php' na verziju bez 'index.php'."
