PLG_SEF_ENFORCESUFFIX_DESCRIPTION="Kada je omogućeno i \"Dodaj sufiks URLu\", URL adrese bez sufiksa biće preusmerene na ispravne. Počev od verzije 6.0 ovo će biti standardno ponašanje, a ne opcija."
