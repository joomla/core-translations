PLG_TASK_UPDATENOTIFICATION="Zadatak - Joomla! obaveštenje o ažuriranju"
PLG_TASK_UPDATENOTIFICATION_EMAIL_DESC="Zarezom odvojena lista email adresa koje će primati obaveštenja o ažuriranju. Email adrese na ovoj listi MORAJU pripadati postojećim korisnicima ovog sajta koji imaju prava super korisnika. Ukoliko ni jedna email adresa sa liste ne pripada super korisniku, ili ako se polje ostavi prazno, svi super korisnici će primiti obaveštenje."
PLG_TASK_UPDATENOTIFICATION_EMAIL_LBL="Email adresa super administratora"
PLG_TASK_UPDATENOTIFICATION_SEND_TITLE="Obaveštenje o ažuriranju Joomla!"
PLG_TASK_UPDATENOTIFICATION_SEND_DESC="Ovaj zadatak periodično proverava dostupnost novih verzija Joomla! sistema. Kada se neka pronađe, poslaće vam email poruku kao podsetnik da ažurirate. Možete prilagoditi email poruku na <a href=\"index.php?option=com_mails&view=templates&filter[extension]=plg_task_updatenotification\">Sistem &rarr; Šabloni poruka.</a>"
PLG_TASK_UPDATENOTIFICATION_LANGUAGE_OVERRIDE_DESC="Odaberite jezik za e-poštu sa obaveštenjima o ažuriranju. Postavite na Automatski da biste ih poslali na jeziku sajta u to vreme."
PLG_TASK_UPDATENOTIFICATION_LANGUAGE_OVERRIDE_LBL="Jezik email poruka"
PLG_TASK_UPDATENOTIFICATION_LANGUAGE_OVERRIDE_NONE="Auto"
PLG_TASK_UPDATENOTIFICATION_EMAIL_BODY="Ovu email poruku NE šalje projekat Joomla!. Šalje je automatski vaš sopstveni sajt,\n{SITENAME} - {URL} \n\n================================================================================\nINFORMACIJE O AŽURIRANJU\n================================================================================\n\nVaš sajt je otkrio da je dostupna ažurirana verzija Joomla!.\n\nTrenutno instalirana verzija Joomla!: {CURVERSION}\nVerzija Joomla! dostupna za instalaciju: {NEWVERSION}\n\nOvu email poruku vam šalje vaš sajt da bi vas podsetio na ovu činjenicu.\nProjekat Joomla! vas nikada neće direktno kontaktirati o dostupnim ažuriranjima Joomla! na vašem sajtu.\n\n================================================================================\nUPUTSTVO ZA AŽURIRANJE\n================================================================================\n\nDa biste instalirali ažuriranje na {SITENAME}, izaberite sledeći link. (Ako URL nije link, kopirajte ga i nalepite u brauzer).\n\nLink za ažuriranje: {LINK}\n\nVesti o izdanju možete pronaći ovde: {RELEASENEWS}\n\n================================================================================\nZAŠTO DOBIJAM OVU EMAIL PORUKU?\n================================================================================\n\nOvu email poruku je automatski poslao dodatak koji obezbeđuje Joomla!, softver na kome radi vaš sajt.\nOvaj dodatak traži ažurirane verzije Joomla! i šalje obaveštenje email porukom njenim administratorima.\nDobijaćete više sličnih email poruka sa vašeg sajta dok ne ažurirate softver ili ne onemogućite ove poruke.\n\nDa biste onemogućili ove poruke, poništite objavljivanje dodatka 'Zadatak - Joomla! obaveštenje o ažuriranju' u upravljaču dodacima na vašem sajtu.\n\nAko ne razumete šta je Joomla! i šta treba da uradite, nemojte kontaktirati projekat Joomla!.\nOni vam NE šalju ovu email poruku i ne mogu da vam pomognu. Umesto toga, kontaktirajte osobu koja je izradila ili održava vaš sajt.\n\nAko ste vi osoba koja je izradila ili održava veb sajt, imajte na umu da je ovaj dodatak možda automatski aktiviran kada ste instalirali ili ažurirali Joomla! na svom sajtu.\n\n================================================================================\nKO MI JE POSLAO OVU EMAIL PORUKU?\n================================================================================\n\nOvu email poruku vam šalje vaš sopstveni sajt, {SITENAME}"
; You can use the following merge codes:
; {NEWVERSION}		New Joomla! version, e.g. 1.2.3
; {CURVERSION}		Currently installed Joomla! version, e.g. 1.2.0
; {SITENAME}		Site name, as set in Global Configuration.
; {URL}			URL of the site's frontend page.
; {LINK}		Update URL (link to com_joomlaupdate, will request login if the Super User isn't already logged in).
; {RELEASENEWS}		URL to the release news on joomla.org
; \n			Newline character. Use it to start a new line in the email.
PLG_TASK_UPDATENOTIFICATION_EMAIL_SUBJECT="Joomla! Dostupno je ažuriranje za {SITENAME} – {URL}"
