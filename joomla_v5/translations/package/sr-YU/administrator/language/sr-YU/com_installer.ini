COM_INSTALLER_MSG_WARNINGS_JOOMLATMPNOTSET="Joomla privremeni direktorijum nije podešen."
COM_INSTALLER_MSG_WARNINGS_JOOMLATMPNOTSETDESC="Ovaj direktorijum je mesto gde Joomla kopira ekstenziju, raspakuje je, a zatim se datoteke kopiraju u odgovarajuće direktorijume. Ako ova lokacija nije podešena u configuration.php ($tmp_path), nećete moći da otpremate ekstenzije. Kreirajte direktorijum u koji Joomla može da upisuje da biste rešili problem."
COM_INSTALLER_MSG_WARNINGS_JOOMLATMPNOTWRITEABLE="Joomla privremeni direktorijum nije upisiv ili ne postoji."
COM_INSTALLER_MSG_WARNINGS_JOOMLATMPNOTWRITEABLEDESC="Ovo može izazvati probleme prilikom otpremanja ekstenzija u Joomlu. Ako imate problema sa otpremanjem ekstenzija, uverite se da direktorijum definisan u datoteci configuration.php postoji, ili proverite '%s' i podesite da bude upisiv, pa proverite da li to rešava problem."
COM_INSTALLER_MSG_WARNINGS_LOWMEMORYDESC="PHP memorijski limit je postavljen ispod 16MB, što može izazvati probleme pri instalaciji velikih ekstenzija. Postavite memorijski limit na najmanje 32MB."
COM_INSTALLER_MSG_WARNINGS_LOWMEMORYWARN="Nizak PHP memorijski limit."
COM_INSTALLER_MSG_WARNINGS_MEDMEMORYDESC="PHP memorijski limit je postavljen ispod 24MB, što može izazvati probleme pri instalaciji velikih ekstenzija. Postavite memorijski limit na najmanje 32MB."
COM_INSTALLER_MSG_WARNINGS_MEDMEMORYWARN="Potencijalno nizak PHP memorijski limit."
COM_INSTALLER_MSG_WARNINGS_NONE="Nisu otkrivena upozorenja."
COM_INSTALLER_MSG_WARNINGS_NOTCOMPLETE="<h1>Upozorenje: Ažuriranje nije završeno!</h1><p>Ažuriranje je delimično urađeno. Uradite drugo ažuriranje da završite proces.</p>"
COM_INSTALLER_MSG_WARNINGS_PHPUPLOADNOTSET="PHP privremeni direktorijum nije postavljen"
COM_INSTALLER_MSG_WARNINGS_PHPUPLOADNOTSETDESC="Ovaj direktorijum PHP koristi za čuvanje otpremljene datoteke pre nego što Joomla može da joj pristupi. Iako to što direktorijum nije podešen nije uvek problem, ako imate poteškoća sa neprepoznavanjem manifest datoteka ili otpremljenih datoteka, podešavanje <code>upload_tmp_dir</code> u vašoj datoteci php.ini može da reši problem."
COM_INSTALLER_MSG_WARNINGS_PHPUPLOADNOTWRITEABLE="PHP privremeni direktorijum nije upisiv."
COM_INSTALLER_MSG_WARNINGS_PHPUPLOADNOTWRITEABLEDESC="Ovaj direktorijum, naveden u <code>upload_tmp_dir</code> u vašoj php.ini datoteci, nije upisiv za Joomla! instancu, što može izazvati probleme prilikom otpremanja ekstenzija u Joomlu. Ako imate problema sa otpremanjem ekstenzija, proverite '%s' i podesite da bude upisiv, pa proverite da li to rešava problem."
COM_INSTALLER_MSG_WARNINGS_SMALLPOSTSIZE="Mala PHP maksimalna POST veličina"
COM_INSTALLER_MSG_WARNINGS_SMALLPOSTSIZEDESC="Ovo je maksimalna količina podataka koja se može poslati POST-om na server. To uključuje slanje formi za članke, medije (slike, video zapise) i ekstenzije. Ova vrednost je manja od 16 MB što može uticati na otpremanje velikih ekstenzija. Ovo se podešava u php.ini pod post_max_size."
COM_INSTALLER_MSG_WARNINGS_SMALLUPLOADSIZE="Maksimalna veličina PHP datoteke za otpremanje je premala."
COM_INSTALLER_MSG_WARNINGS_SMALLUPLOADSIZEDESC="Maksimalna veličina datoteke za otpremanje postavljena je na manje od 16 MB, što može uticati na otpremanje velikih ekstenzija. Ovo se podešava u php.ini u podešavanjima upload_max_filesize i post_max_size vaših PHP podešavanja (nalaze se u datoteci php.ini i/ili .htaccess). Vrednost post_max_size mora biti veća od vrednosti upload_max_filesize."
COM_INSTALLER_MSG_WARNINGS_UPDATE_NOTICE="Pre ažuriranja uverite se da je ažuriranje kompatibilno sa vašom Joomla! instalacijom. <br>Preporučujemo da napravite <strong>rezervnu kopiju</strong> datoteka i baze podataka svog sajta pre nego što počnete sa ažuriranjem."
COM_INSTALLER_MSG_WARNINGS_UPLOADBIGGERTHANPOST="PHP veličina otpremanja veća od POST veličine."
COM_INSTALLER_MSG_WARNINGS_UPLOADBIGGERTHANPOSTDESC="Vrednost upload_max_filesize u datoteci php.ini veća je od promenljive post_max_size. Promenljiva post_max_size imaće prednost i blokiraće zahteve veće od nje. Ovo je obično pogrešna konfiguracija servera kada se pokušava povećati veličina otpremanja. Povećajte vrednost post_max_size tako da bude veća od vrednosti upload_max_filesize."
