COM_USERS_POSTINSTALL_MULTIFACTORAUTH_BODY="<p>Joomla! dolazi sa drastično unapređenim iskustvom <a href=\"https://en.wikipedia.org/wiki/Multi-factor_authentication\" target=\"_blank\" rel=\"noopener noreferrer\">višefaktorske autentifikacije</a> koje vam pomaže da obezbedite prijave svojih korisnika.</p><p>Za razliku od funkcije dvofaktorske autentifikacije u ranijim verzijama Joomle, korisnici <em>više ne moraju da unose bezbednosni kod zajedno sa korisničkim imenom i lozinkom</em>. Višefaktorska autentifikacija se obavlja u posebnom koraku nakon prijave na sajt. Dok ne završe validaciju višefaktorske autentifikacije, korisnici ne mogu da pređu na druge stranice niti da koriste sajt. Zahvaljujući tome višefaktorska autentifikacija je otporna na <a href=\"https://en.wikipedia.org/wiki/Phishing\" target=\"_blank\" rel=\"noopener noreferrer\">fišing</a>&ndash;napade. Takođe omogućava interaktivne metode validacije kao što su passkeys (uključujući integraciju sa Windows Hello, Apple TouchID / FaceID i biometrijskim zaključavanjem ekrana na Androidu) ili slanje 6-cifrenih kodova za autentifikaciju putem email poruke. Oba ova interaktivna i praktična metoda sada su dostupna kao dodaci koji se isporučuju uz samu Joomlu.</p>"
