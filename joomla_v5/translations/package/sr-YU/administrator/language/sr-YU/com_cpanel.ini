COM_CPANEL_MSG_ADDNOSNIFF_BODY="<p>Joomla se sada isporučuje sa dodatnim bezbednosnim zaštitama u podrazumevanim datotekama htaccess.txt i web.config.txt. Te zaštite isključuju tzv. MIME-type sniffing, funkciju brauzera. Sniffing otvara specifične vektore napada, u kojima se skripte u inače bezopasnim formatima datoteka (npr. slikama) izvršavaju, što dovodi do ranjivosti tipa Cross-Site-Scripting.</p><p>Bezbednosni tim preporučuje da potrebne izmene ručno primenite na postojeće datoteke .htaccess ili web.config, jer se one ne mogu ažurirati automatski.</p><p><strong>Izmene za .htaccess</strong><br>Dodajte sledeće redove pre \"## Mod_rewrite in use.\":</p><pre>&lt;IfModule mod_headers.c&gt;\nHeader always set X-Content-Type-Options \"nosniff\"\n&lt;/IfModule&gt;</pre><p><strong>Izmene za web.config</strong><br>Dodajte sledeće redove odmah posle \"&lt;/rewrite&gt;\":</p><pre>&lt;httpProtocol&gt;\n  &lt;customHeaders&gt;\n    &lt;add name=\"X-Content-Type-Options\" value=\"nosniff\" /&gt;\n  &lt;/customHeaders&gt;\n&lt;/httpProtocol&gt;</pre>" ; Translators: Don't touch the code part in the message, Starting with ## Mod_rewrite &hellip;
COM_CPANEL_MSG_ADDNOSNIFF_TITLE="Bezbednosno ažuriranje datoteka .htaccess i web.config"
COM_CPANEL_MSG_HTACCESSSVG_BODY="<p>Od verzije 3.9.21 Joomla se isporučuje sa dodatnim bezbednosnim pravilom u podrazumevanoj datoteci htaccess.txt. Ovo pravilo štiti korisnike SVG datoteka od potencijalnih ranjivosti tipa Cross-Site-Scripting (XSS).<br>Bezbednosni tim preporučuje da potrebne izmene ručno primenite na svaku postojeću datoteku .htaccess, jer se ona ne može ažurirati automatski.</p><p><strong>Izmene za .htaccess</strong></p><pre>&lt;FilesMatch \"\.svg$\"&gt;\n  &lt;IfModule mod_headers.c&gt;\n    Header always set Content-Security-Policy \"script-src 'none'\"\n  &lt;/IfModule&gt;\n&lt;/FilesMatch&gt;</pre><p>Trenutno nam nije poznat način da se ovo uslovno podesi na IIS web serverima, pa se za dodatnu pomoć obratite svom hosting provajderu.</p>"
COM_CPANEL_MSG_HTACCESSSVG_TITLE="Dodatna XSS zaštita za korišćenje SVG datoteka"
COM_CPANEL_MSG_LANGUAGEACCESS340_BODY="Od verzije Joomla! 3.4.0 možete imati problema sa dodatkom Sistem - Jezički filter na vašem sajtu. Da biste ih rešili, otvorite <a href=\"index.php?option=com_languages&view=languages\">Menadžer jezika</a> i ručno sačuvajte svaki jezik sadržaja da biste bili sigurni da je nivo pristupa sačuvan."
COM_CPANEL_MSG_LANGUAGEACCESS340_TITLE="Imate moguće probleme sa višejezičkim podešavanjima"
COM_CPANEL_MSG_ROBOTS_BODY="Promena u podrazumevanim datotekama robots.txt, napravljena u Joomla! 3.3, omogućava Google-u pristup šablonima i datotekama medija radi boljeg SEO-a. Ova promena se ne primenjuje automatski pri nadogradnji, pa se korisnicima preporučuje da pregledaju izmene u datoteci robots.txt.dist i primene ih u sopstvenoj datoteci robots.txt."
COM_CPANEL_MSG_ROBOTS_TITLE="robots.txt izmena"
COM_CPANEL_MSG_STATS_COLLECTION_BODY="<p>Počev od Joomla! 3.5, dodatak za statistiku šalje anonimne podatke projektu Joomla. Šalju se samo verzija Joomla, verzija PHP-a, vrsta i verzija baze podataka i operativni sistem servera.</p><p>Ovi podaci se prikupljaju da bi buduće verzije Joomla mogle da iskoriste najnovije mogućnosti baze podataka i PHP-a bez uticaja na veliki broj korisnika. Potreba za tim postala je jasna kada je za Joomla! 3.3, koja je uvela bezbednije Bcrypt lozinke, bio potreban najmanje PHP 5.3.10.</p><p>U interesu potpune transparentnosti i radi pomoći programerima, <a href=\"https://developer.joomla.org/about/stats.html\" target=\"_blank\" rel=\"noopener noreferrer\">ovi podaci su javno dostupni.</a> API i grafikoni prikazuju verzije Joomla, verzije PHP-a i vrste baza podataka koje se koriste.</p><p>Ako ne želite da projektu Joomla dostavljate ove informacije, možete onemogućiti dodatak Sistem - Joomla statistika.</p>"
COM_CPANEL_MSG_STATS_COLLECTION_TITLE="Prikupljanje statistike u Joomli"
COM_CPANEL_MSG_TEXTFILTER3919_BODY="<p>U okviru pregleda našeg bezbednosnog tima napravili smo neke izmene podrazumevanih podešavanja globalnih filtera teksta u novoj Joomla instalaciji. Podrazumevano podešavanje za grupe 'Public', 'Guest' i 'Registered' sada je 'No HTML'. Pošto se ove izmene primenjuju samo na nove instalacije, toplo preporučujemo da ih pregledate i ažurirate svoj sajt u: Sistem &rarr; Globalna konfiguracija &rarr; Filteri teksta</p>"
COM_CPANEL_MSG_TEXTFILTER3919_TITLE="Ažurirane preporuke za tekstualne filtere"
