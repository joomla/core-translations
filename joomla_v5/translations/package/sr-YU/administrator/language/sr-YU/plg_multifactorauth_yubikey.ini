PLG_MULTIFACTORAUTH_YUBIKEY="Višefaktorska autentifikacija - YubiKey"
PLG_MULTIFACTORAUTH_YUBIKEY_CODE_LABEL="YubiKey kod"
PLG_MULTIFACTORAUTH_YUBIKEY_LBL_AFTERSETUP_INSTRUCTIONS="Već ste podesili svoj YubiKey (onaj koji generiše kodove koji počinju sa <code>%s</code>). Njegov naslov možete promeniti samo sa ove stranice."
PLG_MULTIFACTORAUTH_YUBIKEY_LBL_SETUP_INSTRUCTIONS="Navedite kod koji je generisao vaš <a href=\"https://www.yubico.com\" target=\"_blank\" rel=\"noopener noreferrer\">YubiKey</a> ispod, a zatim kliknite ili dodirnite dugme Potvrdi. Prvih dvanaest znakova, koji su jedinstveni identifikacioni kod za vaš YubiKey, biće sačuvani."
PLG_MULTIFACTORAUTH_YUBIKEY_METHOD_TITLE="YubiKey"
PLG_MULTIFACTORAUTH_YUBIKEY_SHORTINFO="Koristite YubiKey bezbedne hardverske tokene."
PLG_MULTIFACTORAUTH_YUBIKEY_XML_DESCRIPTION="Omogućava korisnicima na vašem sajtu da koriste višefaktorsku autentifikaciju pomoću YubiKey bezbednog hardverskog tokena. Korisnicima je potreban sopstveni YubiKey, dostupan na <a href=\"https://www.yubico.com\" target=\"_blank\" rel=\"noopener noreferrer\">www.yubico.com</a>. Da bi koristili višefaktorsku autentifikaciju, korisnici moraju da urede svoj korisnički profil i omoguće višefaktorsku autentifikaciju."

