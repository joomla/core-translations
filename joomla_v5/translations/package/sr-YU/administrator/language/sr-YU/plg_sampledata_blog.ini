PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_2_INTROIMAGE_ALT="Prelepa Andromeda galaksija"
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_2_INTROTEXT="<p>Ovo je primer blog objave.</p><p>Ako se prijavite na sajt (link za administratorsku prijavu je na samom dnu ove stranice), moći ćete da uređujete nju i sve ostale postojeće članke. Takođe ćete moći da kreirate novi članak i pravite druge izmene na sajtu.</p><p>Dok dodajete i menjate članke, videćete kako se vaš sajt menja i kako ga možete prilagoditi na razne načine.</p><p>Samo napred, ne možete ga pokvariti.</p>"
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_2_TITLE="Dobrodošli na vaš blog"
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_3_FIELD_0="Zelje od repe, hajdučka trava, pirinčani pasulj, endivija, karfiol, morska salata, keleraba, amarant, vodeni spanać, avokado, daikon, napa kupus, špargla, zimski portulak, kelj."
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_3_FULLTEXT="<p>Na stranici sa punim tekstom videćete i uvodni tekst i ostatak članka. Ako želite, možete promeniti podešavanja da biste sakrili uvod.</p>"
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_3_INTROTEXT="<p>Vaša početna stranica je podešena da prikazuje četiri najnovija članka iz kategorije bloga u jednoj koloni. Zatim slede linkovi ka naredna dva starija članka. Te brojeve možete promeniti u podešavanjima opcija sadržaja na kartici bloga u administraciji sajta. Ako ste prijavljeni, tu je i link ka administraciji sajta.</p><p>Ako želite da objava na blogu bude podeljena na dva dela, uvod i zasebnu stranicu sa punim tekstom, upotrebite element Pročitaj više da umetnete prelom.</p>"
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_3_TITLE="O vašoj početnoj stranici"
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_4_FULLTEXTIMAGE_ALT="Rakova maglina"
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_4_INTROTEXT="<p>Vaš sajt ima nekoliko često korišćenih modula koji su već unapred podešeni. To su:</p><ul><li>Slika (tip: Prilagođeno), koja prikazuje sliku ispod menija. Ovo je Prilagođeni modul koji možete urediti da biste promenili sliku.</li><li>Popularne oznake (tip: Oznake - popularne), koje će se pojaviti ako koristite oznake na člancima. Prilikom uređivanja unesite oznaku u polje Oznake.</li><li>Stariji postovi (tip: Članci), koji izlistava članke po kategorijama.</li><li>Sindikacija (tip: Izvori sindikacije), koja vašim čitaocima omogućava da čitaju vaše postove u čitaču vesti.</li><li>Formular za prijavu (tip: Prijava), koji vašim korisnicima omogućava pristup zaštićenim oblastima sajta.</li></ul><p>Svaki od ovih modula ima mnogo opcija sa kojima možete eksperimentisati u Upravljaču modulima u administraciji vašeg sajta. Kada ste prijavljeni, možete izabrati i ikonu za uređivanje u gornjem desnom uglu, koja vodi na ekran za uređivanje tog modula. Uvek obavezno sačuvajte i zatvorite svaki modul koji uređujete.</p><p>Joomla! uključuje i mnoge druge module koje možete ugraditi u svoj sajt. Kako budete razvijali sajt, možda ćete želeti da dodate još modula koje možete pronaći u <a href=\"https://extensions.joomla.org/\" target=\"_blank\" rel=\"noopener noreferrer\">Joomla direktorijumu ekstenzija.</a></p>"
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_4_TITLE="Vaši moduli"
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_5_INTROTEXT="<p>Šabloni kontrolišu izgled vašeg sajta.</p><p>Ovaj blog je instaliran sa šablonom Cassiopeia.</p><p>Opcije možete urediti izborom stavke Radite na vašoj stranici, Podešavanje šablona u meniju koji je vidljiv kada se prijavite.</p><p>Na primer, možete promeniti boju pozadine sajta, boju isticanja, naslov sajta, opis sajta i korišćeni font naslova.</p><p>Dodatne opcije su dostupne u administraciji sajta. Takođe možete instalirati nov šablon pomoću upravljača ekstenzijama.</p>"
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_5_TITLE="Vaš šablon"
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_6_FULLTEXT="<p>Lorem ipsum dolor sit amet, consetetur sadipscing elitr, sed diam nonumy eirmod tempor invidunt ut labore et dolore magna aliquyam erat, sed diam voluptua. At vero eos et accusam et justo duo dolores et ea rebum. Stet clita kasd gubergren, no sea takimata sanctus est</p>"
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_6_INTROTEXT="<p><strong>Milioni sajtova su izgrađeni na Joomli!</strong></p><p>Saznajte više o prelepom prikazivanju bloga.</p>"
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_6_TITLE="Milioni"
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_7_FULLTEXT="<p>Zelje od repe, hajdučka trava, pirinčani pasulj, repa, endivija, karfiol, morska salata, keleraba, amarant, vodeni spanać, avokado, daikon, napa kupus, špargla, zimski portulak, kelj. Celer, krompir, mladi luk, pustinjsko grožđe, ren, spanać, šargarepa, soko. Koren lotosa, vodeni spanać, morač, kombu, kukuruz, izdanci bambusa, boranija, blitva, morski kelj, bundeva, luk, leblebija, grah, kukuruz, grašak. Prokelj, koriander, vodeni kesten, tikva, blitva, vakame, keleraba, cvekla, šargarepa, potočarka. Kukuruz, amarant, kozja brada, bunya orasi, nori, azuki pasulj, mišjakinja, krompir, paprika, artičoka.</p> "
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_7_INTROTEXT="<p><strong>Mi volimo Joomla! do meseca i nazad!</strong></p><p>Hvala svim volonterima na pomoći!</p>"
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_7_TITLE="Ljubav"
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_8_FULLTEXT="<p>Cupcake ipsum dolor. Sit amet cotton candy ice cream sesame snaps cake marshmallow powder. Ice cream chocolate cake marshmallow halvah bonbon. Dragée carrot cake danish candy muffin brownie. Candy sugar plum ice cream chupa chups macaroon tiramisu soufflé oat cake. Topping cheesecake lollipop gummi bears icing sweet roll donut liquorice. Pie jelly-o candy donut oat cake cotton candy. </p>"
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_8_INTROTEXT="<p><strong>Ponosno predstavljamo Joomla verziju 5!</strong></p><p>Naučite više o tokovima rada u Joomli.</p>"
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_8_TITLE="Joomla"
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_9_FIELD_0="Lorem ipsum dolor sit amet, consetetur sadipscing elitr, sed diam nonumy eirmod tempor invidunt ut labore et dolore magna aliquyam erat, sed diam voluptua."
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_9_INTROTEXT="<p>Tokovi rada upravljaju fazama kroz koje članci moraju proći dok ne budu objavljeni.</p><p>Komponenta za upravljanje tokovima rada nije podrazumevano omogućena.</p><p>Da biste videli tok rada koji smo obezbedili uz probne podatke, prvo morate omogućiti ovu funkcionalnost.</p><ol><li>Pristupite administraciji</li><li>Iz 'Sadržaj' > 'Članci' > 'Opcije' > kartica 'Integracija' postavite 'Omogućite tok rada' na 'Da'</li><li>Sačuvajte promene</li></ol><p>Kada ponovo otvorite 'Sadržaj', videćete odeljak 'Tok rada'.</p><p>Kada uređujete članak, videćete i nove prelaze za članke povezane sa tokovima rada.</p>"
PLG_SAMPLEDATA_BLOG_SAMPLEDATA_CONTENT_ARTICLE_9_TITLE="Tokovi rada"
