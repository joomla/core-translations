COM_PRIVACY_CONFIRM_REQUEST_FIELDSET_LABEL="Email poruka je poslata na vašu email adresu. Nalepite token za potvrdu iz email poruke u polje ispod da biste dokazali da ste vlasnik informacija koje se zahtevaju."
COM_PRIVACY_CONFIRM_REQUEST_SUCCEEDED="Vaš zahtev za informacijama je potvrđen. Obradićemo vaš zahtev što je pre moguće, a izvezeni podaci će biti poslati na vašu email adresu."
COM_PRIVACY_CREATE_REQUEST_SUCCEEDED="Vaš zahtev za informacijama je kreiran. Pre nego što se može obraditi, morate potvrditi ovaj zahtev. Na vašu adresu je poslata email poruka sa dodatnim uputstvima za završetak ove potvrde."
COM_PRIVACY_EMAIL_REQUEST_BODY_EXPORT_REQUEST="Neko je kreirao zahtev za izvoz svih ličnih podataka koji se odnose na ovu email adresu na {URL}. Kao bezbednosnu meru, morate potvrditi da je ovo ispravan zahtev za izvoz vaših ličnih podataka sa ovog sajta.\n\nAko je ovo bila greška, zanemarite ovu email poruku i ništa se neće dogoditi.\n\nDa biste potvrdili ovaj zahtev, možete izvršiti jedan od sledećih zadataka:\n\n1. Posetite sledeći URL: {TOKENURL}\n\n2. Kopirajte svoj token iz ove email poruke, posetite navedeni URL i zalepite svoj token u obrazac.\nURL: {FORMURL}\nToken: {TOKEN}\n\nNapominjemo da ovaj token važi samo 24 sata od trenutka kad je email poruka poslata."
COM_PRIVACY_EMAIL_REQUEST_BODY_REMOVE_REQUEST="Neko je kreirao zahtev za uklanjanje svih ličnih podataka koji se odnose na ovu email adresu na {URL}. Kao bezbednosnu meru, morate potvrditi da je ovo ispravan zahtev za uklanjanje vaših ličnih podataka sa ovog sajta.\n\nAko je ovo bila greška, zanemarite ovu email poruku i ništa se neće dogoditi.\n\nDa biste potvrdili ovaj zahtev, možete izvršiti jedan od sledećih zadataka:\n\n1. Posetite sledeći URL: {TOKENURL}\n\n2. Kopirajte svoj token iz ove email poruke, posetite navedeni URL i zalepite svoj token u formu.\nURL: {FORMURL}\nToken: {TOKEN}\n\nNapominjemo da ovaj token vredi samo 24 sata od trenutka kad je email poruka poslata."
