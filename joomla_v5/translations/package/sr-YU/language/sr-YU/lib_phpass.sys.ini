LIB_PHPASS="phpass"
LIB_PHPASS_XML_DESCRIPTION="phpass je prenosiv okvir za heširanje lozinki za upotrebu u PHP aplikacijama. Poželjni (najbezbedniji) metod heširanja koji phpass podržava je bcrypt u OpenBSD stilu (u PHP-u poznat kao CRYPT_BLOWFISH), sa rezervnom opcijom proširenih heševa zasnovanih na DES-u u BSDI stilu (u PHP-u poznatih kao CRYPT_EXT_DES) i poslednjom rezervnom opcijom, metodom heširanja lozinki zasnovanim na MD5 sa promenljivim brojem iteracija, implementiranim u samom phpass-u."

