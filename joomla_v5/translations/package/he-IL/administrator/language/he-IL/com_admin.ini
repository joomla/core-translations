COM_ADMIN_POSTINSTALL_MSG_BEHIND_LOAD_BALANCER_ACTION="אפשר הגדרת Load Balancer"
COM_ADMIN_POSTINSTALL_MSG_BEHIND_LOAD_BALANCER_DESCRIPTION="<p>For Joomla sites hosted behind Load Balancers and Reverse Proxies a new Global Configuration setting has been introduced with Joomla 3.9.26</p><p>This setting, when enabled, will allow your Load Balancer/Reverse Proxy to provide the real IP address of your visitors. This IP will then be used in your Action Logs and used for tracking voting on articles (if these features are enabled).</p><p><strong>Only sites behind a Load Balancer/Reverse Proxy will wish to enable this feature.</strong></p>"
COM_ADMIN_POSTINSTALL_MSG_BEHIND_LOAD_BALANCER_TITLE="New Server Setting \"Behind Load Balancer\""
COM_ADMIN_POSTINSTALL_MSG_HTACCESS_AUTOINDEX_DESCRIPTION="<p>Before 3.9.22 the default htaccess.txt file contained erroneous code meant for disabling directory listings. The security team recommends to manually apply the necessary changes to any existing .htaccess file, as this file can not be updated automatically.</p><p>The old code:</p><pre>&lt;IfModule autoindex&gt;\n  IndexIgnore *\n&lt;/IfModule&gt;</pre><p>The new code:</p><pre>&lt;IfModule mod_autoindex.c&gt;\n  IndexIgnore *\n&lt;/IfModule&gt;</pre>"
COM_ADMIN_POSTINSTALL_MSG_HTACCESS_AUTOINDEX_TITLE="עדכון קובץ htaccess ברשימת הספריות הרלוונטיות"
COM_ADMIN_POSTINSTALL_MSG_HTACCESS_BROTLI_DESCRIPTION="<p>לפני גרסה 5.1.0 קובץ htaccess.txt ברירת המחדל לא תמך בדחיסת Brotli. עלול לגרום לשגיאות דחיסה כפולה כאשר Joomla מותקן על שרת שמשתמש בדחיסת Brotli. עליך להחיל ידנית את השינויים הנדרשים על כל קובץ .htaccess קיים, מכיוון שקובץ זה לא ניתן לעדכון אוטומטי.</p><p>הקוד הישן:</p><pre>RewriteRule \"\.css\.gz$\" \"-\" [T=text/css,E=no-gzip:1]<br>RewriteRule \"\.js\.gz$\" \"-\" [T=text/javascript,E=no-gzip:1]</pre><p>הקוד החדש:</p><pre>RewriteRule \"\.css\.gz$\" \"-\" [T=text/css,E=no-gzip:1,E=no-brotli:1]<br>RewriteRule \"\.js\.gz$\" \"-\" [T=text/javascript,E=no-gzip:1,E=no-brotli:1]</pre>"
COM_ADMIN_POSTINSTALL_MSG_HTACCESS_BROTLI_TITLE="htaccess עידכון דחיסת קובץ Brotli"
COM_ADMIN_POSTINSTALL_MSG_HTACCESS_SETCE_DESCRIPTION="<p>לפני גירסה 4.2.9 קובץ ברירת המחדל htaccess.txt הכיל קוד שגוי להוספת כותרת ה-HTTP \"קידוד תוכן\". הדבר עלול לגרום לשגיאות קידוד כפול כאשר ג'ומלה מותקנת בספריית משנה וגם ספרייה זו וגם ספריית האב שלה מכילות קובץ .htaccess עם קוד זה. עליך להחיל באופן ידני את השינויים הדרושים על כל קובץ .htaccess קיים, מכיוון שלא ניתן לעדכן קובץ זה באופן אוטומטי.</p><p>הקוד הישן:</p><pre>Header add Content-Encoding gzip</pre><p>הקוד החדש:</p><pre>Header set Content-Encoding gzip</pre>"
COM_ADMIN_POSTINSTALL_MSG_HTACCESS_SETCE_TITLE="עדכון.htaccess לגבי הגדרת הכותרת של קידוד התוכן"
