PLG_CONTENT_PAGEBREAK_XML_DESCRIPTION="<p>מאפשר יצירת מאמר מחולק לעמודים עם תוכן עניינים אופציונלי.</p><p>הכנס מעברי עמוד באמצעות כפתור מעבר העמוד שנמצא בדרך כלל בסרגל הכלים של עורך ה-WYSIWYG. מיקום מעבר העמוד במאמר יוצג בעורך כקו אופקי פשוט.</p><p>הטקסט המוצג תלוי באפשרויות שנבחרו, והוא עשוי להיות הכותרת, הטקסט החלופי (אם סופק) או מספרי העמודים.</p><p>אופן השימוש ב-HTML:<br>&lt;hr class=&quot;system-pagebreak&quot; /&gt;<br>&lt;hr class=&quot;system-pagebreak&quot; title=&quot;The page title&quot; /&gt; או <br>&lt;hr class=&quot;system-pagebreak&quot; alt=&quot;The first page&quot; /&gt; או <br>&lt;hr class=&quot;system-pagebreak&quot; title=&quot;The page title&quot; alt=&quot;The first page&quot; /&gt; או <br>&lt;hr class=&quot;system-pagebreak&quot; alt=&quot;The first page&quot; title=&quot;The page title&quot; /&gt;</p>"

