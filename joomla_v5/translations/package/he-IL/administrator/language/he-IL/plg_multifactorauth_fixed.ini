PLG_MULTIFACTORAUTH_FIXED_LBL_POSTMESSAGE="<p class=\"alert alert-info\">ההודעות שמופיעות מעל ומתחת לאזור הקוד יכולות להיות מותאמות על-ידי דריסת מחרוזות השפה <code>PLG_MULTIFACTORAUTH_FIXED_LBL_PREMESSAGE</code> וגם <code>PLG_MULTIFACTORAUTH_FIXED_LBL_POSTMESSAGE</code>.</p>"
PLG_MULTIFACTORAUTH_FIXED_LBL_PREMESSAGE="<p>זוהי הדגמה של תוסף אימות רב-שלבי לג'ומלה. אתה צריך להקליד את הקוד הקבוע שהגדרת כאשר איפשרת שיטת אימות רב-לשבי למשתמש זה. זה עובד למעשה כסיסמא נוספת. </p>"
PLG_MULTIFACTORAUTH_FIXED_LBL_SETUP_POSTMESSAGE="<p class=\"alert alert-info\">ההודעות שמופיעות מעל ומתחת לאזור הקוד יכולות להיות מותאמות על-ידי דריסת מחרוזות השפה <code>PLG_MULTIFACTORAUTH_FIXED_LBL_PREMESSAGE</code> וגם <code>PLG_MULTIFACTORAUTH_FIXED_LBL_POSTMESSAGE</code>.</p>"
PLG_MULTIFACTORAUTH_FIXED_LBL_SETUP_PREMESSAGE="<p>הזן קוד קבוע להלן. יהיה צורך להזין קוד קבוע זה לאחר ההתחברות, לפני שתוכל להשתמש באתר.</p>"
PLG_MULTIFACTORAUTH_FIXED_LBL_SHORTINFO="בחר קוד מוגדר מראש. <strong>להדגמה בלבד</strong>."
PLG_MULTIFACTORAUTH_FIXED_XML_DESCRIPTION="תוסף הדגמה לאימות רב-שלבי המשתמש בקוד קבוע (&ldquo;סיסמה שנייה&rdquo;). <strong>אין להשתמש בו באתרים פעילים, הוא אינו מאובטח.</strong> תוסף זה מיועד לשמש רק כדוגמה למפתחים המעוניינים ליצור תוספים משלהם."

