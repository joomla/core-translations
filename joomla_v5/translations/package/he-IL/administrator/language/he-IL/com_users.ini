COM_USERS_POSTINSTALL_MULTIFACTORAUTH_BODY="<p>Joomla! מגיעה עם חוויית <a href=\"https://en.wikipedia.org/wiki/Multi-factor_authentication\" target=\"_blank\" rel=\"noopener noreferrer\">אימות רב-שלבי</a> משופרת באופן משמעותי, שתעזור לך לאבטח את ההתחברויות של המשתמשים שלך.</p><p>בשונה מתכונת האימות הדו-שלבי בגרסאות קודמות של Joomla, המשתמשים <em>כבר אינם צריכים להזין קוד אבטחה יחד עם שם המשתמש והסיסמה</em>. האימות הרב-שלבי מתבצע בשלב נפרד לאחר ההתחברות לאתר. עד להשלמת אימות זה, המשתמשים אינם יכולים לעבור לדפים אחרים או להשתמש באתר. בזכות זאת האימות הרב-שלבי עמיד בפני <a href=\"https://en.wikipedia.org/wiki/Phishing\" target=\"_blank\" rel=\"noopener noreferrer\">פישינג</a>&ndash;ניסיונות התחזות וגניבת פרטים. הוא גם מאפשר שיטות אימות אינטראקטיביות כגון מפתחות גישה (כולל שילוב עם Windows Hello, Apple TouchID / FaceID ונעילת מסך ביומטרית של Android), או שליחת קודי אימות בני 6 ספרות בדוא״ל. שתי השיטות האינטראקטיביות והנוחות האלה זמינות כעת כתוספים שמגיעים יחד עם Joomla! עצמה.</p>"
