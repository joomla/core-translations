PLG_MULTIFACTORAUTH_YUBIKEY="אימות רב-שלבי - Yubikey"
PLG_MULTIFACTORAUTH_YUBIKEY_CAPTIVE_PROMPT="לחץ בתיבת הטקסט שלהלן. לאחר מכן הכנס את ה-YubiKey שלך ליציאת ה-USB של המכשיר וגע בדיסקית הזהב או במשטח הזהב שלו (בהתאם לדגם) כדי שייצר קוד YubiKey. אם אתה משתמש בטלפון או בטאבלט התומכים ב-NFC עם YubiKey התומך ב-NFC, עליך במקום זאת לקרב את ה-YubiKey לאזור קורא ה-NFC של הטלפון או הטאבלט."
PLG_MULTIFACTORAUTH_YUBIKEY_CODE_LABEL="קוד YubiKey"
PLG_MULTIFACTORAUTH_YUBIKEY_ERR_VALIDATIONFAILED="לא הזנת קוד סודי YubiKey חוקי או השרתים YubiCloud הם בלתי ניתן להשגה בזמן הזה."
PLG_MULTIFACTORAUTH_YUBIKEY_LBL_AFTERSETUP_INSTRUCTIONS="כבר הגדרת את ה-YubiKey שלך (זה שמייצר קודים המתחילים ב-<code>%s</code>). בדף זה ניתן לשנות רק את הכותרת שלו."
PLG_MULTIFACTORAUTH_YUBIKEY_LBL_SETUP_INSTRUCTIONS="בבקשה ספק קוד שחולל בידי ה <a href=\"https://www.yubico.com\" target=\"_blank\" rel=\"noopener noreferrer\">YubiKey</a> מטה ואז לחץ או גע בכפתור האישור. 12 התווים הראושנים, שהם קוד הזיהוי הייחודי לך יישמרו."
PLG_MULTIFACTORAUTH_YUBIKEY_LBL_SETUP_LABEL="זיהוי YubiKey"
PLG_MULTIFACTORAUTH_YUBIKEY_LBL_SETUP_PLACEHOLDER="הקלד קוד YubiKey"
PLG_MULTIFACTORAUTH_YUBIKEY_METHOD_TITLE="YubiKey"
PLG_MULTIFACTORAUTH_YUBIKEY_SHORTINFO="השתמש באסימוני קושחה מאובחטים של YubiKey."
PLG_MULTIFACTORAUTH_YUBIKEY_XML_DESCRIPTION="מאפשר למשתמשים באתר שלך להשתמש באימות רב-שלבי באמצעות אסימון חומרה מאובטחת YubiKey. המשתמשים צריכים משלהם Yubikey זמין מ <a href=\"https://www.yubico.com\" target=\"_blank\" rel=\"noopener noreferrer\">www.yubico.com</a>. כדי להשתמש באימות רב-שלבי משתמשים צריך לערוך את פרופיל המשתמש שלהם, לאפשר אימות רב-שלבי."

