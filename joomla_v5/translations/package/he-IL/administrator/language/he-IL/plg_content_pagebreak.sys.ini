PLG_CONTENT_PAGEBREAK="תוכן - שבירת עמוד"
PLG_CONTENT_PAGEBREAK_XML_DESCRIPTION="<p>מאפשר יצירת כתבה מחולקת לעמודים עם תוכן עניינים אופציונלי.</p><p>הכנס מעברי עמוד באמצעות כפתור מעבר העמוד הנמצא בדרך כלל בסרגל הכלים של עורך ה-WYSIWYG. מיקום מעבר העמוד בכתבה יוצג בעורך כקו אופקי פשוט.</p><p>הטקסט המוצג יהיה תלוי באפשרויות שנבחרו ועשוי להיות הכותרת, טקסט חלופי (אם סופק) או מספרי עמודים.</p><p>אופן השימוש ב-HTML הוא:<br>&lt;hr class=&quot;system-pagebreak&quot; /&gt;<br>&lt;hr class=&quot;system-pagebreak&quot; title=&quot;כותרת העמוד&quot; /&gt; או <br>&lt;hr class=&quot;system-pagebreak&quot; alt=&quot;העמוד הראשון&quot; /&gt; או <br>&lt;hr class=&quot;system-pagebreak&quot; title=&quot;כותרת העמוד&quot; alt=&quot;העמוד הראשון&quot; /&gt; או <br>&lt;hr class=&quot;system-pagebreak&quot; alt=&quot;העמוד הראשון&quot; title=&quot;כותרת העמוד&quot; /&gt;</p>"

