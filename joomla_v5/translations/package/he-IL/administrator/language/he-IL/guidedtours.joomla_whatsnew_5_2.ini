COM_GUIDEDTOURS_TOUR_WHATSNEW_5_2_DESCRIPTION="<h1 class=\"fw-medium\">ברוך הבא ל-Joomla 5.2!</h1><div class=\"row align-items-center mb-4 pt-4 border-top border-1\"><div class=\"col-md-6 col-lg-5 text-center text-md-start mb-3 mb-md-0\"><img class=\"img-fluid\" src=\"media/com_guidedtours/images/5_2/enhancedtourheader.png\" alt=\"השלב הראשון בסיור הפתיחה, המציג את המראה החדש של הכותרת\" width=\"640\" height=\"384\"></div><div class=\"col-md-6 col-lg-7\"><h2 class=\"mb-3\">עדכוני סיורים מודרכים</h2><h3>סיורים בהפעלה אוטומטית</h3><p>תכונה זו מאפשרת לך ליצור סיור מודרך משלך שמופעל אוטומטית. ניתן לבטל את הסיור ההקשרי עבור משתמש אחד או עבור כל המשתמשים. ניתן להפעיל את הסיורים מחדש מתפריט הסיורים המודרכים.</p><h3>שיפורים</h3><ul class=\"mb-3\"><li>לשם הבהירות, <em>מונה השלבים</em> הוצב ראשון בכותרת הסיור.</li><li>החלון הקופץ משנה את גודלו אוטומטית כדי להכיל תוכן ותמונות גדולים יותר.</li></ul></div></div><div class=\"row align-items-center border-top border-1 pt-4\"><div class=\"col-md-6 col-lg-7 mb-3\"><h2 class=\"mb-3\">עדכוני ליבה</h2><h3>מודול 'מאמרים' החדש, הכול-באחד</h3><p>השתמש במודול אחד כדי להציג מאמרים אחרונים, הנקראים ביותר, ספציפיים או מאורכבים, מקטגוריות נבחרות - עם מסננים, תגיות ועוד...</p><p>מתוך <span class=\"fw-medium\">תוכן -&gt; מודולי אתר</span>, צור מודול חדש מסוג 'מאמרים'.</p><h3>פריסת תבנית דואר</h3><p>התקדם צעד נוסף ביצירת פריסה ייחודית לחלוטין (כולל לוגו) שניתן להחיל על תבנית דואר אחת או על כולן.</p><p>מתוך <span class=\"fw-medium\">תצורה כללית -&gt; תבניות דואר</span>, ניתן להגדיר פריסות ב-HTML.</p><h3>שיפורים ותיקונים נוספים</h3><ul class=\"mb-3\"><li>תת-טפסים מקוננים - מאפשר קינון של תת-טופס בתוך שדה מותאם מסוג תת-טופס.</li><li>ספירה כוללת - מציג את הספירה ואת המספר הכולל של פריטי הרשימה בקונסולה.</li></ul></div><div class=\"col-md-6 col-lg-5\"><img class=\"img-fluid\" src=\"media/com_guidedtours/images/5_2/mailtemplate.png\" alt=\"דוגמה לתבנית דואר, כולל לוגו בכותרת וכותרת תחתונה\" width=\"640\" height=\"370\" loading=\"lazy\"></div></div>"
COM_GUIDEDTOURS_TOUR_WHATSNEW_5_2_TITLE="מה חדש ב-Joomla 5.2!"

