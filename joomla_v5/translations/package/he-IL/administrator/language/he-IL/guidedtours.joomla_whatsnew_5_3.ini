COM_GUIDEDTOURS_TOUR_WHATSNEW_5_3_DESCRIPTION="<h1 class=\"fw-medium\">ברוכים הבאים ל-Joomla 5.3!</h1><div class=\"row align-items-center mb-4 pt-4 border-top border-1\"><div class=\"col-md-6 col-lg-7\"><h2 class=\"mb-3\">עדכוני סיורים מודרכים</h2><p>לסיורים המודרכים יש כעת API משלהם. <a href=\"https://manual.joomla.org/docs/next/web-services-api/\" target=\"_blank\" rel=\"noopener noreferrer\">תיעוד ה-API של Joomla</a></p><p>הישארו מעודכנים לשיפורים חדשים נוספים שיגיעו בקרוב!</p></div></div><div class=\"row align-items-center border-top border-1 pt-4\"><div class=\"col-md-6 col-lg-5 text-center text-md-start mb-3 mb-md-0\"><img class=\"img-fluid\" src=\"media/com_guidedtours/images/5_3/filesdirectory.jpg\" alt=\"השלב הראשון בסיור הפתיחה, המציג את תיקיית קבצי המדיה החדשה\" width=\"521\" height=\"304\"></div><div class=\"col-md-6 col-lg-7 mb-3\"><h2 class=\"mb-3\">עדכוני ליבה</h2><h3 class=\"mb-3\">ארגון קבצים במיקום משלהם</h3><p>כעת ניתן לצפות במסמכים שאוחסנו/הועלו ולבחור אותם ישירות ממנהל המדיה. מידע נוסף ניתן למצוא ב<a href=\"https://magazine.joomla.org/all-issues/december-2024/document-uploads-on-your-joomla-website\" target=\"_blank\" rel=\"noopener noreferrer\">מגזין קהילת Joomla</a>.</p><h3 class=\"mb-3\">צפייה בהיסטוריית המשימות המתוזמנות</h3><p>כעת ניתן לצפות במידע על ההרצות ישירות בממשק הניהול, ללא צורך לגשת לקובצי יומן. חפש את הכפתור <strong>היסטוריית הרצה</strong> שנמצא בדף המשימות המתוזמנות.</p><h3>שיפורים ותיקונים נוספים</h3><ul class=\"mb-3\"><li>השוואת דריסות תבנית של תוספים - מוסיף יכולת השוואה לדריסות של תוספים</li><li>תיקון חיפוש כינוי תגית - כעת במקום מספר המזהה של התגית מוצג שם התגית בכתובת ה-URL</li></ul></div></div>"
COM_GUIDEDTOURS_TOUR_WHATSNEW_5_3_TITLE="מה חדש ב-Joomla 5.3!"

