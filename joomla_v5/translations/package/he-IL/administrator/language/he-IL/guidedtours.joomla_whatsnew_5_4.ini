COM_GUIDEDTOURS_TOUR_WHATSNEW_5_4_DESCRIPTION="<h1 class=\"fw-medium\">ברוכים הבאים ל-Joomla 5.4!</h1><div class=\"row align-items-center border-top border-1 pt-4\"><div class=\"col-md-6 col-lg-5 text-center text-md-start mb-3 mb-md-0\"><img class=\"img-fluid\" src=\"media/com_guidedtours/images/5_4/automated-updates.jpg\" alt=\"התראה בלוח הבקרה של ממשק הניהול, שבה מוצג סמל העדכונים האוטומטיים החדש להפעלת עדכונים אוטומטיים\" width=\"774\" height=\"281\"></div><div class=\"col-md-6 col-lg-7 mb-3\"><h2 class=\"mb-3\">העדכונים האוטומטיים כבר כאן!</h2><p>Joomla! 5.4 תומכת כעת בעדכונים אוטומטיים לשיפור האבטחה והביצועים.</p><p><strong>הישארו בטוחים ומאובטחים!</strong></p></div></div>"
