COM_GUIDEDTOURS_TOUR_GUIDEDTOURSTEPS_STEP_TYPE_TITLE="בחר את הסוג"
COM_GUIDEDTOURS_TOUR_GUIDEDTOURSTEPS_STEP_TYPE_DESCRIPTION="זהו סוג השלב שברצונך ליצור. 'הבא' לאפשר לסיור להמשיך ללא אינטראקציה, 'הפנייה' לעבור לדף אחר, 'אינטראקטיבי' לבקש קלט מהמשתמש."

COM_GUIDEDTOURS_TOUR_GUIDEDTOURSTEPS_STEP_SAVECLOSE_TITLE="בחר 'שמירה וסגירה'"
