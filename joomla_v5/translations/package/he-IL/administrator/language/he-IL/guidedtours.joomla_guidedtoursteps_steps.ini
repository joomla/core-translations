COM_GUIDEDTOURS_TOUR_GUIDEDTOURSTEPS_STEP_POSITION_TITLE="בחירת מיקום"
COM_GUIDEDTOURS_TOUR_GUIDEDTOURSTEPS_STEP_POSITION_DESCRIPTION="זה המיקום של החלון הקופץ ביחס לאלמנט שאתה מכוון אליו בדף. 'מרוכז' משמש כאשר אין יעד ספציפי."

COM_GUIDEDTOURS_TOUR_GUIDEDTOURSTEPS_STEP_TARGET_TITLE="הזן את אלמנט היעד"
