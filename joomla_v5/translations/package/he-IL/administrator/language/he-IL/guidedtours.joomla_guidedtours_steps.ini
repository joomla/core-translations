COM_GUIDEDTOURS_TOUR_GUIDEDTOURS_STEP_CONTENT_TITLE="הוסף תוכן"
COM_GUIDEDTOURS_TOUR_GUIDEDTOURS_STEP_CONTENT_DESCRIPTION="הזן תוכן המתאר את הסיור."

COM_GUIDEDTOURS_TOUR_GUIDEDTOURS_STEP_COMPONENT_TITLE="בחר רכיב"
COM_GUIDEDTOURS_TOUR_GUIDEDTOURS_STEP_COMPONENT_DESCRIPTION="בחר את התוספים שבהם תרצה להציג את הסיור שלך בעדיפות ברשימת הסיורים האפשריים להפעלה. לדוגמה, אם אתה יוצר סיור עבור התוסף 'משתמשים', בחר 'משתמשים'. בחר 'הכל' כדי שהסיור יופיע בכל עמוד."

COM_GUIDEDTOURS_TOUR_GUIDEDTOURS_STEP_URL_TITLE="הוספת כתובת אתר"
COM_GUIDEDTOURS_TOUR_GUIDEDTOURS_STEP_URL_DESCRIPTION="הזן את הכתובת היחסית של הדף שבו הסיור חייב להתחיל. לדוגמה, הזן <em>administrator/index.php?option=com_users&view=users</em> כדי להתחיל את הסיור בדף המשתמשים."

COM_GUIDEDTOURS_TOUR_GUIDEDTOURS_STEP_AUTOSTART_TITLE="הפעל/כבה 'התחלה אוטומטית'"
COM_GUIDEDTOURS_TOUR_GUIDEDTOURS_STEP_AUTOSTART_DESCRIPTION="<p>הגדרת 'התחלה אוטומטית' ל-'כן' תפעיל את הסיור באופן אוטומטי ברגע שהתנאים הרלוונטיים מתקיימים.</p><p>אם מספר סיורים מוגדרים להתחלה אוטומטית תחת אותם תנאים, רק הסיור הראשון ברשימה יתחיל עד שהוא יבוטל, יושלם או ידלג עליו.</p>"

COM_GUIDEDTOURS_TOUR_GUIDEDTOURS_STEP_SAVECLOSE_TITLE="בחר 'שמירה וסגירה'"
COM_GUIDEDTOURS_TOUR_GUIDEDTOURS_STEP_SAVECLOSE_DESCRIPTION="שמירה וסגירה של הסיור."

