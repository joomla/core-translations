MOD_RELATED_XML_DESCRIPTION="מודול זה מציג מאמרים אחרים הקשורים למאמר הנצפה. הקשרים אלה נקבעים לפי מילות המפתח. <br>כל מילות המפתח של המאמר הנוכחי מושוות לכל מילות המפתח של כל שאר המאמרים שפורסמו. לדוגמה, ייתכן שיש לך מאמר על &quot;גידול תוכים&quot; ומאמר נוסף על &quot;גידול קקדו שחור ביד&quot;. אם תכלול את מילת המפתח &quot;תוכי&quot; בשני המאמרים, מודול הפריטים הקשורים יציג את המאמר &quot;גידול תוכים&quot; בעת הצפייה ב&quot;גידול קקדו שחור ביד&quot;, ולהפך."

